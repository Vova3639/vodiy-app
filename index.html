<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Водій</title>
<meta name="description" content="Облік прибутку, витрат і авто для водіїв таксі та кур'єрів.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Водій">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

:root{
  --bg:#F2F2F7; --bg-elev:#FFFFFF; --bg-grouped:#FFFFFF;
  --tx:#0C0C0E; --tx2:#6C6C70; --tx3:#AEAEB2;
  --sep:rgba(60,60,67,0.32); --sep-op:rgba(60,60,67,0.13);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE; --teal:#30B0C7;
  --fill:rgba(120,120,128,0.12); --fill2:rgba(120,120,128,0.08);
  --shadow:0 1px 3px rgba(0,0,0,0.05), 0 10px 28px rgba(0,0,0,0.06);
  --bar-bg:rgba(255,255,255,0.72);
  --canvas:#E3E3E8;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#1C1C1E; --bg-grouped:#1C1C1E;
    --tx:#F5F5F7; --tx2:#98989D; --tx3:#636366;
    --sep:rgba(84,84,88,0.6); --sep-op:rgba(84,84,88,0.32);
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
    --fill:rgba(120,120,128,0.24); --fill2:rgba(120,120,128,0.16);
    --shadow:0 1px 3px rgba(0,0,0,0.32), 0 10px 28px rgba(0,0,0,0.42);
    --bar-bg:rgba(28,28,30,0.72);
    --canvas:#050505;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --bg-grouped:#1C1C1E;
  --tx:#F5F5F7; --tx2:#98989D; --tx3:#636366;
  --sep:rgba(84,84,88,0.6); --sep-op:rgba(84,84,88,0.32);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
  --fill:rgba(120,120,128,0.24); --fill2:rgba(120,120,128,0.16);
  --shadow:0 1px 3px rgba(0,0,0,0.32), 0 10px 28px rgba(0,0,0,0.42);
  --bar-bg:rgba(28,28,30,0.72);
  --canvas:#050505;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* Це застосунок для перегляду й швидкого введення даних, не для читання довгих текстів —
   вимикаємо виділення/спливне меню "Копіювати" при натисканні й утриманні всюди,
   крім полів вводу й текстових областей (їм воно потрібне, зокрема в розділі «Експорт»). */
*{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
input, textarea, [contenteditable="true"], [contenteditable=""]{
  -webkit-user-select:text; -moz-user-select:text; user-select:text; -webkit-touch-callout:default;
}
html{ touch-action:manipulation }
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.35; -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance}

/* ===== App shell ===== */
#app{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px)); min-height:100%; position:relative}
@media (min-width:640px){
  body{ background:var(--canvas) }
  #app{ max-width:640px; margin:0 auto; min-height:100vh; box-shadow:0 0 0 0.5px var(--sep), 0 24px 60px rgba(0,0,0,0.28) }
  .fullscreen{ width:100%; max-width:640px; margin:0 auto; box-shadow:0 0 0 0.5px var(--sep), 0 24px 60px rgba(0,0,0,0.28) }
}
.ptr-indicator{
  position:fixed; left:0; right:0; margin:0 auto; top:calc(52px + env(safe-area-inset-top,0px)); z-index:15;
  width:30px; height:30px; border-radius:50%; background:var(--bg-elev); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--tx2);
  opacity:0; transform:translateY(-20px); transition:opacity .15s ease; pointer-events:none;
}
.ptr-indicator.spin{ animation:ptrspin .6s linear infinite }
@keyframes ptrspin{ to{ transform:translateY(-20px) rotate(360deg) } }
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--bar-bg); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--sep);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 12px;
}
.topbar-row{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; max-width:600px; margin:0 auto}
.topbar .eyebrow{font-size:12px; font-weight:600; color:var(--tx2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1px}
.topbar h1{font-size:34px; font-weight:800; letter-spacing:-0.022em; line-height:1.1}
main{max-width:600px; margin:0 auto; padding:14px 16px calc(168px + env(safe-area-inset-bottom,0px))}
.demobar{background:var(--orange); color:#1a1200; font-size:12.5px; font-weight:700; text-align:center; padding:7px 10px; display:flex; align-items:center; justify-content:center; gap:8px}
.demobar button{background:rgba(0,0,0,0.18); border:0; color:inherit; font-weight:700; font-size:12px; padding:3px 9px; border-radius:20px}
.offlinebar{background:var(--fill); color:var(--tx2); font-size:12px; font-weight:600; text-align:center; padding:6px 10px; display:flex; align-items:center; justify-content:center; gap:6px}

/* ===== Tab bar ===== */
.tabbar{
  position:fixed; left:0; right:0; margin:0 auto; bottom:0; z-index:30;
  width:100%; max-width:600px;
  display:flex; background:var(--bar-bg);
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:0.5px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:640px){
  .tabbar{ border-left:0.5px solid var(--sep); border-right:0.5px solid var(--sep); border-radius:18px 18px 0 0; box-shadow:var(--shadow) }
}
.tabbar button{
  flex:1; background:none; border:0; padding:8px 2px 6px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--tx3); font-size:10.5px; font-weight:600;
}
.tabbar button svg{width:25px; height:25px; stroke:var(--tx3); fill:none; stroke-width:1.7}
.tabbar button.on{color:var(--blue)}
.tabbar button.on svg{stroke:var(--blue)}

/* ===== Segmented control ===== */
.seg{display:flex; background:var(--fill); border-radius:9px; padding:2px; gap:2px}
.seg button{flex:1; border:0; background:none; padding:6px 4px; border-radius:7px; color:var(--tx); font-size:12.5px; font-weight:600; white-space:nowrap}
.seg button.on{background:var(--bg-elev); box-shadow:var(--shadow)}
.segscroll{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:1px}
.segscroll::-webkit-scrollbar{display:none}
.segscroll button{flex:0 0 auto; border:0; background:var(--fill); padding:8px 13px; border-radius:9px; color:var(--tx); font-size:12.5px; font-weight:600; white-space:nowrap}
.segscroll button.on{background:var(--bg-elev); box-shadow:var(--shadow)}

/* ===== Tab grid (icon buttons instead of a hidden scroll strip) ===== */
.tabgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px}
.tabtile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:var(--bg-grouped); border:0; border-radius:15px; padding:11px 4px 9px;
  box-shadow:var(--shadow); color:var(--tx2); min-width:0;
}
.tabtile .ti{font-size:19px; line-height:1}
.tabtile .tl{font-size:10.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; color:inherit}
.tabtile.on{background:var(--blue); color:#fff; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18)}
@media (min-width:420px){ .tabgrid{grid-template-columns:repeat(5,1fr)} }

/* ===== Grouped list / cards ===== */
.section-label{font-size:12.5px; font-weight:700; color:var(--tx2); text-transform:uppercase; letter-spacing:0.045em; margin:22px 4px 7px; display:flex; align-items:center; justify-content:space-between}
.section-label:first-child{margin-top:2px}
.group{background:var(--bg-grouped); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.row{display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:0.5px solid var(--sep-op)}
.row:first-child{border-top:0}
.row .rtitle{flex:1; min-width:0}
.row .rtitle b{font-weight:600; display:block; font-size:15px}
.row .rtitle .sub{color:var(--tx2); font-size:12.5px; margin-top:1px}
.row .rval{font-weight:600; text-align:right; white-space:nowrap}
.chev{color:var(--tx3); font-size:18px; line-height:1; flex-shrink:0}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.icobadge{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff}
.dot.g{background:var(--green)} .dot.y{background:var(--orange)} .dot.r{background:var(--red)}
.infob{width:19px; height:19px; border-radius:50%; border:0; background:var(--fill); color:var(--tx2); font-size:11.5px; font-weight:700; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center}

/* ===== Swipe-to-delete rows ===== */
.swiperow{position:relative; overflow:hidden; border-top:0.5px solid var(--sep-op)}
.swiperow:first-child{border-top:0}
.swiperow .swipecontent{border-top:0; position:relative; z-index:1; background:var(--bg-grouped); transition:transform .18s ease}
.swiperow.swopen .swipecontent{transform:translateX(-84px)}
.swiperow.swdragging .swipecontent{transition:none}
.swipedel{position:absolute; top:0; right:0; bottom:0; width:84px; margin:0; padding:0; border:0; border-radius:0; outline:0; background:var(--red); color:#fff; font-size:13px; font-weight:600; z-index:0; -webkit-appearance:none; appearance:none; box-shadow:none}

/* ===== Big stat card ===== */
.hero{position:relative; overflow:hidden; background:radial-gradient(120% 140% at 100% 0%, #2A2D35 0%, #14161A 46%, #0B0C0F 100%); color:#fff; border-radius:var(--r-lg); padding:20px 20px 18px; box-shadow:var(--shadow); margin-bottom:12px; isolation:isolate}
.hero::before{content:''; position:absolute; inset:0; z-index:-1; background:radial-gradient(60% 90% at 105% -10%, var(--accent-glow, rgba(10,132,255,0.35)), transparent 60%)}
.hero .lbl{color:rgba(255,255,255,0.62); font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px}
.hero .big{font-size:38px; font-weight:800; letter-spacing:-0.025em; margin-top:3px; color:#fff}
.hero .sub{color:rgba(255,255,255,0.6); font-size:13px; margin-top:5px}
.hero.light{background:var(--bg-grouped); color:var(--tx)}
.hero.light::before{display:none}
.hero.light .lbl,.hero.light .sub{color:var(--tx2)}
.hero.light .big{color:var(--tx)}
.pos{color:var(--green)} .neg{color:var(--red)}
.hero .big.pos{color:#5FE08A} .hero .big.neg{color:#FF7B70}

.tilegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.tile{background:var(--bg-grouped); border-radius:var(--r-md); padding:13px 14px; box-shadow:var(--shadow)}
.tile .lbl{color:var(--tx2); font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px}
.tile .lbl .icobadge{width:22px; height:22px; border-radius:7px}
.tile .v{font-size:19px; font-weight:700; margin-top:6px}

/* ===== Quick-action pill row ===== */
.qarow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 14px}
.qapill{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 10px; border-radius:16px; border:0; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%}
.qapill.primary{background:var(--blue); color:#fff}
.qapill.green{background:var(--green); color:#fff}
.qapill.ghost{background:var(--fill); color:var(--tx)}
.qapill svg{flex-shrink:0}

/* ===== Bars breakdown ===== */
.barrow{padding:9px 14px}
.barrow .bhead{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px}
.barrow .bhead b{font-weight:600}
.btrack{height:7px; border-radius:4px; background:var(--fill); overflow:hidden}
.bfill{height:100%; border-radius:4px; transition:width .25s var(--spring)}
.catdrop{border-bottom:1px solid var(--sep)}
.catdrop:last-of-type{border-bottom:0}
.catdrop summary{list-style:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
.catdrop summary::-webkit-details-marker{display:none}
.catdrop summary .barrow{padding:9px 14px}
.catdrop[open] summary{padding-bottom:2px}
.catdrop-body{padding:0 14px 12px}
.catdrop-stats{display:flex; gap:8px; margin-bottom:8px}
.catdrop-stats>div{flex:1; background:var(--fill); border-radius:var(--r-sm); padding:8px 6px; text-align:center}
.catdrop-stats b{display:block; font-size:14px; font-weight:700}
.catdrop-stats span{display:block; font-size:10.5px; color:var(--tx2); margin-top:1px}
.catdrop-list{display:flex; flex-direction:column; gap:4px}
.catdrop-item{display:flex; justify-content:space-between; font-size:12.5px; color:var(--tx2); padding:3px 0}
.catdrop-item b{font-weight:600; color:var(--tx)}

/* ===== Forms ===== */
.field{margin-bottom:12px}
.field label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--tx2); margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:0.5px solid var(--sep); background:var(--fill2); color:var(--tx);
}
.field textarea{resize:vertical; min-height:56px}
.amtfield{margin:4px 0 16px; text-align:center}
.amtfield label{justify-content:center; margin-bottom:2px}
.amtwrap{display:flex; align-items:baseline; justify-content:center; gap:5px; min-width:0}
.amtwrap .cur{font-size:20px; font-weight:700; color:var(--tx2); flex-shrink:0}
.amtwrap input{width:100%; max-width:220px; min-width:0; border:0!important; background:transparent!important; padding:6px 2px!important; font-size:40px; font-weight:800; letter-spacing:-0.02em; text-align:center; color:var(--tx); outline:none; box-shadow:none; -webkit-tap-highlight-color:transparent}
.amtwrap input:focus{ color:var(--blue) }
.amtfield{ border-radius:var(--r-md); transition:background .15s ease }
.amtfield:focus-within{ background:var(--fill2) }
.amtfield.sm{background:var(--fill2); border-radius:var(--r-md); padding:8px 6px 10px; margin-bottom:0; min-width:0}
.amtfield.sm .amtwrap input{font-size:24px; max-width:100%}
.amtfield.sm .cur{font-size:15px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row2>*{min-width:0}
.platrow{display:grid; grid-template-columns:1fr 90px 26px; gap:8px; align-items:center; margin-bottom:8px}
.iconbtn{width:26px; height:26px; border-radius:50%; border:0; background:var(--fill); color:var(--tx2); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.chipwrap{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--sep); background:var(--fill2); color:var(--tx); padding:8px 13px; border-radius:20px; font-size:13.5px; font-weight:600}
.chip.on{background:var(--blue); border-color:var(--blue); color:#fff}
.codechip{display:inline-flex; align-items:center; gap:5px; border:1px dashed var(--sep); background:var(--fill2); color:var(--tx); padding:5px 9px; border-radius:9px; font-size:12.5px; font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:0.02em; cursor:pointer; white-space:nowrap}
.ctabtn{display:inline-block; background:var(--blue); color:#fff!important; font-weight:700; font-size:13px; padding:8px 14px; border-radius:20px; white-space:nowrap; text-decoration:none}
.ctacard{border-top:0.5px solid var(--sep-op); padding:12px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.ctacard:first-child{border-top:0}
.ctacard .rtitle{flex:1; min-width:140px}

.btn{display:block; width:100%; text-align:center; padding:13px; border-radius:var(--r-md); border:0; font-weight:600; font-size:15.5px}
.btn.primary{background:var(--blue); color:#fff}
.btn.ghost{background:var(--fill); color:var(--tx)}
.btn.danger{background:var(--red); color:#fff}
.btn.green{background:var(--green); color:#fff}
.btn.orange{background:var(--orange); color:#1a1200}
.btn.add{background:none; color:var(--blue); font-weight:600; padding:8px 0; text-align:left; width:auto}
.btnrow{display:flex; gap:8px}
.btnrow .btn{flex:1}

.fab{
  position:fixed; right:18px; bottom:calc(90px + env(safe-area-inset-bottom,0px)); z-index:25;
  width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; border:0;
  font-size:28px; font-weight:400; box-shadow:0 6px 18px rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:center;
}
.fab[hidden]{display:none!important}

#printArea{display:none}
.preport{font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#111; max-width:720px; margin:0 auto}
.preport h1{font-size:22px; margin:0 0 2px}
.preport .psub{color:#555; font-size:13px; margin-bottom:18px}
.preport table{width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12.5px}
.preport th,.preport td{text-align:left; padding:6px 8px; border-bottom:1px solid #ddd}
.preport th{background:#f2f2f2; font-weight:700}
.preport .ptotals{display:flex; gap:16px; margin-bottom:20px}
.preport .ptile{flex:1; border:1px solid #ddd; border-radius:8px; padding:10px 12px}
.preport .ptile .l{font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.02em}
.preport .ptile .v{font-size:18px; font-weight:700; margin-top:2px}
.preport h2{font-size:14px; margin:18px 0 8px}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block; position:absolute; left:0; top:0; width:100%}
}

/* ===== Sheet / modal ===== */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; isolation:isolate; display:flex; align-items:flex-end; justify-content:center}
.overlay.center{align-items:center; padding:24px}
.sheet{
  width:100%; max-width:600px; background:var(--bg-elev); border-radius:20px 20px 0 0;
  max-height:88vh; display:flex; flex-direction:column; touch-action:pan-y;
  animation:up .22s ease-out;
}
.sheet .sheethead{position:relative; flex-shrink:0; padding:14px 18px 0}
.sheet .sheetbody{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding:0 18px calc(22px + env(safe-area-inset-bottom,0px))}
.overlay.center .sheet{border-radius:18px; max-width:340px}
.overlay.center .sheet .sheethead{padding:20px 20px 0}
.overlay.center .sheet .sheetbody{padding:0 20px calc(18px + env(safe-area-inset-bottom,0px)); text-align:center}
@keyframes up{from{transform:translateY(24px); opacity:0.6} to{transform:translateY(0); opacity:1}}
.sheet .handle{width:36px; height:5px; background:var(--fill); border-radius:3px; margin:2px auto 12px}
.sheet .sheethead{touch-action:none}
.sheet h3{font-size:18px; font-weight:700; margin-bottom:2px}
.sheet .close{position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%; background:var(--fill); border:0; color:var(--tx2); font-size:15px; z-index:2}
.confirm-msg{color:var(--tx2); font-size:14px; margin:8px 0 18px; line-height:1.4; white-space:pre-line}
.confirm-actions{display:flex; flex-direction:column; gap:8px}

.topbar-actions{display:flex; align-items:center; gap:8px; margin-bottom:2px}

}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.activecard.paused .live{color:var(--orange)}

.activecard .timer{font-size:34px; font-weight:800; letter-spacing:0.01em; margin:6px 0 2px}

/* ===== Smooth / springy polish layer ===== */
:root{ --spring:cubic-bezier(0.32,0.72,0,1); --spring-bounce:cubic-bezier(0.34,1.56,0.64,1); }
@media (prefers-reduced-motion:no-preference){
  body{ animation:appin .3s var(--spring) }
  @keyframes appin{from{opacity:0} to{opacity:1}}
  .group,.tile,.hero,.activecard,.opt,.carcard,.ctacard{ transition:background-color .2s ease, box-shadow .2s ease, transform .15s var(--spring-bounce) }
  .btn,.chip,.seg button,.segscroll button,.fab,.gearbtn,.infob,.iconbtn,.ctabtn,.codechip,.tabbar button,.close,.swipedel,.opt{
    transition:transform .13s var(--spring-bounce), background-color .15s ease, color .15s ease, opacity .15s ease;
  }
  .btn:active,.chip:active,.ctabtn:active,.codechip:active,.fab:active,.iconbtn:active,.infob:active,.close:active,.opt:active{ transform:scale(0.95) }
  .tabbar button:active{ transform:scale(0.88) }
  .gearbtn:active{ transform:scale(0.88) rotate(-8deg) }
  .row[onclick],.swipecontent[onclick],.carcard[onclick],div[onclick].group,.opt{ transition:background-color .15s ease }
  .row[onclick]:active,.swipecontent[onclick]:active{ background:var(--fill2) }
  .hero[onclick]:active,.tile[onclick]:active,.activecard[onclick]:active,.carcard[onclick]:active,div[onclick].group:active{ transform:scale(0.97) }
  body{ transition:background-color .25s ease }
  .fab{ transition:transform .18s var(--spring-bounce), box-shadow .18s ease }
  .fab:active{ transform:scale(0.9); box-shadow:0 3px 10px rgba(0,0,0,0.22) }
  #main{ animation:mainfade .22s var(--spring) }
  @keyframes mainfade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
}
/* Sheet: Apple-style spring sheet with fade overlay, animated in and out */
.overlay{ animation:ovin .2s var(--spring) }
.overlay.closing{ animation:ovout .18s ease-in forwards }
@keyframes ovin{from{opacity:0} to{opacity:1}}
@keyframes ovout{from{opacity:1} to{opacity:0}}
.overlay.closing .sheet{ animation:sheetdown .18s cubic-bezier(0.36,0,0.66,-0.56) forwards }
.overlay.center.closing .sheet{ animation:sheetdownc .18s ease-in forwards }
@keyframes sheetdown{from{transform:translateY(0); opacity:1} to{transform:translateY(40px); opacity:0}}
@keyframes sheetdownc{from{transform:scale(1); opacity:1} to{transform:scale(0.92); opacity:0}}
/* Full-screen pages: slide up + fade, and slide down on close */
.fullscreen{ animation:fsin .26s var(--spring) }
.fullscreen.closing{ animation:fsout .2s ease-in forwards }
@keyframes fsin{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)}}
@keyframes fsout{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(14px)}}
/* Rounder "continuous corner" feel for iOS-26-style depth */
.group,.hero,.tile,.activecard,.opt,.carcard,.tabtile,.ctacard{ border-radius:var(--r-lg) }
.overlay .sheet{ border-radius:22px 22px 0 0 }
.overlay.center .sheet{ border-radius:20px }
.hero,.activecard{ box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08) }
.tabbar button svg,.tabbar button{ transition:transform .18s var(--spring-bounce), color .15s ease }
.tabbar button.on svg{ transform:translateY(-1px) scale(1.06) }

  {v:'0.9.12', date:'29.09.2026 11:19', items:['Після завершення зміни показує, наскільки цей дохід кращий чи гірший за вашу середню зміну','Порівняння «цей тиждень vs минулий» на дашборді тепер із наочними смужками, і його можна вимкнути в Налаштування → Вигляд','Кілька нових пресетів у швидких шаблонах витрат (мийка самообслуговування, незамерзайка, шиномонтаж)','Документи авто: при фотографуванні одразу обираєте тип (техпаспорт, права, ОСЦПВ, КАСКО тощо) замість автоназви','Страхування: додано поля «Страхова компанія» і «Номер полісу», можна прикріпити фото поліса','Кредит/лізинг: три схеми платежів на вибір — щомісячно (як було, тепер ще й з прогресом «виплачено X з Y»), щотижневий викуп (у гривнях чи доларах, з вказаним курсом), або свій довільний графік платежів — усе враховується в точці беззбитковості','«Поділитись застосунком» — у «Профілі» та в «Про розробника», з подякою й пропозицією підтримати донатом після поширення','Нові «Нотатки» в налаштуваннях — клієнти, адреси, чорний список чи будь-що своє, з тегами','Початок зміни тепер підказує платформу за часом доби, якщо є історія змін у цей час']},
  {v:'0.9.11', date:'29.09.2026 10:59', items:['У вкладці «Профіль»: кнопка «Усі налаштування» перенесена вище — одразу під швидкими перемикачами, а не в самому низу','Поруч із версією застосунку у «Профілі» — кнопка «Оновити»: перевіряє, чи є нова версія, і одразу пропонує оновитись, якщо є','Контакти майстрів і СТО: додано швидкі кнопки типових спеціалізацій (шиномонтаж, електрик, СТО, кузовний ремонт, мийка, діагностика) — не тільки вільний текст']},
  {v:'0.9.10', date:'29.09.2026 10:53', items:['Додавання платформи в Налаштування → Платформи: тепер зверху готові кнопки (Uklon, OnTaxi, Glovo, Bolt Food, iPost) — дотик одразу додає платформу з правильним типом і посиланням, а не лише вручну через назву']},
  {v:'0.9.9', date:'29.09.2026 10:20', items:['Ряд швидких кнопок на дашборді («Почати зміну», «Чи вигідне?», «Витрата», «Заправка») тепер акуратною сіткою 2×2 — усі видно одразу, без прокрутки вбік','Нагадування «Ще не робили резервну копію» більше не притискається впритул до плиток статистики нижче','Дотик на нагадування про резервну копію тепер відкриває вибір: зробити копію або приховати нагадування на 7 чи 30 днів — потім воно з’явиться знову']},
  {v:'0.9.8', date:'29.09.2026 10:08', items:['Нова вкладка «Профіль» у нижній панелі — фото та ім’я, швидке редагування типу роботи й ФОП прямо на вкладці, розділ «Знижки та бонуси» з реферальними посиланнями на платформи й сервіси, і кнопка переходу в повні налаштування — не лише через шестерню вгорі']},
  {v:'0.9.7', date:'29.09.2026 07:37', items:['Прибрано моргання індикатора демо-режиму/офлайн — вмикається з невеликою затримкою, а не одразу на кожне коливання з’єднання','Поле суми у формі витрати більше не має різкої синьої рамки й не «стрибає» від автофокусу — власний спокійний стиль полів, клавіатура з’являється лише після дотику','Шторки (вікна знизу) тепер реагують лише на вертикальний свайп — під час заповнення форми вміст не «пливе» вбік','Свайп між періодами тепер працює і в розділі «Витрати», і на вкладках «Заробіток»/«Історія» картки авто — не лише на головному дашборді','Дотик на авто в дашборді (у «По авто», нагадуваннях про шини чи ТО) відкриває невелике віконце з коротким оглядом і кнопками — а не одразу переносить у повний розділ авто; закривається назад тим самим рухом, що й інші шторки','Розділ «По категоріях» у витратах — тепер розкривні рядки: дотик показує кількість записів, частку від загальних витрат, середній чек і останні записи категорії','Мій гараж: перемикач вигляду карток авто — великі банери (як було) або компактний список — і можливість вручну змінити порядок авто стрілками']},
  {v:'0.9.6', date:'29.09.2026 07:16', items:['Вікна знизу (шторки) тепер можна закрити, потягнувши за смужку зверху вниз до кінця — не лише кнопкою «✕»','Виправлено накладання кнопки «+» на останнє нагадування на дашборді, коли записів мало','Виправлено горизонтальне прокручування у формі заправки/зарядки — поля «кВт·год/л» і «Вартість» тепер завжди поміщаються на екрані','Стабілізовано позицію нижньої панелі вкладок, яка могла злегка «пливти»']},
  {v:'0.9.5', date:'29.09.2026 01:31', items:['Теми застосунку в Налаштування → Вигляд: крім iOS 27 (типова), додано готові кольорові теми у стилі Uklon, OnTaxi, Glovo, Bolt і Uber — обирається одним дотиком','PDF-звіт значно розширено: тепер у ньому дохід по платформах, розбивка по авто, орієнтовний розрахунок податків і ЄСВ за період, пробіг і години','Нагадування про пальне/зарядку за пробігом тепер видно й на дашборді, не лише в картці авто — якщо термін ТО наближається чи вже прострочено','У формі заправки/зарядки можна вказати АЗС чи станцію — з’явився екран «Ціни по заправках» із середньою й останньою ціною по кожній','У порівнянні авто додано наочний графік прибутку на кілометр для кожного авто','Нова вкладка «Документи» в картці авто — фотографуйте страховку, техпаспорт, чеки з СТО і тримайте під рукою','Шаблони швидких витрат тепер зберігають ще й тип (робоча/особиста) та спосіб оплати, а не лише суму й категорію — можна створювати свої шаблони одним дотиком у формі витрати','Нагадування про сплату податків і ЄСВ — щомісяця у списку нагадувань на дашборді (вмикається в Налаштування → Профіль)','Видно, скільки місця займають дані на пристрої, і можна налаштувати, через скільки днів нагадувати про резервну копію','Індикатор офлайн-режиму — якщо немає інтернету, застосунок каже, що дані все одно в безпеці на пристрої']},
  {v:'0.9.4', date:'29.09.2026 01:09', items:['Великий редизайн у дусі свіжого iOS: емодзі в списках, картках і меню замінено на власний набір чітких векторних іконок у кольорових значках','Списки змін і витрат тепер групуються за датою («Сьогодні», «Вчора», далі за датами), з іконкою категорії біля кожного запису','Картка чистого прибутку на дашборді отримала глибший градієнт і акуратну іконку','Плитки статистики на дашборді («Змін», «Прибуток/год», «Пробіг», «Прибуток/км») тепер з іконками','Кнопки «Почати зміну» й «Чи вигідне замовлення?» замінено на компактний рядок швидких дій, що гортається вбік, і додано швидкий доступ до витрати й заправки','Поле суми у формах витрати й заправки — велике, по центру, у стилі калькулятора, щоб було зручніше вводити на ходу','Картки авто в гаражі тепер із банером фото (чи іконкою пального/зарядки) зверху та кольоровою крапкою стану','Порожні екрани (немає авто, змін, витрат) отримали іконку й дружніший текст замість голого рядка']},
  {v:'0.9.3', date:'29.09.2026 00:55', items:['Кнопка закриття шторки більше не зникає під час прокрутки її вмісту — тепер вона завжди на місці зверху','Фон більше не «прокручується» разом із відкритою шторкою чи вікном — сторінка позаду тепер зафіксована, поки дивишся деталі','Виправлено рідкісне накладання шапки з ефектом скла на вікна поверх неї','Застосунок адаптовано під планшети й комп’ютери — на широкому екрані вміст тепер акуратно по центру у вигляді картки, а не розтягнутий на всю ширину','Кнопка «Назад» на iPhone 16 Pro Max та подібних — перевірена і виправлена позиція']},
  {v:'0.9.2', date:'29.09.2026 00:42', items:['Перший крок редизайну (кольори, типографіка, форма елементів): точніший системний зелений колір, чіткіші роздільники карток, більший і виразніший заголовок вгорі екрана, жирніші заголовки розділів, заокругленіші картки й кнопки в дусі свіжого iOS — далі редизайн продовжимо по екранах']},
  {v:'0.9.1', date:'29.09.2026 00:39', items:['Кнопка «Назад» вгорі екранів налаштувань та деталей — більше відступу зверху і більша область дотику, щоб було зручно натискати']},
  {v:'0.9', date:'29.09.2026 00:30', items:['Свайп від краю екрана назад — для телефонів без рамки і без кнопки «Назад»: працює лише там, де справді є куди повертатись','Тактильний відгук тепер можна вимкнути повністю або окремо для свайпів, видалення чи важливих дій — у Налаштуваннях → Вигляд','Порівняння прибутку цього тижня з минулим прямо під сумою на дашборді','Таймер активної зміни на дашборді тепер оновлюється наживо й пульсує зеленим, поки зміна триває','Кольорова крапка стану біля кожного авто у гаражі — зелена/жовта/червона залежно від того, як давно були записи','Попередження, якщо витрати на обслуговування за цей місяць помітно вищі за звичайні','Довге натискання на кнопку «+» на будь-якій вкладці відкриває швидке меню додавання (зміна, витрата, заправка, нагадування)']},
  {v:'0.8', date:'29.09.2026 00:18', items:['Розділи картки авто (Огляд, Заправки/Зарядки, Обслуговування, Фінанси, Заробіток, Історія, Вішліст) тепер відображаються сіткою з іконками замість смужки, яку треба було гортати вбік — усі розділи видно одразу, без свайпу']},
  {v:'0.7', date:'29.09.2026 00:15', items:['Виправлено картку «Ціль» на дашборді — на iPhone вона налягала на плитки нижче; тепер завжди є відступ, а смужка прогресу відображається як слід','Пошук зміни чи витрати за датою, сумою, платформою чи категорією — у меню «⋯» вгорі','Потягнути дашборд вниз, щоб оновити дані — звичний жест iOS (pull-to-refresh)','Легка тактильна віброзідача на свайпі видалення та підтвердженні видалення','Особисті нагадування тепер групуються за терміновістю: прострочені, найближчі, пізніше, без дати, виконані']},
  {v:'0.6', date:'29.09.2026 00:01', items:['Налаштування переробили на розділи: замість однієї довгої сторінки — список категорій («Профіль і податки», «Вигляд», «Цілі», «Нагадування», «Платформи», «Бонуси», «Контакти», «Дані», «Про застосунок»), кожна відкривається окремо','Нова кнопка меню зверху справа (поруч із шестернею) — швидкий доступ до перевірки оновлень, інструкції встановлення, історії версій, демо-режиму й сторінки розробника','Виправлено накладання шапки застосунку на виріз камери на деяких пристроях','Виправлено «сховану» кнопку видалення, яку було трохи видно збоку в списках зі свайпом']},
  {v:'0.5', date:'28.09.2026 23:47', items:['Новий візуальний стиль у дусі «рідкого скла» iOS: плавні пружинні анімації відкриття/закриття вікон і шторок','Тактильний відгук на дотик — кнопки, картки й рядки списків злегка пружинять при натисканні','Заокругленіші картки та м’якше скло на панелях і плашках','Плавна поява вкладок і плавний перехід між темною/світлою темою та акцентним кольором','Вимкнено випадковий зум сторінки жестом «щипок» — розмір тексту тепер регулюється в Налаштуваннях → Вигляд','Дотик на «Версія» в Налаштуваннях відкриває історію оновлень','Перевірка оновлень тепер пропонує «Оновити зараз» або «Оновити пізніше» (з підказкою, коли перевірить наступного разу)']},

let bodyLockCount=0, bodyLockScrollY=0;
function lockBodyScroll(){
  if(bodyLockCount===0){
    bodyLockScrollY=window.scrollY||window.pageYOffset||0;
    document.body.style.position='fixed';
    document.body.style.top=(-bodyLockScrollY)+'px';
    document.body.style.left='0';
    document.body.style.right='0';
    document.body.style.width='100%';
  }
  bodyLockCount++;
}
function unlockBodyScroll(){
  bodyLockCount=Math.max(0,bodyLockCount-1);
  if(bodyLockCount===0){
    document.body.style.position='';
    document.body.style.top='';
    document.body.style.left='';
    document.body.style.right='';
    document.body.style.width='';
    window.scrollTo(0, bodyLockScrollY);
  }
}
function modalRootLockInit(){
  const root=$('#modalRoot');
  if(!root || root.dataset.lockBound) return;
  root.dataset.lockBound='1';
  let wasEmpty=true;
  const mo=new MutationObserver(()=>{
    const hasContent = root.children.length>0;
    if(hasContent && wasEmpty){ lockBodyScroll(); wasEmpty=false; }
    else if(!hasContent && !wasEmpty){ unlockBodyScroll(); wasEmpty=true; }
  });
  mo.observe(root, {childList:true});
}
function haptic(category){
  try{
    if(!navigator.vibrate) return;
    const h=(typeof DB!=='undefined' && DB && DB.settings && DB.settings.haptics) || {master:true, swipe:true, delete:true, actions:true};
    if(h.master===false) return;
    if(category==='swipe' && h.swipe===false) return;
    if(category==='delete' && h.delete===false) return;
    if((category==='action' || category==='success' || !category) && h.actions===false) return;
    if(category==='delete') navigator.vibrate([12,40,12]);
    else if(category==='success') navigator.vibrate([10,30,10,30,20]);
    else navigator.vibrate(10);
  }catch(e){}
}

let timerHandle=null;
function manageTimerLoop(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }

    timerHandle=setInterval(()=>{
      const el=$('#activeTimer'); const de=$('#dashActiveTimer');
      if(!el && !de){ manageTimerLoop(); return; }
      if(el) el.textContent=fmtDur(activeElapsedMs());
      if(de){ const c=carById(DB.activeShift.carId); de.textContent=(c?c.name+' · ':'')+fmtDur(activeElapsedMs()); }
    }, 1000);
  }
}
function activeElapsedMs(){
  const as=DB.activeShift; if(!as) return 0;
  const end = as.pausedAt || Date.now();
  return end - as.startTime - (as.pausedTotal||0);
}
function computePlatformHours(as, endTime){
  const events=(as.checkins||[]).filter(c=>['pause_platform','resume_platform','add_platform'].includes(c.type)).sort((a,b)=>a.t-b.t);
  let cur = Array.isArray(as.initialPlatformIds) ? [...as.initialPlatformIds] : [...(as.platformIds||[])];
  let t0=as.startTime; const acc={};
  function addSeg(t1){ const dur=Math.max(0,t1-t0); cur.forEach(pid=>{ acc[pid]=(acc[pid]||0)+dur; }); t0=t1; }
  events.forEach(ev=>{ addSeg(ev.t); if(Array.isArray(ev.platformIds)) cur=[...ev.platformIds]; });
  addSeg(endTime||Date.now());
  const hours={}; Object.keys(acc).forEach(pid=>{ hours[pid]=acc[pid]/3600000; });
  return hours;
}

/* ============ DASHBOARD ============ */
let PERIOD='month', customFrom='', customTo='';
function inPeriod(dateStr){
  if(PERIOD==='today') return dateStr===today();
  if(PERIOD==='7d'){ const d=new Date(); d.setDate(d.getDate()-6); return dateStr>=toLocalISO(d) && dateStr<=today(); }
  if(PERIOD==='month') return dateStr.slice(0,7)===today().slice(0,7);
  if(PERIOD==='year') return dateStr.slice(0,4)===today().slice(0,4);
  if(PERIOD==='all') return true;
  if(PERIOD==='custom') return (!customFrom||dateStr>=customFrom)&&(!customTo||dateStr<=customTo);
  return true;
}
function shiftIncome(s){ return (s.entries||[]).reduce((a,e)=>a+num(e.amount)+num(e.tips),0); }
function profitForRange(fromDate, toDate){
  const inR=d=>d>=fromDate && d<=toDate;
  const income=DB.shifts.filter(s=>inR(s.date)).reduce((a,s)=>a+shiftIncome(s),0);
  const exp=DB.expenses.filter(e=>inR(e.date)).reduce((a,e)=>a+num(e.amount),0) + DB.fuel.filter(f=>inR(f.date)).reduce((a,f)=>a+num(f.cost),0);
  return income-exp;
}
function weekCompareHtml(){
  if(DB.settings.showWeekCompare===false) return '';
  const now=new Date(today()+'T00:00:00');
  const d0=new Date(now); d0.setDate(d0.getDate()-6);
  const thisFrom=toLocalISO(d0), thisTo=today();
  const d1=new Date(d0); d1.setDate(d1.getDate()-7);
  const d2=new Date(d0); d2.setDate(d2.getDate()-1);
  const prevFrom=toLocalISO(d1), prevTo=toLocalISO(d2);
  const cur=profitForRange(thisFrom,thisTo);
  const prev=profitForRange(prevFrom,prevTo);
  if(cur===0 && prev===0) return '';
  let arrow, color, txt, barHtml='';
  if(prev===0){
    arrow='▲'; color='var(--green)'; txt=`${money(cur)} за останні 7 дн. — попередні 7 дн. без записів`;
  }else{
    const pct=Math.round((cur-prev)/Math.abs(prev)*100);
    arrow=pct>=0?'▲':'▼'; color=pct>=0?'var(--green)':'var(--red)';
    txt=`${pct>=0?'+':''}${pct}% за 7 дн. проти попередніх 7 дн.`;
    const maxAbs=Math.max(Math.abs(cur),Math.abs(prev),1);
    const curPct=Math.max(4,Math.round(Math.abs(cur)/maxAbs*100));
    const prevPct=Math.max(4,Math.round(Math.abs(prev)/maxAbs*100));
    barHtml=`<div style="display:flex;flex-direction:column;gap:3px;margin-top:6px">
      <div style="display:flex;align-items:center;gap:6px"><span style="width:38px;font-size:10px;color:rgba(255,255,255,0.6)">цей</span><div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.12)"><div style="width:${curPct}%;height:100%;border-radius:3px;background:${color}"></div></div></div>
      <div style="display:flex;align-items:center;gap:6px"><span style="width:38px;font-size:10px;color:rgba(255,255,255,0.6)">минул.</span><div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.12)"><div style="width:${prevPct}%;height:100%;border-radius:3px;background:rgba(255,255,255,0.4)"></div></div></div>
    </div>`;
  }
  return `<div class="sub" style="margin-top:5px"><span style="color:${color};font-weight:700">${arrow}</span> ${txt}</div>${barHtml}`;
}
function todayIncomeSoFar(){ return DB.shifts.filter(s=>s.date===today()).reduce((a,s)=>a+shiftIncome(s),0); }
function periodDaysCount(){
  if(PERIOD==='today') return 1;
  if(PERIOD==='7d') return 7;
  if(PERIOD==='month'){ const d=new Date(); return d.getDate(); }
  if(PERIOD==='year'){ const d=new Date(); const start=new Date(d.getFullYear(),0,1); return Math.max(1,Math.round((d-start)/86400000)+1); }
  if(PERIOD==='all'){
    const dates=[...DB.shifts.map(s=>s.date),...DB.expenses.map(e=>e.date),...DB.fuel.map(f=>f.date)].filter(Boolean).sort();
    if(!dates.length) return 1;
    const first=new Date(dates[0]+'T00:00:00'), now=new Date(today()+'T00:00:00');
    return Math.max(1,Math.round((now-first)/86400000)+1);
  }
  if(PERIOD==='custom'){
    if(!customFrom) return 1;
    const from=new Date(customFrom+'T00:00:00'), to=new Date((customTo||today())+'T00:00:00');
    return Math.max(1,Math.round((to-from)/86400000)+1);
  }
  return 1;
}
function dashData(){
  const shifts=DB.shifts.filter(s=>inPeriod(s.date));
  const expenses=DB.expenses.filter(e=>inPeriod(e.date));
  const fuel=DB.fuel.filter(f=>inPeriod(f.date));

  const income=shifts.reduce((a,s)=>a+shiftIncome(s),0);
  const fuelCost=fuel.reduce((a,f)=>a+num(f.cost),0);
  const otherExp=expenses.reduce((a,e)=>a+num(e.amount),0);
  const expTotal=fuelCost+otherExp;
  const profit=income-expTotal;
  const hours=shifts.reduce((a,s)=>a+num(s.hours),0);
  const km=shifts.reduce((a,s)=>a+num(s.km),0);
  const nShifts=shifts.length;

  const byPlat={};
  shifts.forEach(s=>(s.entries||[]).forEach(e=>{ byPlat[e.platformId]=(byPlat[e.platformId]||0)+num(e.amount)+num(e.tips); }));
  const platRows=Object.entries(byPlat).sort((a,b)=>b[1]-a[1]);

  const byCar={};
  shifts.forEach(s=>{ byCar[s.carId]=byCar[s.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[s.carId].inc+=shiftIncome(s); byCar[s.carId].km+=num(s.km); byCar[s.carId].hours+=num(s.hours); byCar[s.carId].n++; });
  expenses.forEach(e=>{ if(!e.carId) return; byCar[e.carId]=byCar[e.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[e.carId].exp+=num(e.amount); byCar[e.carId].otherExp+=num(e.amount); });
  fuel.forEach(f=>{ byCar[f.carId]=byCar[f.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[f.carId].exp+=num(f.cost); byCar[f.carId].fuelExp+=num(f.cost); });

  const byCatExp={};
  expenses.forEach(e=>{ byCatExp[e.category]=(byCatExp[e.category]||0)+num(e.amount); });

  const platHours={};
  shifts.forEach(s=>{ const ph=s.platformHours; if(ph){ Object.entries(ph).forEach(([pid,h])=>{ platHours[pid]=(platHours[pid]||0)+h; }); } else if((s.entries||[]).length===1){ const pid=s.entries[0].platformId; platHours[pid]=(platHours[pid]||0)+num(s.hours); } });

  const platShiftCount={};
  shifts.forEach(s=>(s.entries||[]).forEach(e=>{ platShiftCount[e.platformId]=(platShiftCount[e.platformId]||0)+1; }));

  const totalMonthlyFixed=activeCars().reduce((a,c)=>a+loanMonthlyEquivalent(c)+carInsurances(c).reduce((s,ins)=>s+num(ins.monthly),0),0) + num(DB.profile.esvMonthly) + (DB.profile.fop==='group2'?num(DB.profile.taxGroup2Fixed):0);
  const periodDays=periodDaysCount();
  const fixedForPeriod=totalMonthlyFixed/30*periodDays;
  const breakevenTotal=fixedForPeriod+expTotal;
  const breakevenDelta=income-breakevenTotal;

  return { shifts, expenses, fuel, income, fuelCost, otherExp, expTotal, profit, hours, km, nShifts, byPlat, platRows, byCar, byCatExp, platHours, platShiftCount, totalMonthlyFixed, periodDays, fixedForPeriod, breakevenTotal, breakevenDelta };
}
const MONTH_SHORT=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
function bucketProfit(fromDate, toDate){
  const inRange=(ds)=>ds>=fromDate && ds<=toDate;
  const inc=DB.shifts.filter(s=>inRange(s.date)).reduce((a,s)=>a+shiftIncome(s),0);
  const exp=DB.expenses.filter(e=>inRange(e.date)).reduce((a,e)=>a+num(e.amount),0) + DB.fuel.filter(f=>inRange(f.date)).reduce((a,f)=>a+num(f.cost),0);
  return inc-exp;
}
function profitTrendBuckets(){
  let buckets=[];
  if(PERIOD==='7d'){
    let d=new Date(); d.setDate(d.getDate()-6);
    for(let i=0;i<7;i++){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate()), from:ds, to:ds}); d.setDate(d.getDate()+1); }
  }else if(PERIOD==='month'){
    const now=new Date(); const days=now.getDate();
    let d=new Date(now.getFullYear(), now.getMonth(), 1);
    for(let i=0;i<days;i++){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate()), from:ds, to:ds}); d.setDate(d.getDate()+1); }
  }else if(PERIOD==='year'){
    const now=new Date(); const months=now.getMonth()+1;
    for(let m=0;m<months;m++){ const from=toLocalISO(new Date(now.getFullYear(),m,1)); const to=toLocalISO(new Date(now.getFullYear(),m+1,0)); buckets.push({label:MONTH_SHORT[m], from, to}); }
  }else if(PERIOD==='all' || PERIOD==='custom'){
    const allDates=[...DB.shifts.map(s=>s.date), ...DB.expenses.map(e=>e.date), ...DB.fuel.map(f=>f.date)].filter(Boolean);
    let fromLimit = PERIOD==='custom' && customFrom ? customFrom : (allDates.length?allDates.reduce((a,b)=>a<b?a:b):today());
    let toLimit = PERIOD==='custom' && customTo ? customTo : today();
    const start=new Date(fromLimit+'T00:00:00'), end=new Date(toLimit+'T00:00:00');
    const dayDiff=Math.round((end-start)/86400000);
    if(dayDiff<=45){
      let d=new Date(start);
      while(toLocalISO(d)<=toLimit){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate())+'.'+String(d.getMonth()+1), from:ds, to:ds}); d.setDate(d.getDate()+1); }
    }else{
      let cursor=new Date(start.getFullYear(), start.getMonth(), 1);
      while(toLocalISO(cursor)<=toLimit){
        const from=toLocalISO(cursor);
        const to=toLocalISO(new Date(cursor.getFullYear(), cursor.getMonth()+1, 0));
        buckets.push({label:MONTH_SHORT[cursor.getMonth()]+(cursor.getFullYear()!==new Date().getFullYear()?" '"+String(cursor.getFullYear()).slice(2):''), from, to});
        cursor.setMonth(cursor.getMonth()+1);
      }
      if(buckets.length>18) buckets=buckets.slice(-18);
    }
  }
  buckets.forEach(b=>{ b.profit=bucketProfit(b.from,b.to); });
  return buckets;
}
function renderProfitTrendSvg(buckets){
  if(!buckets || !buckets.length) return '';
  const w=320, h=110, padL=4, padR=4, padT=6, padB=16;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const maxAbs=Math.max(1, ...buckets.map(b=>Math.abs(b.profit)));
  const n=buckets.length, gap=n>20?1:2;
  const barW=Math.max(1.5,(innerW-gap*(n-1))/n);
  const zeroY=padT+innerH/2;
  let bars='';
  buckets.forEach((b,i)=>{
    const x=padL+i*(barW+gap);
    const bh=Math.max(1, Math.abs(b.profit)/maxAbs*(innerH/2-4));
    const y = b.profit>=0 ? zeroY-bh : zeroY;
    const color = b.profit>=0 ? 'var(--green)' : 'var(--red)';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(2,barW/2).toFixed(1)}" style="fill:${color}"><title>${esc(b.label)}: ${money(b.profit)}</title></rect>`;
  });
  const labelEvery=Math.max(1, Math.ceil(n/7));
  let labels='';
  buckets.forEach((b,i)=>{
    if(i%labelEvery!==0 && i!==n-1) return;
    const x=padL+i*(barW+gap)+barW/2;
    labels+=`<text x="${x.toFixed(1)}" y="${h-4}" text-anchor="middle" style="font-size:8px;fill:var(--tx3)">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--sep);stroke-width:1"/>
    ${bars}${labels}
  </svg>`;
}

  if(!isDemo() && (DB.shifts.length>0 || DB.expenses.length>0)){
    const bdays=daysSinceBackup();
    const bThreshold=+DB.settings.autoBackupDays||30;
    const snoozeUntil=DB.settings.backupReminderSnoozeUntil;
    const snoozed = snoozeUntil && snoozeUntil>today();
    if((bdays===null || bdays>=bThreshold) && !snoozed){
      html+=`<div class="group" style="margin:10px 0 14px;cursor:pointer" onclick="openBackupReminderSheet()">
        <div class="row"><span class="dot" style="background:var(--orange);margin-top:2px;align-self:flex-start"></span><div class="rtitle"><b>${bdays===null?'Ще не робили резервну копію':'Резервна копія '+bdays+' дн. тому'}</b><div class="sub">Дані лише в цьому браузері — збережіть копію, щоб не втратити</div></div><span class="chev" style="align-self:flex-start;margin-top:1px">›</span></div>
      </div>`;
    }
  }

  const goalMap={today:'daily', '7d':'weekly', month:'monthly'};
  const goalKey=goalMap[PERIOD];
  const goalVal=goalKey?num(DB.goals[goalKey]):0;
  if(goalVal>0){
    const pct=Math.max(0,Math.min(100, Math.round(profit/goalVal*100)));
    const reached=profit>=goalVal;
    html+=`<div class="group" style="margin:10px 0 14px"><div class="row" style="display:block;cursor:pointer" onclick="openSettings('goals')">
      <div class="rtitle" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;margin-bottom:8px"><b style="min-width:0">Ціль: ${money(goalVal)}${reached?' 🎉':''}</b><span class="sub" style="flex-shrink:0">${pct}%</span></div>
      <div class="btrack"><div class="bfill" style="width:${pct}%;background:${reached?'var(--green)':'var(--blue)'}"></div></div>
      <div class="sub" style="margin-top:8px">${reached?'Ціль досягнута — ще '+money(profit-goalVal)+' зверху':'Залишилось заробити '+money(goalVal-profit)}</div>
    </div></div>`;
  }

  html+=`<div class="tilegrid">
    <div class="tile" style="cursor:pointer" onclick="openDashShiftsDetail()"><div class="lbl"><span class="icobadge" style="background:var(--blue)">${icon('history',13)}</span>Змін</div><div class="v tnum">${nShifts}</div></div>
    <div class="tile" style="cursor:pointer" onclick="openDashPerHourDetail()"><div class="lbl"><span class="icobadge" style="background:var(--green)">${icon('money',13)}</span>Прибуток / год</div><div class="v tnum">${hours?money(profit/hours):'—'}</div></div>
    <div class="tile" style="cursor:pointer" onclick="openDashKmDetail()"><div class="lbl"><span class="icobadge" style="background:var(--orange)">${icon('fuel',13)}</span>Пробіг</div><div class="v tnum">${Math.round(km)} км</div></div>
    <div class="tile" style="cursor:pointer" onclick="openDashPerKmDetail()"><div class="lbl"><span class="icobadge" style="background:var(--purple)">${icon('target',13)}</span>Прибуток / км</div><div class="v tnum">${km?(profit/km).toFixed(1)+' ₴':'—'}</div></div>
  </div>`;

  const trendBuckets = PERIOD==='today' ? null : profitTrendBuckets();
  if(trendBuckets && trendBuckets.length>1){
    html+=`<div class="section-label">Тренд прибутку <button type="button" class="infob" onclick="alertSheet('Тренд прибутку','Чистий прибуток (дохід мінус витрати й пальне/зарядка) по днях чи місяцях за обраний період. Зелені стовпці — прибуткові, червоні — збиткові.')">i</button></div>
    <div class="group"><div style="padding:12px 10px 8px">${renderProfitTrendSvg(trendBuckets)}</div></div>`;
  }

  const payments=allPayments();
  if(payments.length){
    const upcoming=payments.slice(0,3);
    html+=`<div class="section-label">Найближчі платежі <button type="button" class="infob" onclick="alertSheet('Найближчі платежі','Дати наступних платежів за кредитом чи лізингом і продовження страхових полісів по всіх авто, відсортовано за терміновістю. Це лише нагадування — нічого не списується автоматично.')">i</button></div>
    <div class="group">`;
    upcoming.forEach(p=>{
      const days=daysUntil(p.date);
      html+=`<div class="row" onclick="openPaymentsList()" style="cursor:pointer"><div class="rtitle"><b>${esc(p.carName)} · ${esc(p.label)}</b><div class="sub">${dueBadge(days)}</div></div><div class="rval tnum">${p.amountLabel||money(p.amount)}</div></div>`;
    });
    html+=`</div>
    <div class="group" style="margin-top:6px"><button class="btn add" style="padding:10px 14px" onclick="openPaymentsList()">Усі платежі${payments.length>upcoming.length?' ('+payments.length+')':''}</button></div>`;
  }

  const personalReminders=DB.reminders.filter(r=>!r.done).map(r=>({text:esc(r.text), date:r.date, onclick:`openReminderForm('${r.id}')`}));
  const tireReminders=activeCars().filter(c=>c.tireNextDate).map(c=>({text:`${esc(c.name)} · перевзування шин${c.tireSeason==='winter'?' на літні':' на зимові'}`, date:c.tireNextDate, onclick:`openCarQuickView('${c.id}')`}));
  const serviceReminders=[];
  activeCars().forEach(c=>{ (c.service||[]).forEach(it=>{ const left=num(it.last)+num(it.every)-num(c.odo); if(left<=300){ serviceReminders.push({ text:`${esc(c.name)} · ${esc(it.name)}${left<0?' (прострочено на '+Math.abs(Math.round(left))+' км)':' (через '+Math.round(left)+' км)'}`, date: left<0?today():'', onclick:`openCarQuickView('${c.id}')` }); } }); });
  const taxReminders = (DB.profile.fop!=='none' && DB.profile.taxReminderEnabled) ? [{ text:'Податки й ЄСВ за цей місяць', date: nextTaxDueDate(DB.profile.taxReminderDay), onclick:`closeSheet();openTaxCalc()` }] : [];
  const allReminders=[...personalReminders, ...tireReminders, ...serviceReminders, ...taxReminders];
  if(allReminders.length){
    const sortedR=[...allReminders].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
    const upcomingR=sortedR.slice(0,3);
    html+=`<div class="section-label">Нагадування <button type="button" class="infob" onclick="alertSheet('Нагадування','Особисті нагадування й нагадування про перевзування шин по авто, разом, за терміновістю.')">i</button></div>
    <div class="group">`;
    upcomingR.forEach(r=>{
      html+=`<div class="row" onclick="${r.onclick}" style="cursor:pointer"><div class="rtitle"><b>${r.text}</b>${r.date?`<div class="sub">${dueBadge(daysUntil(r.date))}</div>`:''}</div><span class="chev">›</span></div>`;
    });
    html+=`</div>`;
    if(sortedR.length>upcomingR.length){
      html+=`<div class="group" style="margin-top:6px"><button class="btn add" style="padding:10px 14px" onclick="openSettings('reminders')">Усі нагадування (${sortedR.length})</button></div>`;
    }
  }

  if(d.totalMonthlyFixed>0){
    const pct=d.breakevenTotal>0?Math.min(100,Math.round(income/d.breakevenTotal*100)):100;
    const ok=d.breakevenDelta>=0;
    html+=`<div class="section-label">Точка беззбитковості <button type="button" class="infob" onclick="alertSheet('Точка беззбитковості','Скільки треба заробити за цей період, щоб покрити витрати — і фіксовані (кредит/лізинг і страхування з вкладки «Фінанси» авто), і вже понесені змінні (пальне, обслуговування тощо). Фіксовані витрати рахуються пропорційно дням періоду.')">i</button></div>
    <div class="group" style="cursor:pointer" onclick="openDashBreakevenDetail()">
      <div style="padding:12px 14px">
        <div class="btrack" style="height:10px"><div class="bfill" style="width:${pct}%;background:${ok?'var(--teal)':'var(--red)'}"></div></div>
        <div class="sub" style="margin-top:8px">Дохід ${money(income)} з ${money(d.breakevenTotal)} потрібних</div>
        <div class="tnum ${ok?'pos':'neg'}" style="font-weight:700;margin-top:2px">${ok?'Вже в плюсі на '+money(d.breakevenDelta):'Ще потрібно '+money(-d.breakevenDelta)}</div>
      </div>
    </div>`;
  }

  html+=`<div class="section-label">Дохід по платформах ${platRows.length>1?`<button type="button" class="infob" onclick="openPlatformCompareSheet()" style="font-size:11px;width:auto;height:22px;padding:0 8px;border-radius:9px">Порівняти</button>`:''}</div><div class="group">`;
  if(!platRows.length) html+=`<div class="empty">Немає записів за цей період</div>`;
  else platRows.forEach(([pid,val])=>{
    const p=platById(pid); const pct=Math.round(val/maxPlat*100);
    const color = p&&p.group==='taxi' ? 'var(--blue)' : 'var(--teal)';
    html+=`<div class="barrow" style="cursor:pointer" onclick="openDashPlatformDetail('${pid}')"><div class="bhead"><span>${esc(p?p.name:'Інше')}</span><b class="tnum">${money(val)}</b></div>
      <div class="btrack"><div class="bfill" style="width:${pct}%;background:${color}"></div></div></div>`;
  });
  html+=`</div>`;

  html+=`<div class="section-label">По авто ${activeCars().length+archivedCars().length>1?`<button type="button" class="infob" onclick="openCarCompareSheet()" style="font-size:11px;width:auto;height:22px;padding:0 8px;border-radius:9px">Порівняти</button>`:''}</div><div class="group">`;
  const carIds=Object.keys(byCar);
  if(!carIds.length) html+=`<div class="empty">Немає записів за цей період</div>`;
  else carIds.forEach(cid=>{
    const c=carById(cid); const d=byCar[cid]; const p=d.inc-d.exp;
    html+=`<div class="row" onclick="${c?`openCarQuickView('${cid}')`:''}" style="${c?'cursor:pointer':''}"><div class="rtitle"><b>${esc(c?c.name:'Видалене авто')}</b><div class="sub">дохід ${money(d.inc)} · витрати ${money(d.exp)}</div></div>
      <div class="rval tnum ${p>=0?'pos':'neg'}">${moneyLoss(p)}</div></div>`;
  });
  html+=`</div>`;

  html+=renderStatusBlock();

  $('#main').innerHTML=html;
}

function allTimeIncome(){ return DB.shifts.reduce((a,s)=>a+shiftIncome(s),0); }
function envelopeBalance(){
  const rate=num(DB.settings.envelopeRate)||0;
  const set_aside=allTimeIncome()*rate/100;
  return Math.max(0, set_aside - num(DB.settings.envelopeWithdrawn));
}
function openEnvelopeSheet(){
  const rate=num(DB.settings.envelopeRate)||0;
  const bal=envelopeBalance();
  let html=`<h3>Конверт на податки</h3>
    <div class="hero light" style="margin-top:10px"><div class="lbl">У конверті зараз</div><div class="big tnum" style="color:var(--orange)">${money(bal)}</div><div class="sub">${rate}% від усього зароблених ${money(allTimeIncome())}</div></div>
    <div class="group" style="margin-top:10px"><div class="row" onclick="openWithdrawEnvelope()" style="cursor:pointer"><div class="rtitle"><b>Позначити частину знятою</b><div class="sub">Наприклад, після сплати податку чи ЄСВ</div></div><span class="chev">›</span></div></div>
    <div class="group" style="margin-top:10px"><div class="row"><div class="rtitle"><div class="sub">Це проста копілка всередині застосунку, не реальний рахунок. Ставку можна змінити в Налаштуваннях → Конверт на податки.</div></div></div></div>`;
  showSheet(html);
}
function openWithdrawEnvelope(){
  showSheet(`<h3>Зняти з конверта</h3>
    <div class="confirm-msg">У конверті зараз ${money(envelopeBalance())}. Вкажіть, скільки з цього фактично витрачено чи сплачено.</div>
    <div class="field" style="margin-top:12px"><label>Сума, ₴</label><input type="number" inputmode="decimal" id="ewAmt" placeholder="0"></div>
    <button class="btn primary" onclick="doWithdrawEnvelope()">Позначити знятим</button>`);
  window.doWithdrawEnvelope=()=>{
    const amt=num($('#ewAmt').value);
    if(amt<=0){ alertSheet('Вкажіть суму','Сума має бути більшою за нуль.'); return; }
    DB.settings.envelopeWithdrawn=num(DB.settings.envelopeWithdrawn)+amt;
    save(); closeSheet(); openEnvelopeSheet();
  };
}

      <div class="row"><div class="rtitle"><b>Разом до сплати</b></div><div class="rval tnum neg">${money(taxAmount+esvAmount)}</div></div>
    </div></div>`;

  if(vchasnoLinks.length){
    html+=`<div class="field"><label>Облік і звітність для ФОП</label><div class="group">
      ${vchasnoLinks.map(r=>refCardHtml(r.name, r.url, r.note, r.code)).join('')}
    </div></div>`;
  }
  showSheet(html);
}

function openCarCompareSheet(){
  const periods=[['today','Сьогодні'],['7d','7 днів'],['month','Місяць'],['year','Рік'],['all','Весь час']];
  const d=dashData();
  const cars=[...activeCars(), ...archivedCars()];
  const rows=cars.map(c=>{
    const v=d.byCar[c.id]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0};
    return { c, v, profit: v.inc-v.exp };
  }).filter(r=>r.v.n>0 || r.v.km>0 || r.v.exp>0);
  rows.sort((a,b)=>b.profit-a.profit);
  let html=`<h3>Порівняння авто</h3>`;
  html+=`<div class="seg" style="margin:12px 0">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';openCarCompareSheet()">${p[1]}</button>`).join('')}
    <button class="${PERIOD==='custom'?'on':''}" onclick="openCustomPeriod()">Період</button></div>`;
  if(!rows.length){
    html+=`<div class="group"><div class="empty">Немає записів за цей період для порівняння</div></div>`;
  }else{
    const kmRows=rows.filter(r=>r.v.km>0).map(r=>({name:r.c.name, val:r.profit/r.v.km}));
    if(kmRows.length>1){
      const maxAbs=Math.max(1,...kmRows.map(r=>Math.abs(r.val)));
      html+=`<div class="section-label">Прибуток на км</div><div class="group" style="margin-bottom:10px">`;
      kmRows.forEach(r=>{
        const pct=Math.round(Math.abs(r.val)/maxAbs*100);
        html+=`<div class="barrow"><div class="bhead"><span>${esc(r.name)}</span><b class="tnum ${r.val>=0?'pos':'neg'}">${r.val.toFixed(2)} ₴/км</b></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:${r.val>=0?'var(--green)':'var(--red)'}"></div></div></div>`;
      });
      html+=`</div>`;
    }
    html+=`<div class="group">`;
    rows.forEach(({c,v,profit})=>{
      const cons=computeConsumption(c, DB.fuel.filter(f=>f.carId===c.id));
      html+=`<div class="row" onclick="closeSheet();openCarDetail('${c.id}')" style="cursor:pointer;align-items:flex-start">
        <div class="rtitle"><b>${esc(c.name)}${c.archived?' · архів':''}</b>
          <div class="sub">дохід ${money(v.inc)} · пальне/зарядка ${money(v.fuelExp)} · інші витрати ${money(v.otherExp)}</div>
          <div class="sub">${Math.round(v.km)} км · ${v.hours.toFixed(1)} год${cons.value!==null?' · '+cons.value.toFixed(1)+' '+fuelUnit(c)+'/100км':''}</div>
        </div>
        <div style="text-align:right">
          <div class="rval tnum ${profit>=0?'pos':'neg'}">${moneyLoss(profit)}</div>
          <div class="sub tnum">${v.km?(profit/v.km).toFixed(2)+' ₴/км':'—'}${v.hours?' · '+money(Math.round(profit/v.hours))+'/год':''}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  showSheet(html);
}
function openPlatformCompareSheet(){
  const periods=[['today','Сьогодні'],['7d','7 днів'],['month','Місяць'],['year','Рік'],['all','Весь час']];
  const d=dashData();
  const rows=Object.keys(d.byPlat).map(pid=>{
    const income=d.byPlat[pid]||0;
    const hours=d.platHours[pid]||0;
    let km=0;
    d.shifts.forEach(s=>{
      const entries=(s.entries||[]).filter(e=>e.platformId===pid);
      if(!entries.length || !num(s.km)) return;
      const shiftTotal=(s.entries||[]).reduce((a,e)=>a+num(e.amount)+num(e.tips),0);
      const platAmt=entries.reduce((a,e)=>a+num(e.amount)+num(e.tips),0);
      if(shiftTotal>0) km+=num(s.km)*(platAmt/shiftTotal);
    });
    return {pid, income, hours, km};
  }).filter(r=>r.income>0);
  rows.sort((a,b)=>b.income-a.income);
  let html=`<h3>Порівняння платформ</h3>`;
  html+=`<div class="seg" style="margin:12px 0">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';openPlatformCompareSheet()">${p[1]}</button>`).join('')}
    <button class="${PERIOD==='custom'?'on':''}" onclick="openCustomPeriod()">Період</button></div>`;
  if(!rows.length){
    html+=`<div class="group"><div class="empty">Немає доходу за цей період для порівняння</div></div>`;
  }else{
    html+=`<div class="group">`;
    rows.forEach(({pid,income,hours,km})=>{
      const p=platById(pid);
      html+=`<div class="row" onclick="closeSheet();openDashPlatformDetail('${pid}')" style="cursor:pointer;align-items:flex-start">
        <div class="rtitle"><b>${esc(p?p.name:'Без платформи')}</b>
          <div class="sub">дохід ${money(income)}${hours?' · '+hours.toFixed(1)+' год':''}${km?' · ~'+Math.round(km)+' км':''}</div>
        </div>
        <div style="text-align:right">
          <div class="rval tnum">${hours?money(Math.round(income/hours))+'/год':'—'}</div>
          <div class="sub tnum">${km?(income/km).toFixed(2)+' ₴/км':'—'}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
    html+=`<div class="group" style="margin-top:8px"><div class="row"><div class="rtitle"><div class="sub">Кілометраж по платформах — орієнтовний розподіл пропорційно доходу в межах зміни, бо кілометри записуються на зміну загалом, а не окремо по кожній платформі.</div></div></div></div>`;
  }
  showSheet(html);
}
function openOrderCalc(){
  const cars=activeCars();
  const carOpts=cars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  showSheet(`
    <h3>Чи вигідне замовлення?</h3>
    <div style="margin-top:14px">
      ${cars.length?`<div class="field"><label>Авто</label><select id="ocCar" onchange="document.getElementById('ocCostKm').dataset.touched='';ocRecalc()">${carOpts}</select></div>`:''}
      <div class="field"><label>Витрата пального/заряду, ₴/км</label><input type="number" inputmode="decimal" id="ocCostKm" oninput="this.dataset.touched='1';ocRecalc()"></div>
      <div class="field"><label>Ціна пропозиції, ₴</label><input type="number" inputmode="decimal" id="ocPrice" oninput="ocRecalc()"></div>
      <div class="field"><label>Відстань разом із подачею, км</label><input type="number" inputmode="decimal" id="ocKm" oninput="ocRecalc()"></div>
      <div class="field"><label>Орієнтовний час у дорозі, хв (необов’язково)</label><input type="number" inputmode="numeric" id="ocMin" oninput="ocRecalc()"></div>
      <div id="ocResult" style="margin-top:6px"></div>
    </div>
  `);
  window.ocRecalc=()=>{
    const carSel=$('#ocCar');
    const car = carSel ? carById(carSel.value) : null;
    const costEl=$('#ocCostKm');
    if(car && !costEl.dataset.touched){
      const cons=computeConsumption(car, DB.fuel.filter(f=>f.carId===car.id));
      if(cons.costPerKm!==null) costEl.value=cons.costPerKm.toFixed(2);
    }
    const costKm=num(costEl.value);
    const price=num($('#ocPrice').value);
    const km=num($('#ocKm').value);
    const min=num($('#ocMin').value);
    const resEl=$('#ocResult');
    if(!price || !km){ resEl.innerHTML=''; return; }
    const fuelCost=costKm*km;
    const net=price-fuelCost;
    const perKm=net/km;
    const perHour = min>0 ? net/(min/60) : null;
    let verdict, color;
    if(perKm<0){ verdict='Збиткове замовлення'; color='var(--red)'; }
    else if(perKm<5){ verdict='На межі — варто подумати'; color='var(--orange)'; }
    else{ verdict='Вигідне замовлення'; color='var(--green)'; }
    resEl.innerHTML=`<div class="group" style="margin-top:4px">
      <div class="row"><div class="rtitle"><b>Витрати на пальне/зарядку</b></div><div class="rval tnum neg">${money(fuelCost)}</div></div>
      <div class="row"><div class="rtitle"><b>Чистими після пального</b></div><div class="rval tnum ${net>=0?'pos':'neg'}">${money(net)}</div></div>
      <div class="row"><div class="rtitle"><b>На кілометр</b></div><div class="rval tnum">${perKm.toFixed(2)} ₴/км</div></div>
      ${perHour!==null?`<div class="row"><div class="rtitle"><b>На годину</b></div><div class="rval tnum">${money(Math.round(perHour))}/год</div></div>`:''}
    </div>
    <div class="group" style="margin-top:8px"><div class="row"><div class="rtitle"><b style="color:${color}">${esc(verdict)}</b><div class="sub">Орієнтовний розрахунок — без урахування зносу авто, комісії платформи й часу очікування</div></div></div></div>`;
  };
  setTimeout(()=>{ const el=$('#ocCostKm'); if(el){ ocRecalc(); } }, 0);
}

  let orders=0, hasOrders=false, commission=0, hasCommission=0, grossTotal=0;

  let html=`<h3>${esc(p?p.name:'Платформа')}</h3><div class="confirm-msg">${d.platShiftCount[pid]||0} ${(d.platShiftCount[pid]||0)===1?'зміна':'змін'} за період</div>`;
  html+=`<div class="group">
    <div class="row"><div class="rtitle"><b>Дохід</b></div><div class="rval tnum pos">${money(income)}</div></div>
    ${hours?`<div class="row"><div class="rtitle"><b>Години</b></div><div class="rval tnum">${hours.toFixed(1)} год</div></div><div class="row"><div class="rtitle"><b>₴ за годину</b></div><div class="rval tnum">${money(income/hours)}</div></div>`:''}
    ${hasOrders?`<div class="row"><div class="rtitle"><b>Кількість замовлень</b></div><div class="rval tnum">${orders}</div></div>`:''}
    ${hasCommission?`<div class="row"><div class="rtitle"><b>Комісія сплачена</b></div><div class="rval tnum neg">${money(commission)}</div><div class="sub">із брудного доходу ${money(grossTotal)}${grossTotal?' · '+(commission/grossTotal*100).toFixed(1)+'%':''}</div></div>`:''}
    ${p&&p.commissionPct?`<div class="row"><div class="rtitle"><b>Комісія за замовчуванням</b></div><div class="rval tnum">${p.commissionPct}%</div></div>`:''}

  if(!hasOrders && !hasCommission) html+=`<div class="confirm-msg" style="margin-top:10px">Щоб бачити кількість замовлень і комісію тут, вводьте дохід через «Ввести деталі» при завершенні зміни.</div>`;

function renderStatusBlock(){
  const y=DB.settings.yellowDays, r=DB.settings.redDays;
  function statusFor(days){ return days<=y?'g':(days<=r?'y':'r'); }
  function statusText(days){ if(days===Infinity) return 'немає записів'; if(days===0) return 'сьогодні'; if(days===1) return 'учора'; return days+' дн. тому'; }

  const qesc=s=>String(s).replace(/'/g,"\\'");
  let html=`<div class="section-label">Статус актуальності даних <button type="button" class="infob" onclick="alertSheet('Статус актуальності даних','Показує, коли востаннє вносились дані по кожній платформі чи авто. Натисніть «Оновити», щоб перевірити ще раз — статус перерахується з ваших останніх записів.')">i</button></div>
  <div class="group" style="padding:10px 14px"><button class="btn add" style="width:100%" onclick="refreshStatusBlock()">↻ Оновити</button></div>
  <div class="group">`;
  DB.platforms.forEach(p=>{
    let last=Infinity, lastDate='';
    DB.shifts.forEach(s=>{ if((s.entries||[]).some(e=>e.platformId===p.id)){ const dd=daysAgo(s.date); if(dd<last){ last=dd; lastDate=s.date; } } });
    const st=statusFor(last);
    const infoMsg = lastDate ? `Останній запис: ${fmtDate(lastDate)}.` : 'Нових записів не знайдено — по цій платформі ще немає жодного запису.';
    html+=`<div class="row"><span class="dot ${st}"></span><div class="rtitle"><b>${esc(p.name)}</b><button type="button" class="infob" onclick="alertSheet('${qesc(p.name)}','${qesc(infoMsg)}')">i</button></div><div class="sub">${statusText(last)}</div></div>`;
  });
  activeCars().forEach(c=>{
    let last=Infinity, lastDate='';
    DB.fuel.forEach(f=>{ if(f.carId===c.id){ const dd=daysAgo(f.date); if(dd<last){ last=dd; lastDate=f.date; } } });
    const st=statusFor(last);
    const lbl=c.fuelType==='ev'?'зарядка':'заправка';
    const infoMsg = lastDate ? `Останній запис (${lbl}): ${fmtDate(lastDate)}.` : `Нових записів не знайдено — ще немає жодної ${lbl==='зарядка'?'зарядки':'заправки'}.`;
    html+=`<div class="row"><span class="dot ${st}"></span><div class="rtitle"><b>${esc(c.name)}</b><button type="button" class="infob" onclick="alertSheet('${qesc(c.name)}','${qesc(infoMsg)}')">i</button></div><div class="sub">остання ${lbl}: ${statusText(last)}</div></div>`;
  });
  if(!DB.platforms.length && !DB.cars.length) html+=`<div class="empty">Ще немає платформ чи авто</div>`;
  html+=`</div>
  <div class="group" style="margin-top:10px">
    <div class="row" onclick="openSettings('appearance')" style="cursor:pointer"><div class="rtitle"><b>Пороги: жовтий ${y} дн. · червоний ${r} дн.</b><div class="sub">Змінити в налаштуваннях</div></div><span class="chev">›</span></div>
  </div>`;
  return html;
}
function refreshStatusBlock(){
  render();
  alertSheet('Оновлено','Статус перераховано з ваших останніх записів.');
}

/* ============ SHIFTS ============ */
/* ===== Swipe-to-delete engine (delegated, works for shifts + expenses lists) ===== */
let swEl=null, swStartX=0, swStartY=0, swBase=0, swLocked=null, swMoved=false, swOpenRow=null;
function swipeInit(){
  const main=$('#main');
  if(!main || main.dataset.swipeBound) return;
  main.dataset.swipeBound='1';
  main.addEventListener('touchstart', swTouchStart, {passive:true});
  main.addEventListener('touchmove', swTouchMove, {passive:false});
  main.addEventListener('touchend', swTouchEnd, {passive:true});
  main.addEventListener('touchcancel', swTouchEnd, {passive:true});
  main.addEventListener('click', swClickGuard, true);
}
function swTouchStart(e){
  swMoved=false; swLocked=null;
  const row=e.target.closest('.swiperow');
  swEl=row||null;
  if(!row) return;
  const t=e.touches[0];
  swStartX=t.clientX; swStartY=t.clientY;
  swBase = row.classList.contains('swopen') ? -84 : 0;
}
function swTouchMove(e){
  if(!swEl) return;
  const t=e.touches[0];
  const dx=t.clientX-swStartX, dy=t.clientY-swStartY;
  if(swLocked===null){
    if(Math.abs(dx)>8 || Math.abs(dy)>8) swLocked = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(swLocked==='x'){
    e.preventDefault();
    swMoved=true;
    swEl.classList.add('swdragging');
    let nx=Math.max(-84, Math.min(0, swBase+dx));
    const content=swEl.querySelector('.swipecontent');
    if(content) content.style.transform=`translateX(${nx}px)`;
  }
}
function swTouchEnd(e){
  if(!swEl) return;
  const content=swEl.querySelector('.swipecontent');
  swEl.classList.remove('swdragging');
  if(swLocked==='x'){
    const t=e.changedTouches[0];
    const dx=t.clientX-swStartX;
    const finalX=swBase+dx;
    const shouldOpen=finalX < -42;
    if(content) content.style.transform='';
    if(swOpenRow && swOpenRow!==swEl) swOpenRow.classList.remove('swopen');
    if(shouldOpen && !swEl.classList.contains('swopen')) haptic('swipe');
    swEl.classList.toggle('swopen', shouldOpen);
    swOpenRow = shouldOpen ? swEl : null;
  }
  swEl=null; swLocked=null;
}
function swClickGuard(e){
  if(swMoved){ e.preventDefault(); e.stopPropagation(); swMoved=false; return; }
  const row=e.target.closest('.swiperow');
  if(swOpenRow && swOpenRow!==row){ swOpenRow.classList.remove('swopen'); swOpenRow=null; return; }
  if(swOpenRow && row===swOpenRow && !e.target.closest('.swipedel')){
    e.preventDefault(); e.stopPropagation();
    swOpenRow.classList.remove('swopen'); swOpenRow=null;
  }
}
/* ===== Edge swipe back (for frameless/buttonless displays) ===== */
let ebStartX=0, ebStartY=0, ebActive=false, ebMoved=false;
function edgeBackInit(){
  if(document.body.dataset.ebBound) return;
  document.body.dataset.ebBound='1';
  document.addEventListener('touchstart', ebTouchStart, {passive:true});
  document.addEventListener('touchmove', ebTouchMove, {passive:false});
  document.addEventListener('touchend', ebTouchEnd, {passive:true});
}
function edgeBackTarget(){
  if(DB.settings && DB.settings.edgeBack===false) return null;
  const root=$('#modalRoot');
  if(!root) return null;
  const fs=root.querySelector('.fullscreen:not(.closing)');
  if(!fs) return null;
  return fs.querySelector('.fstop .fsbtn:not(.right)') || null;
}
function ebTouchStart(e){
  ebActive=false; ebMoved=false;
  const t=e.touches[0];
  if(t.clientX>24) return;
  if(!edgeBackTarget()) return;
  ebStartX=t.clientX; ebStartY=t.clientY;
  ebActive=true;
}
function ebTouchMove(e){
  if(!ebActive) return;
  const t=e.touches[0];
  const dx=t.clientX-ebStartX, dy=t.clientY-ebStartY;
  if(!ebMoved && (Math.abs(dx)>10 || Math.abs(dy)>10)){
    if(Math.abs(dy)>Math.abs(dx)){ ebActive=false; return; }
    ebMoved=true;
  }
  if(ebMoved && dx>0) e.preventDefault();
}
function ebTouchEnd(e){
  if(!ebActive || !ebMoved){ ebActive=false; return; }
  ebActive=false;
  const t=e.changedTouches[0];
  const dx=t.clientX-ebStartX;
  if(dx>60){
    const btn=edgeBackTarget();
    if(btn){ haptic('swipe'); btn.click(); }
  }
}
/* ===== Pull-to-refresh (dashboard) ===== */
let ptrStartY=0, ptrPulling=false, ptrTriggered=false;
function ptrInit(){
  if(document.body.dataset.ptrBound) return;
  document.body.dataset.ptrBound='1';
  document.addEventListener('touchstart', ptrTouchStart, {passive:true});
  document.addEventListener('touchmove', ptrTouchMove, {passive:false});
  document.addEventListener('touchend', ptrTouchEnd, {passive:true});
}
function ptrTouchStart(e){
  ptrPulling=false; ptrTriggered=false;
  if(TAB!=='dash') return;
  if((window.scrollY||document.documentElement.scrollTop||0) > 2) return;
  if(e.target.closest('button,a,input,textarea,select,.seg,.chip,.swiperow')) return;
  ptrStartY=e.touches[0].clientY;
  ptrPulling=true;
}
function ptrTouchMove(e){
  if(!ptrPulling) return;
  const dy=e.touches[0].clientY-ptrStartY;
  if(dy<=0) return;
  if((window.scrollY||document.documentElement.scrollTop||0) > 2){ ptrPulling=false; ptrHide(); return; }
  e.preventDefault();
  const pull=Math.min(70, dy*0.5);
  const ind=$('#ptrIndicator');
  if(ind){
    ind.hidden=false;
    ind.style.opacity=String(Math.min(1, pull/45));
    ind.style.transform=`translateY(${pull-20}px)`;
    ind.textContent = pull>=50 ? '↑' : '↓';
  }
  if(pull>=50 && !ptrTriggered){ ptrTriggered=true; haptic('swipe'); }
  else if(pull<50 && ptrTriggered){ ptrTriggered=false; }
}
function ptrTouchEnd(){
  if(!ptrPulling) return;
  ptrPulling=false;
  const ind=$('#ptrIndicator');
  if(ptrTriggered){
    if(ind){ ind.textContent='⟳'; ind.classList.add('spin'); }
    setTimeout(()=>{ render(); ptrHide(); }, 380);
  }else{
    ptrHide();
  }
}
function ptrHide(){
  const ind=$('#ptrIndicator');
  if(!ind) return;
  ind.style.opacity='0';
  ind.style.transform='translate(-50%, -20px)';
  ind.classList.remove('spin');
  setTimeout(()=>{ if(ind) ind.hidden=true; }, 200);
}
/* ===== Swipe between dashboard periods ===== */
const DASH_PERIOD_ORDER=['today','7d','month','year','all'];
function periodSwipeBind(el, onSwipe){
  if(!el || el.dataset.periodSwipeBound) return;
  el.dataset.periodSwipeBound='1';
  let sx=0, sy=0, locked=null, moved=false;
  el.addEventListener('touchstart', e=>{
    moved=false; locked=null;
    if(e.target.closest('button,a,select,input,textarea,.seg,.chip,.swiperow')){ locked='ignore'; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(locked==='ignore') return;
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(locked===null && (Math.abs(dx)>10 || Math.abs(dy)>10)) locked = Math.abs(dx)>Math.abs(dy)*1.3 ? 'x' : 'y';
    if(locked==='x') moved=true;
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(locked!=='x' || !moved){ locked=null; return; }
    const t=e.changedTouches[0];
    const dx=t.clientX-sx;
    locked=null;
    if(Math.abs(dx)<60) return;
    onSwipe(dx<0?1:-1);
  }, {passive:true});
}
function shiftPeriod(dir){
  let idx=DASH_PERIOD_ORDER.indexOf(PERIOD);
  if(idx===-1) idx=2;
  idx=Math.max(0, Math.min(DASH_PERIOD_ORDER.length-1, idx+dir));
  PERIOD=DASH_PERIOD_ORDER[idx];
}
function dashSwipeInit(){
  periodSwipeBind($('#main'), (dir)=>{
    if(TAB!=='dash' && TAB!=='expenses') return;
    shiftPeriod(dir); render();

}

function loadStartDraft(){ try{ const raw=localStorage.getItem(STDRAFT_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

function lastFinishedShift(){
  if(!DB.shifts.length) return null;
  return [...DB.shifts].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)))[0];
}
function shiftTimeBucket(h){ return h>=6&&h<11?'morning': h>=11&&h<17?'day': h>=17&&h<22?'evening':'night'; }
function suggestedPlatformIds(){
  const nowBucket=shiftTimeBucket(new Date().getHours());
  const counts={};
  DB.shifts.forEach(s=>{
    if(!s.startTime) return;
    if(shiftTimeBucket(new Date(s.startTime).getHours())!==nowBucket) return;
    (s.entries||[]).forEach(e=>{ if(e.platformId) counts[e.platformId]=(counts[e.platformId]||0)+1; });
  });
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return [];
  const total=entries.reduce((a,[,c])=>a+c,0);
  return entries.filter(([,c])=>c/total>=0.3).map(([id])=>id).filter(id=>DB.platforms.some(p=>p.id===id)).slice(0,2);
}
