        : `<div class="empty">Усі ваші платформи вже задіяні на цій зміні.</div>`;
    }else if(type==='cash'){
      extra=`<div class="field"><label>Сума готівки, ₴</label><input type="number" inputmode="decimal" id="ciCash" placeholder="0"></div>`;
    }else if(type==='odo'){
      extra=`<div class="field"><label>Одометр зараз, км</label><input type="number" inputmode="decimal" id="ciOdo"></div>`;
    }else if(type==='note'){
      extra=`<div class="field"><label>Нотатка</label><input type="text" id="ciNote" placeholder="напр. перерва на обід"></div>`;
    }
    return `
      <div class="field"><label>Що сталось? <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Проміжний запис','Це журнал того, що відбувається протягом зміни — для пам\\'яті й для точнішого підрахунку в кінці. Якщо ви працюєте одразу на кількох платформах і одну з них призупиняєте (наприклад, слот доставки скінчився і ви перемкнулись тільки на таксі) — позначте це тут: список активних платформ на зміні оновиться.')">i</button></label>
      <select id="ciType" onchange="ciChangeType(this.value)">${CHECKIN_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===type?'selected':''}>${t[1]}</option>`).join('')}</select></div>
      <div id="ciExtra">${extra}</div>
      <button class="btn primary" onclick="saveCheckin()">Додати запис</button>`;
  }
  showSheet(`<h3>Проміжний запис</h3><div style="margin-top:14px" id="ciWrap">${bodyHtml()}</div>`);
  window.ciChangeType=(v)=>{ type=v; $('#ciWrap').innerHTML=bodyHtml(); };
  window.saveCheckin=()=>{
    const as=DB.activeShift; as.checkins=as.checkins||[]; as.platformIds=as.platformIds||[]; as.pausedPlatformIds=as.pausedPlatformIds||[];
    let text='', extra={};
    if(type==='order'){
      const count=$('#ciCount').value, plId=$('#ciPlat')?.value, p=platById(plId);
      if(!count){ alertSheet('Вкажіть кількість','Скільки замовлень чи доставок?'); return; }
      text=`${count} · ${p?p.name:'замовлення'}`;
    }else if(type==='side_order'){
      const amt=$('#ciSideAmt').value, note=$('#ciSideNote').value.trim();
      if(!amt || num(amt)<=0){ alertSheet('Вкажіть суму','Скільки отримали за це замовлення?'); return; }
      text=`🤝 Без платформи: ${money(num(amt))}${note?' · '+note:''}`;
      extra={amount:num(amt), note};
    }else if(type==='pause_platform'){
      const plId=$('#ciPausePlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що призупиняти','Немає активних платформ на цій зміні.'); return; }
      as.platformIds=as.platformIds.filter(x=>x!==plId);
      if(!as.pausedPlatformIds.includes(plId)) as.pausedPlatformIds.push(plId);
      text=`⏸ Призупинено: ${p.name}`;
    }else if(type==='resume_platform'){
      const plId=$('#ciResumePlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що відновлювати','Немає призупинених платформ.'); return; }
      as.pausedPlatformIds=as.pausedPlatformIds.filter(x=>x!==plId);
      if(!as.platformIds.includes(plId)) as.platformIds.push(plId);
      text=`▶ Відновлено: ${p.name}`;
    }else if(type==='add_platform'){
      const plId=$('#ciAddPlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що додавати','Усі платформи вже задіяні.'); return; }
      if(!as.platformIds.includes(plId)) as.platformIds.push(plId);
      text=`+ Почав(ла) працювати: ${p.name}`;
    }else if(type==='cash'){
      const amt=$('#ciCash').value;
      if(!amt){ alertSheet('Вкажіть суму','Скільки готівки отримали?'); return; }
      text=`💵 Готівка: ${money(num(amt))}`;
    }else if(type==='odo'){
      const odo=$('#ciOdo').value;
      if(!odo){ alertSheet('Вкажіть одометр','Введіть поточний пробіг.'); return; }
      text=`Одометр: ${odo} км`;
    }else if(type==='note'){
      const note=$('#ciNote').value.trim();
      if(!note){ alertSheet('Порожня нотатка','Напишіть текст нотатки.'); return; }
      text=note;
    }
    as.checkins.push({ t:Date.now(), type, text, ...extra, platformIds:[...as.platformIds] });
    save(); closeSheet(); render();
  };
}
function requestCancelShift(){

  });
}
function openFinishShiftForm(){
  const as=DB.activeShift; if(!as) return;
  const c=carById(as.carId);
  const rowId=()=>uid();
  let entries=(as.platformIds&&as.platformIds.length ? as.platformIds : [DB.platforms[0]?.id]).filter(Boolean).map(pid=>({id:rowId(), platformId:pid, mode:'net', amount:'', gross:'', commission:'', orders:''}));
  if(!entries.length) entries=[{id:rowId(), platformId:DB.platforms[0]?.id||'', mode:'net', amount:'', gross:'', commission:'', orders:''}];
  const sideTotal=(as.checkins||[]).filter(ci=>ci.type==='side_order').reduce((s,ci)=>s+num(ci.amount),0);
  if(sideTotal>0) entries.push({id:rowId(), platformId:'', mode:'net', amount:String(sideTotal), gross:'', commission:'', orders:''});
  function fEntryNet(en){ return en.mode==='gross' ? Math.max(0, num(en.gross)-num(en.commission)) : num(en.amount); }
  function entryRows(){
    return entries.map(en=>`
      <div class="platentry" data-en="${en.id}">
        <div class="platrow">
          <select onchange="updFEntry('${en.id}','platformId',this.value)">
            <option value="" ${en.platformId===''?'selected':''}>Без платформи (готівка)</option>
            ${DB.platforms.map(p=>`<option value="${p.id}" ${p.id===en.platformId?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
          ${en.mode==='gross'
            ? `<div class="tnum" style="text-align:right;padding:10px 2px;font-weight:700">${money(fEntryNet(en))}</div>`
            : `<input type="number" inputmode="decimal" placeholder="₴" value="${en.amount}" onchange="updFEntry('${en.id}','amount',this.value)">`}
          <button class="iconbtn" onclick="rmFEntry('${en.id}')">✕</button>
        </div>
        <div style="text-align:right;margin:-2px 0 8px">
          <button type="button" style="background:none;border:0;color:var(--blue);font-size:12px;padding:2px" onclick="toggleFEntryMode('${en.id}')">${en.mode==='gross'?'Ввести чистими':'Ввести деталі (брудний дохід і комісія)'}</button>
        </div>
        ${en.mode==='gross'?`
        <div class="row2" style="margin-bottom:8px">
          <div class="field" style="margin:0"><label style="font-size:11px">Дохід загальний, ₴</label><input type="number" inputmode="decimal" value="${en.gross}" onchange="updFGross('${en.id}',this.value)"></div>
          <div class="field" style="margin:0"><label style="font-size:11px">Комісія, ₴</label><input type="number" inputmode="decimal" value="${en.commission}" onchange="updFEntry('${en.id}','commission',this.value);refreshFEntries()"></div>
        </div>
        <div class="field" style="margin-bottom:10px"><label style="font-size:11px">Кількість замовлень (необов'язково)</label><input type="number" inputmode="numeric" value="${en.orders}" onchange="updFEntry('${en.id}','orders',this.value)"></div>
        `:''}
      </div>`).join('');
  }
  function refreshFEntries(){ $('#fEntriesWrap').innerHTML=entryRows(); }
  window.updFEntry=(id,field,val)=>{ const e=entries.find(x=>x.id===id); if(e) e[field]=val; };
  window.updFGross=(id,val)=>{
    const e=entries.find(x=>x.id===id); if(!e) return;
    e.gross=val;
    const p=platById(e.platformId);
    if(p && p.commissionPct && (e.commission==='' || e.commission==null)) e.commission=(num(val)*p.commissionPct/100).toFixed(2);
    refreshFEntries();
  };
  window.toggleFEntryMode=(id)=>{
    const e=entries.find(x=>x.id===id); if(!e) return;
    if(e.mode==='gross'){ e.amount=String(fEntryNet(e)||''); e.mode='net'; }
    else{ e.mode='gross'; if(!e.gross) e.gross=e.amount||''; }
    refreshFEntries();
  };
  window.rmFEntry=(id)=>{ entries=entries.filter(x=>x.id!==id); if(!entries.length) entries=[{id:rowId(),platformId:DB.platforms[0]?.id||'',mode:'net',amount:'',gross:'',commission:'',orders:''}]; refreshFEntries(); };
  window.addFEntry=()=>{ entries.push({id:rowId(), platformId:DB.platforms[0]?.id||'', mode:'net', amount:'', gross:'', commission:'', orders:''}); refreshFEntries(); };

  const elapsedH=Math.round(activeElapsedMs()/36000)/100;
  const platHoursNow=computePlatformHours(as, Date.now());
  const breakdownHtml = Object.keys(platHoursNow).length>1 ? `<div class="sub" style="margin-top:4px">${Object.entries(platHoursNow).map(([pid,h])=>`${esc(platById(pid)?.name||'?')} ~${(Math.round(h*10)/10)} год`).join(' · ')} (загальна тривалість не підсумовується, бо платформи йшли паралельно)</div>` : '';
  showSheet(`
    <h3>Завершити зміну</h3>
    <div class="confirm-msg" style="margin-bottom:0">${esc(c?c.name:'')} · тривалість ${fmtDur(activeElapsedMs())}</div>
    <div style="margin-top:14px">
      <div class="field"><label>Дохід по платформах</label>
        <div id="fEntriesWrap">${entryRows()}</div>
        <button class="btn add" onclick="addFEntry()">+ Додати платформу</button>
      </div>
      <div class="field"><label>Чайові, ₴ (загалом)</label><input type="number" inputmode="decimal" id="fTips" placeholder="0"></div>
      <div class="row2">
        <div class="field"><label>Годин за кермом <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Годин за кермом','Якщо залишити поле порожнім, система сама порахує тривалість зміни від початку до завершення (за вирахуванням пауз). Якщо ви працювали одразу на кількох платформах паралельно, загальна тривалість не подвоюється — це реальний час за кермом.')">i</button></label><input type="number" inputmode="decimal" id="fHours" placeholder="${elapsedH}">${breakdownHtml}</div>
        <div class="field"><label>Одометр в кінці, км</label><input type="number" inputmode="decimal" id="fEndOdo" value="${as.startOdo||''}"></div>
      </div>
      ${as.startCash?`<div class="field"><label>Готівка при собі на старті</label><div class="confirm-msg" style="margin:0">Було: ${money(num(as.startCash))}. Звірте з тим, скільки готівки у вас зараз, враховуючи прийняту готівку за зміну.</div></div>`:''}
      <div class="field"><label>Нотатка</label><textarea id="fNote"></textarea></div>
      <button class="btn primary" onclick="doFinishShift()">Зберегти зміну</button>
    </div>
  `);
  window.doFinishShift=()=>{
    const tips=num($('#fTips').value);
    let finalEntries=entries.filter(e=>fEntryNet(e)>0).map(e=>({platformId:e.platformId, amount:fEntryNet(e), tips:0, ...(e.mode==='gross'?{gross:num(e.gross), commission:num(e.commission), orders:num(e.orders)||0}:{})}));
    if(!finalEntries.length && tips>0){ finalEntries=[{platformId:entries[0]?.platformId||DB.platforms[0]?.id, amount:0, tips:0}]; }
    if(!finalEntries.length){ alertSheet('Додайте дохід','Вкажіть суму хоча б для однієї платформи або чайові.'); return; }
    if(tips>0) finalEntries[0].tips=tips;
    const endOdo=num($('#fEndOdo').value);
    const km=Math.max(0, endOdo - num(as.startOdo));
    const hoursRaw=$('#fHours').value;
    const hours = hoursRaw!=='' ? num(hoursRaw) : elapsedH;
    const endTime=Date.now();
    const s={ id:uid(), date:today(), carId:as.carId, entries:finalEntries, hours, platformHours:computePlatformHours(as,endTime), km, startOdo:as.startOdo, endOdo, startCash:as.startCash||0, startTime:as.startTime, endTime, checkins:as.checkins||[], note:$('#fNote').value.trim(), log:[] };
    const car=carById(s.carId); if(car && endOdo>num(car.odo)) car.odo=endOdo;
    const avgBefore=shiftAverageIncome();
    DB.shifts.push(s); DB.activeShift=null; save(); haptic('success'); render(); manageTimerLoop();
    openShiftSavedSheet(s, avgBefore);
  };
}
function shiftAverageIncome(){
  if(!DB.shifts.length) return null;
  return DB.shifts.reduce((a,x)=>a+shiftIncome(x),0)/DB.shifts.length;
}
function openShiftSavedSheet(s, avg){
  const income=shiftIncome(s);
  let cmpHtml='';
  if(avg!==null && avg>0){
    const pct=Math.round((income-avg)/avg*100);
    const better=pct>=0;
    cmpHtml=`<div class="confirm-msg" style="margin-top:10px"><span style="color:${better?'var(--green)':'var(--red)'};font-weight:700">${better?'▲':'▼'} ${better?'+':''}${pct}%</span> ${better?'краще':'гірше'} за вашу середню зміну (${money(avg)})</div>`;
  }
  showSheet(`
    <h3>Зміну збережено ✅</h3>
    <div class="confirm-msg">Дохід зміни: ${money(income)}</div>
    ${cmpHtml}
    <button class="btn primary" style="margin-top:14px" onclick="closeSheet()">Готово</button>
  `, {center:true});
}

function openShiftDetail(id){

    ${dayExpTotal>0?`<div class="field" style="margin-top:14px"><label>Витрати цього дня <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Витрати цього дня','Пальне/зарядка — заправки цього авто в цю дату. Інші витрати — записи з вкладки «Витрати» за цю дату (загальні або на це авто). Може не збігатись один в один зі зміною, якщо записів за день кілька.')">i</button></label><div class="group">
      ${dayFuelExp>0?`<div class="row"><div class="rtitle"><b>Пальне / зарядка</b></div><div class="rval tnum neg">${money(dayFuelExp)}</div></div>`:''}
      ${dayOtherExp>0?`<div class="row"><div class="rtitle"><b>Інші витрати</b></div><div class="rval tnum neg">${money(dayOtherExp)}</div></div>`:''}
      <div class="row"><div class="rtitle"><b>Разом чистими за день</b></div><div class="rval tnum ${totalIncome-dayExpTotal>=0?'pos':'neg'}">${money(totalIncome-dayExpTotal)}</div></div>
    </div></div>`:''}
    <div class="row2" style="margin-top:18px">
      <button class="btn add" onclick="openShiftEditForm('${s.id}')">Редагувати</button>
      <button class="btn danger" onclick="requestDeleteShift('${s.id}')">Видалити</button>
    </div>
    ${logHtml}
  `);

function openShiftEditForm(id){
  const s=DB.shifts.find(x=>x.id===id); if(!s) return;
  const rowId=()=>uid();
  let entries=(s.entries||[]).map(en=>({ id:rowId(), platformId:en.platformId, amount:String(en.amount), tips:en.tips||0 }));
  if(!entries.length) entries=[{id:rowId(), platformId:DB.platforms[0]?.id||'', amount:'', tips:0}];
  function entryRows(){
    return entries.map(en=>`
      <div class="platrow" data-en="${en.id}">
        <select onchange="updSEEntry('${en.id}','platformId',this.value)">
          <option value="" ${en.platformId===''?'selected':''}>Без платформи (готівка)</option>
          ${DB.platforms.map(p=>`<option value="${p.id}" ${p.id===en.platformId?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>
        <input type="number" inputmode="decimal" placeholder="₴" value="${en.amount}" onchange="updSEEntry('${en.id}','amount',this.value)">
        <button class="iconbtn" onclick="rmSEEntry('${en.id}')">✕</button>
      </div>`).join('');
  }
  window.updSEEntry=(eid,field,val)=>{ const e=entries.find(x=>x.id===eid); if(e) e[field]=val; };
  window.rmSEEntry=(eid)=>{ entries=entries.filter(x=>x.id!==eid); if(!entries.length) entries=[{id:rowId(),platformId:DB.platforms[0]?.id||'',amount:'',tips:0}]; $('#seEntriesWrap').innerHTML=entryRows(); };
  window.addSEEntry=()=>{ entries.push({id:rowId(), platformId:DB.platforms[0]?.id||'', amount:'', tips:0}); $('#seEntriesWrap').innerHTML=entryRows(); };
  showSheet(`
    <h3>Редагувати зміну</h3>
    <div style="margin-top:14px">
      <div class="field"><label>Дата</label><input type="date" id="seDate" value="${s.date}"></div>
      <div class="field"><label>Дохід по платформах</label>
        <div id="seEntriesWrap">${entryRows()}</div>
        <button class="btn add" onclick="addSEEntry()">+ Додати платформу</button>
      </div>
      <div class="field"><label>Годин за кермом</label><input type="number" inputmode="decimal" id="seHours" value="${s.hours||''}"></div>
      <div class="field"><label>Пробіг, км</label><input type="number" inputmode="decimal" id="seKm" value="${s.km||''}"></div>
      <div class="field"><label>Нотатка</label><textarea id="seNote">${esc(s.note||'')}</textarea></div>
      <button class="btn primary" onclick="saveShiftEdit('${s.id}')">Зберегти зміни</button>
    </div>
  `);
  window.saveShiftEdit=(id)=>{
    const sh=DB.shifts.find(x=>x.id===id); if(!sh) return;
    const finalEntries=entries.filter(e=>num(e.amount)>0).map(e=>({platformId:e.platformId, amount:num(e.amount), tips:num(e.tips)||0}));
    if(!finalEntries.length){ alertSheet('Додайте дохід','Вкажіть суму хоча б для однієї платформи.'); return; }
    const prev={ date:sh.date, entries:sh.entries, hours:sh.hours, km:sh.km, note:sh.note };
    const oldTotal=(sh.entries||[]).reduce((a,e)=>a+num(e.amount)+num(e.tips),0);
    sh.date=$('#seDate').value||sh.date; sh.entries=finalEntries; sh.hours=num($('#seHours').value); sh.km=num($('#seKm').value); sh.note=$('#seNote').value.trim();
    const newTotal=finalEntries.reduce((a,e)=>a+e.amount+e.tips,0);
    sh.log=sh.log||[]; sh.log.push({ t:Date.now(), text:`Відредаговано: ${money(oldTotal)} → ${money(newTotal)}`, prev });
    save(); closeSheet(); render();
  };
}
function revertShiftLog(id, logIdx){
  const sh=DB.shifts.find(x=>x.id===id); if(!sh) return;
  const entry=sh.log&&sh.log[logIdx]; if(!entry||!entry.prev) return;
  const cur={ date:sh.date, entries:sh.entries, hours:sh.hours, km:sh.km, note:sh.note };
  Object.assign(sh, entry.prev);
  sh.log.push({ t:Date.now(), text:'Відновлено попередню версію', prev:cur });
  save(); openShiftDetail(id);
}
function requestDeleteShift(id){
  confirmDelete('Видалити зміну?','Дохід за цю зміну зникне з усіх звітів.', ()=>{
    const s=DB.shifts.find(x=>x.id===id);
    if(s){ const c=carById(s.carId); if(c && s.km) c.odo=Math.max(0,num(c.odo)-s.km); }
    DB.shifts=DB.shifts.filter(x=>x.id!==id); save(); render();
  });
}

let expSearchQ='', expSearchCatFilter='';
function expenseListHtml(list){
  const q=expSearchQ.trim().toLowerCase();
  const filtered=list.filter(e=>{
    if(expSearchCatFilter && e.category!==expSearchCatFilter) return false;
    if(q){
      const c=carById(e.carId); const cat=catById(e.category);
      const hay=[cat.name, c?c.name:'', e.note||''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(!filtered.length) return `<div class="group"><div class="empty">${q||expSearchCatFilter?'Нічого не знайдено за цим фільтром':'Немає витрат за цей період'}</div></div>`;
  const groups=[]; let curKey=null, curArr=null;
  filtered.forEach(e=>{ if(e.date!==curKey){ curKey=e.date; curArr=[]; groups.push([curKey,curArr]); } curArr.push(e); });
  return groups.map(([date,items])=>`<div class="section-label" style="margin-top:16px">${esc(dateGroupLabel(date))}</div><div class="group">${items.map(e=>{
    const c=carById(e.carId); const cat=catById(e.category);
    return `<div class="swiperow">
      <button type="button" class="swipedel" onclick="swipeDeleteExpense('${e.id}')">Видалити</button>
      <div class="row swipecontent" onclick="openExpenseDetail('${e.id}')" style="cursor:pointer">
        <div class="icobadge" style="background:${cat.color||'var(--tx3)'}">${icon(cat.icon||'info',17)}</div>
        <div class="rtitle"><b>${esc(cat.name)}</b><div class="sub">${c?esc(c.name)+' · ':''}${e.work?'робоча':'особиста'}${e.payment?' · '+(e.payment==='cash'?'готівка':'картка'):''}${e.note?' · '+esc(e.note):''}</div></div>
        <div class="rval tnum neg">${money(e.amount)}</div><span class="chev">›</span>
      </div>
    </div>`;
  }).join('')}</div>`).join('');
}
function dateGroupLabel(dateStr){
  if(dateStr===today()) return 'Сьогодні';
  const y=new Date(); y.setDate(y.getDate()-1);
  if(dateStr===toLocalISO(y)) return 'Вчора';
  return fmtDate(dateStr);
}
function updateExpenseList(){
  const all=[...DB.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const list=all.filter(e=>inPeriod(e.date));
  const el=$('#expListGroup'); if(el) el.innerHTML=expenseListHtml(list);
}
function renderExpenses(){
  const all=[...DB.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const list=all.filter(e=>inPeriod(e.date));
  const periods=[['today','Сьогодні'],['7d','7 днів'],['month','Місяць'],['year','Рік'],['all','Весь час']];
  let html=`<div class="seg">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';render()">${p[1]}</button>`).join('')}
    <button class="${PERIOD==='custom'?'on':''}" onclick="openCustomPeriod()">Період</button></div>`;

  if(!all.length){
    html+=`<div class="group" style="margin-top:14px"><div class="emptybig"><div class="ei">${icon('cart',26)}</div>Витрат ще немає.<br>Пальне та зарядки записуються у вкладці «Авто».</div></div>`;
    $('#main').innerHTML=html; return;
  }

  const total=list.reduce((a,e)=>a+num(e.amount),0);
  const byCat={}; list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=Math.max(1,...catRows.map(r=>r[1]));

  html+=`<div class="hero" style="margin-top:14px"><div class="lbl">Витрати за період</div><div class="big tnum neg">${money(total)}</div><div class="sub">${list.length} ${list.length===1?'запис':'записів'}</div></div>`;

  if(catRows.length){
    html+=`<div class="section-label">По категоріях</div><div class="group">`;
    catRows.forEach(([cid,val])=>{
      const cat=catById(cid); const pct=Math.round(val/maxCat*100);
      const catItems=list.filter(e=>e.category===cid);
      const sharePct=total>0?Math.round(val/total*100):0;
      const avg=catItems.length?val/catItems.length:0;
      const recent=[...catItems].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
      html+=`<details class="catdrop">
        <summary><div class="barrow" style="margin:0;pointer-events:none"><div class="bhead"><span>${esc(cat.name)}</span><b class="tnum">${money(val)}</b></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:var(--red)"></div></div></div></summary>
        <div class="catdrop-body">
          <div class="catdrop-stats">
            <div><b class="tnum">${catItems.length}</b><span>${catItems.length===1?'запис':'записів'}</span></div>
            <div><b class="tnum">${sharePct}%</b><span>від витрат</span></div>
            <div><b class="tnum">${money(avg)}</b><span>в середньому</span></div>
          </div>
          ${recent.length?`<div class="catdrop-list">${recent.map(e=>`<div class="catdrop-item"><span>${fmtDateShort(e.date)}${e.note?' · '+esc(e.note):''}</span><b class="tnum">${money(num(e.amount))}</b></div>`).join('')}</div>`:''}
        </div>
      </details>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="section-label">Записи</div>
  <div class="field" style="margin-top:0"><input type="search" placeholder="🔍 Пошук за нотаткою, категорією, авто…" value="${esc(expSearchQ)}" oninput="expSearchQ=this.value;updateExpenseList()"></div>
  <div class="chipwrap" style="margin:-4px 0 10px">
    <button type="button" class="chip ${!expSearchCatFilter?'on':''}" onclick="expSearchCatFilter='';renderExpenses()">Всі категорії</button>
    ${EXP_CATS.map(c=>`<button type="button" class="chip ${expSearchCatFilter===c.id?'on':''}" onclick="expSearchCatFilter='${c.id}';renderExpenses()">${esc(c.name)}</button>`).join('')}
  </div>
  <div id="expListGroup">${expenseListHtml(list)}</div>`;
  $('#main').innerHTML=html;
}

function revertExpenseLog(id, logIdx){
  const ex=DB.expenses.find(x=>x.id===id); if(!ex) return;
  const entry=ex.log&&ex.log[logIdx]; if(!entry||!entry.prev) return;
  const cur={ date:ex.date, amount:ex.amount, category:ex.category, carId:ex.carId, work:ex.work, payment:ex.payment, note:ex.note };

function carLastActivityDays(c){
  let last=Infinity;
  DB.fuel.forEach(f=>{ if(f.carId===c.id){ const d=daysAgo(f.date); if(d<last) last=d; } });
  DB.shifts.forEach(s=>{ if(s.carId===c.id){ const d=daysAgo(s.date); if(d<last) last=d; } });
  DB.expenses.forEach(e=>{ if(e.carId===c.id){ const d=daysAgo(e.date); if(d<last) last=d; } });
  return last;
}

function computeConsumption(car, logsAny){
  const logs=[...logsAny].sort((a,b)=>a.odo-b.odo);
  const fullIdx=[]; logs.forEach((f,i)=>{ if(f.full) fullIdx.push(i); });
  if(fullIdx.length<2) return {value:null, costPerKm:null};
  const i1=fullIdx[fullIdx.length-2], i2=fullIdx[fullIdx.length-1];
  const odo1=logs[i1].odo, odo2=logs[i2].odo;
  const dist=odo2-odo1;
  if(dist<=0) return {value:null, costPerKm:null};
  let amt=0, cost=0;
  for(let i=i1+1;i<=i2;i++){ amt+=num(logs[i].amount); cost+=num(logs[i].cost); }
  return { value: amt/dist*100, costPerKm: cost/dist };
}

function savePlate(id){
  const c=carById(id); if(!c) return;
  const newStandard=$('#plStandard').value.trim().toUpperCase();
  const newVanity=$('#plVanity').value.trim();
  const seg=$('#plDisplaySeg');
  const btns=[...seg.querySelectorAll('button')];
  const onIdx=btns.findIndex(b=>b.classList.contains('on'));
  const newDisplay = onIdx===1 && newVanity ? 'vanity' : 'standard';
  const prev={ plateStandard:c.plateStandard||'', plateVanity:c.plateVanity||'', plateDisplay:c.plateDisplay||'standard' };
  const changed = prev.plateStandard!==newStandard || prev.plateVanity!==newVanity || prev.plateDisplay!==newDisplay;
  c.plateStandard=newStandard; c.plateVanity=newVanity; c.plateDisplay=newDisplay;
  if(changed){
    c.plateLog=c.plateLog||[];
    const parts=[];
    if(prev.plateStandard!==newStandard) parts.push(`звичайний ${prev.plateStandard||'—'} → ${newStandard||'—'}`);
    if(prev.plateVanity!==newVanity) parts.push(`іменний ${prev.plateVanity||'—'} → ${newVanity||'—'}`);
    if(prev.plateDisplay!==newDisplay) parts.push(`у назві показується: ${newDisplay==='vanity'?'іменний':'звичайний'}`);
    c.plateLog.push({ t:Date.now(), text:parts.length?('Змінено номер: '+parts.join('; ')):'Оновлено номер', prev });
  }
  save(); renderCarDetail(id);
}
function revertPlateLog(carId, idx){
  const c=carById(carId); if(!c) return;
  const entry=c.plateLog&&c.plateLog[idx]; if(!entry||!entry.prev) return;
  const cur={ plateStandard:c.plateStandard||'', plateVanity:c.plateVanity||'', plateDisplay:c.plateDisplay||'standard' };
  Object.assign(c, entry.prev);
  c.plateLog.push({ t:Date.now(), text:'Відновлено попередній номер', prev:cur });
  save(); renderCarDetail(carId);
}

/* ============ CIRCULAR PHOTO CROP ============ */
let CROP={img:null, natW:0, natH:0, baseScale:1, zoom:1, offX:0, offY:0, target:null, targetId:null, dragging:false, lastX:0, lastY:0};
function cropDragStart(e){ CROP.dragging=true; CROP.lastX=e.clientX; CROP.lastY=e.clientY; e.preventDefault(); }
function cropDragMove(e){ if(!CROP.dragging) return; const dx=e.clientX-CROP.lastX, dy=e.clientY-CROP.lastY; CROP.lastX=e.clientX; CROP.lastY=e.clientY; CROP.offX+=dx; CROP.offY+=dy; renderCropPreview(); }
function cropDragEnd(){ CROP.dragging=false; }
function openCropModal(dataUrl, target, targetId){
  const img=new Image();
  img.onload=()=>{
    CROP={ img, natW:img.width, natH:img.height, baseScale:200/Math.min(img.width,img.height), zoom:1, offX:0, offY:0, target, targetId, dragging:false, lastX:0, lastY:0 };
    showSheet(`
      <h3>Кадрування фото</h3>
      <div class="confirm-msg">Перетягніть, щоб перемістити, і використайте повзунок для масштабу.</div>
      <div id="cropBox" style="width:200px;height:200px;border-radius:50%;overflow:hidden;position:relative;background:var(--fill);margin:14px auto;touch-action:none;cursor:grab">
        <img id="cropImg" style="position:absolute;user-select:none;pointer-events:none" src="${dataUrl}">
      </div>
      <input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%" oninput="CROP.zoom=this.value/100;renderCropPreview()">
      <div class="row2" style="margin-top:14px">
        <button class="btn ghost" onclick="closeCropModal()">Скасувати</button>
        <button class="btn primary" onclick="confirmCrop()">Зберегти</button>
      </div>
    `, {center:true});
    renderCropPreview();
    const box=$('#cropBox');
    box.addEventListener('pointerdown', cropDragStart);
    window.addEventListener('pointermove', cropDragMove);
    window.addEventListener('pointerup', cropDragEnd);
  };
  img.src=dataUrl;
}
function renderCropPreview(){
  const im=$('#cropImg'); if(!im) return;
  const scale=CROP.baseScale*CROP.zoom;
  const w=CROP.natW*scale, h=CROP.natH*scale;
  im.style.width=w+'px'; im.style.height=h+'px';
  im.style.left=(100-w/2+CROP.offX)+'px'; im.style.top=(100-h/2+CROP.offY)+'px';
}
function closeCropModal(){
  window.removeEventListener('pointermove', cropDragMove);
  window.removeEventListener('pointerup', cropDragEnd);
  closeSheet();
}
function confirmCrop(){
  const scale=CROP.baseScale*CROP.zoom;
  const w=CROP.natW*scale, h=CROP.natH*scale;
  const left=100-w/2+CROP.offX, top=100-h/2+CROP.offY;
  const canvas=document.createElement('canvas'); canvas.width=200; canvas.height=200;
  const ctx=canvas.getContext('2d');
  ctx.save(); ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.closePath(); ctx.clip();
  ctx.drawImage(CROP.img, left, top, w, h);
  ctx.restore();
  const dataUrl=canvas.toDataURL('image/jpeg',0.85);
  const target=CROP.target, targetId=CROP.targetId;
  window.removeEventListener('pointermove', cropDragMove);
  window.removeEventListener('pointerup', cropDragEnd);
  closeSheet();
  if(target==='car'){ const c=carById(targetId); if(c){ c.photo=dataUrl; save(); } renderCarDetail(targetId); }
  else if(target==='profile'){ DB.profile.photo=dataUrl; save(); if($('#modalRoot').innerHTML.trim()) openSettings(SETTINGS_TAB); if(TAB==='profile') renderProfile(); }
}

function carServiceTrendHtml(c){
  const svcExp=DB.expenses.filter(e=>e.carId===c.id && e.category==='service');
  if(!svcExp.length) return '';
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:d.toLocaleDateString('uk-UA',{month:'short'}) });
  }
  const byMonth={}; months.forEach(m=>byMonth[m.key]=0);
  svcExp.forEach(e=>{ const k=e.date.slice(0,7); if(k in byMonth) byMonth[k]+=num(e.amount); });
  const max=Math.max(1,...Object.values(byMonth));
  const total6=Object.values(byMonth).reduce((a,b)=>a+b,0);
  const curKey=months[months.length-1].key, curVal=byMonth[curKey]||0;
  const priorVals=months.slice(0,-1).map(m=>byMonth[m.key]).filter(v=>v>0);
  const priorAvg=priorVals.length ? priorVals.reduce((a,b)=>a+b,0)/priorVals.length : 0;
  const anomaly = priorVals.length>=2 && curVal > priorAvg*1.6 && curVal-priorAvg>300;
  return `<div class="section-label">Витрати на обслуговування по місяцях</div>
  ${anomaly?`<div class="group" style="margin-bottom:10px"><div class="row"><span class="dot r"></span><div class="rtitle"><b>Цей місяць дорожчий за звичайне</b><div class="sub">${money(curVal)} проти середніх ${money(priorAvg)} — можливо, щось зламалось або відремонтовано дорожче, ніж зазвичай</div></div></div></div>`:''}
  <div class="group" style="padding:12px 14px">
    ${months.map(m=>{ const v=byMonth[m.key]; const pct=Math.round(v/max*100); return `<div class="barrow"><div class="bhead"><span style="text-transform:capitalize">${esc(m.label)}</span><b class="tnum">${money(v)}</b></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:var(--red)"></div></div></div>`; }).join('')}

  </div>`;
}

function nextTaxDueDate(day){
  const now=new Date(); const d=Math.min(28,Math.max(1,day||15));
  let due=new Date(now.getFullYear(), now.getMonth(), d);
  if(toLocalISO(due)<today()) due=new Date(now.getFullYear(), now.getMonth()+1, d);
  return toLocalISO(due);
}
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); const t=new Date(today()+'T00:00:00'); return Math.round((d-t)/86400000); }
function dueBadge(days){ if(days===null) return ''; if(days<0) return `<span class="dot r"></span> прострочено на ${-days} дн.`; if(days<=3) return `<span class="dot r"></span> через ${days} дн.`; if(days<=10) return `<span class="dot y"></span> через ${days} дн.`; return `<span class="dot g"></span> через ${days} дн.`; }
function moneyCur(amount, currency){ return currency==='USD' ? '$'+num(amount).toLocaleString('uk-UA',{maximumFractionDigits:2}) : money(amount); }
function allPayments(){
  const items=[];
  activeCars().forEach(c=>{
    const loan=c.loan, ltype=loan&&(loan.scheduleType||'monthly');
    if(loan && ltype==='weekly' && num(loan.weeklyAmount)>0 && loan.nextDate){
      items.push({ carId:c.id, carName:c.name, kind:'loan', label:'Викуп (щотижнево)', amount:num(loan.weeklyAmount), amountLabel:moneyCur(loan.weeklyAmount, loan.currency), date:loan.nextDate });
    }else if(loan && ltype==='custom' && (loan.customPayments||[]).length){
      const upcoming=[...loan.customPayments].filter(p=>p.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
      if(upcoming) items.push({ carId:c.id, carName:c.name, kind:'loan', label:'Кредит / лізинг'+(upcoming.note?' · '+upcoming.note:''), amount:num(upcoming.amount), date:upcoming.date });
    }else if(loan && num(loan.monthlyPayment)>0 && loan.nextDate){
      items.push({ carId:c.id, carName:c.name, kind:'loan', label:'Кредит / лізинг', amount:num(loan.monthlyPayment), date:loan.nextDate });
    }
    carInsurances(c).forEach(ins=>{
      if(!ins.renewDate) return;
      const t=INSURANCE_TYPES[ins.type]||INSURANCE_TYPES.other;
      const amt = ins.mode==='period' ? num(ins.totalCost) : num(ins.monthly);
      if(amt<=0) return;
      items.push({ carId:c.id, carName:c.name, kind:'insurance', label:t.label, amount:amt, date:ins.renewDate });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}

function loanMonthlyEquivalent(c){
  const loan=c.loan; if(!loan) return 0;
  const type=loan.scheduleType||'monthly';
  if(type==='weekly'){
    const uah = loan.currency==='USD' ? num(loan.weeklyAmount)*(num(loan.usdRate)||0) : num(loan.weeklyAmount);
    return uah*4.345;
  }
  if(type==='custom'){
    const list=loan.customPayments||[];
    if(!list.length) return 0;
    const from=today();
    const toD=new Date(from+'T00:00:00'); toD.setMonth(toD.getMonth()+12);
    const to=toLocalISO(toD);
    const sum=list.filter(p=>p.date>=from && p.date<=to).reduce((a,p)=>a+num(p.amount),0);
    return sum/12;
  }
  return num(loan.monthlyPayment);
}

function saveInsuranceForm(carId, idx){
  const c=carById(carId); if(!c) return;
  const inss=carInsurances(c);
  const mode = window.__insMode || 'monthly';
  let entry;
  const common={ company:$('#insCompany').value.trim(), policyNumber:$('#insPolicyNum').value.trim(), photo:window.__insPhoto||'' };
  if(mode==='period'){
    const t=$('#insTerm').value;
    const months = t==='custom' ? num($('#insCustomMonths').value) : num(t);
    const totalCost=num($('#insTotalCost').value);
    const monthly = months>0 ? totalCost/months : 0;
    entry={ type:$('#insType').value, mode:'period', periodMonths:months, totalCost, monthly, renewDate:$('#insDate').value||'', note:$('#insNote').value.trim(), ...common };
  }else{
    entry={ type:$('#insType').value, mode:'monthly', monthly:num($('#insMonthly').value), periodMonths:0, totalCost:0, renewDate:$('#insDate').value||'', note:$('#insNote').value.trim(), ...common };
  }
  if(idx>=0) inss[idx]=Object.assign({},inss[idx],entry); else inss.push(Object.assign({id:uid()},entry));
  save(); closeSheet(); renderCarDetail(carId);
}
function requestDeleteInsurance(carId, idx){

function carEarningsHtml(c){

  const rows=Object.entries(byPlat).sort((a,b)=>b[1]-a[1]);

  let html=`<div class="seg">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';renderCarDetail('${c.id}')">${p[1]}</button>`).join('')}</div>`;

  html+=`</div>`;
  return html;
}
function openCarPlatformDetail(carId, pid){
  const c=carById(carId);
  const shifts=DB.shifts.filter(s=>s.carId===carId && inPeriod(s.date));
  const shiftsWith=shifts.filter(s=>(s.entries||[]).some(e=>e.platformId===pid));
  const p=platById(pid);
  let income=0, orders=0, hasOrders=false, commission=0, hasCommission=0, grossTotal=0, tips=0;
  shiftsWith.forEach(s=>(s.entries||[]).forEach(e=>{
    if(e.platformId!==pid) return;
    income+=num(e.amount)+num(e.tips); tips+=num(e.tips);
    if(e.orders){ orders+=e.orders; hasOrders=true; }
    if(e.commission!=null){ commission+=e.commission; hasCommission++; grossTotal+=num(e.gross); }
  }));
  let hours=0;
  shiftsWith.forEach(s=>{ const ph=s.platformHours; if(ph && ph[pid]!==undefined) hours+=ph[pid]; else if((s.entries||[]).length===1) hours+=num(s.hours); });
  let html=`<h3>${esc(p?p.name:'Платформа')}</h3><div class="confirm-msg">${esc(c?c.name:'')} · ${shiftsWith.length} ${shiftsWith.length===1?'зміна':'змін'} за період</div>`;
  html+=`<div class="group">
    <div class="row"><div class="rtitle"><b>Дохід</b></div><div class="rval tnum pos">${money(income)}</div></div>
    ${tips>0?`<div class="row"><div class="rtitle"><b>З них чайові</b></div><div class="rval tnum">${money(tips)}</div></div>`:''}
    ${hours?`<div class="row"><div class="rtitle"><b>Години</b></div><div class="rval tnum">${hours.toFixed(1)} год</div></div><div class="row"><div class="rtitle"><b>₴ за годину</b></div><div class="rval tnum">${money(income/hours)}</div></div>`:''}
    ${hasOrders?`<div class="row"><div class="rtitle"><b>Кількість замовлень</b></div><div class="rval tnum">${orders}</div></div>`:''}
    ${hasCommission?`<div class="row"><div class="rtitle"><b>Комісія сплачена</b></div><div class="rval tnum neg">${money(commission)}</div><div class="sub">із брудного доходу ${money(grossTotal)}${grossTotal?' · '+(commission/grossTotal*100).toFixed(1)+'%':''}</div></div>`:''}
    ${p&&p.commissionPct?`<div class="row"><div class="rtitle"><b>Комісія за замовчуванням</b></div><div class="rval tnum">${p.commissionPct}%</div></div>`:''}
  </div>`;
  if(!hasOrders && !hasCommission) html+=`<div class="confirm-msg" style="margin-top:10px">Щоб бачити кількість замовлень і комісію тут, вводьте дохід через «Ввести деталі» при завершенні зміни.</div>`;
  showSheet(html);
}
function carHistoryHtml(c){

  if(!events.length) html+=`<div class="empty">Немає записів за цей період</div>`;
  else events.forEach(ev=>{
    html+=`<div class="row" ${ev.onclick?`onclick="${ev.onclick}" style="cursor:pointer"`:''}>
      <div class="rtitle"><b>${ev.icon} ${esc(ev.title)}</b><div class="sub">${fmtDate(ev.date)}${ev.sub?' · '+esc(ev.sub):''}</div></div>
      ${ev.amount!==null?`<div class="rval tnum neg">${money(ev.amount)}</div>`:''}
      ${ev.onclick?'<span class="chev">›</span>':''}
    </div>`;
  });
  html+=`</div>`;
  return html;

function wishlistItemById(c,id){ return (c.wishlist||[]).find(x=>x.id===id); }
function addWishlistItem(carId){

  c.wishlist=c.wishlist||[];
  c.wishlist.push({ id:uid(), name, price:num($('#wlPrice').value), url:$('#wlUrl').value.trim(), note:$('#wlNote').value.trim(), bought:false, boughtDate:null });

function openWishlistForm(carId,id){

function toggleWishlistBought(carId,id){

/* ============ SHEETS / MODALS ============ */
function showSheet(innerHTML, opts={}){
  const center = !!opts.center;
  const existing=document.getElementById('sheetLayer'); if(existing){ existing.remove(); unlockBodyScroll(); }
  const wrap=document.createElement('div');
  wrap.id='sheetLayer';
  wrap.innerHTML=`
    <div class="overlay ${center?'center':''}" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheethead">
          ${center?'':'<div class="handle"></div>'}
          <button class="close" onclick="closeSheet()">✕</button>
        </div>
        <div class="sheetbody">${innerHTML}</div>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  lockBodyScroll();
  sheetDragInit();
}
function sheetDragInit(){
  const wrap=document.getElementById('sheetLayer'); if(!wrap) return;
  const overlay=wrap.querySelector('.overlay');
  const sheet=wrap.querySelector('.sheet');
  const head=wrap.querySelector('.sheethead');
  if(!overlay || !sheet || !head || overlay.classList.contains('center')) return;
  let startY=0, dy=0, dragging=false;
  const onStart=(e)=>{
    dragging=true; dy=0;
    startY=(e.touches?e.touches[0].clientY:e.clientY);
    sheet.style.transition='none';
  };
  const onMove=(e)=>{
    if(!dragging) return;
    const y=(e.touches?e.touches[0].clientY:e.clientY);
    dy=Math.max(0, y-startY);
    sheet.style.transform=`translateY(${dy}px)`;
    overlay.style.background=`rgba(0,0,0,${Math.max(0, 0.4*(1-dy/280))})`;
  };
  const onEnd=()=>{
    if(!dragging) return;
    dragging=false;
    sheet.style.transition='';
    const sheetH=sheet.offsetHeight||360;
    if(dy > Math.min(150, sheetH*0.32)){
      haptic('swipe');
      sheet.style.transition='transform .18s ease-in';
      sheet.style.transform='translateY(100%)';
      overlay.style.transition='background .18s ease-in';
      overlay.style.background='rgba(0,0,0,0)';
      setTimeout(()=>{ const el=document.getElementById('sheetLayer'); if(el){ el.remove(); } unlockBodyScroll(); }, 180);
    }else{
      sheet.style.transform='';
      overlay.style.background='';
    }
    dy=0;
  };
  head.addEventListener('touchstart', onStart, {passive:true});
  head.addEventListener('touchmove', onMove, {passive:true});
  head.addEventListener('touchend', onEnd);
  head.addEventListener('touchcancel', onEnd);
}
function closeSheet(){
  const el=document.getElementById('sheetLayer'); if(!el) return;
  const overlay=el.querySelector('.overlay');
  unlockBodyScroll();
  if(overlay && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    overlay.classList.add('closing');
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, 190);
  }else{
    el.remove();
  }
}
function alertSheet(title,msg){
  showSheet(`<h3>${esc(title)}</h3><div class="confirm-msg">${esc(msg)}</div><button class="btn ghost" onclick="closeSheet()">Зрозуміло</button>`, {center:true});
}
function confirmAction(opts){
  window.__pendingDelete=opts.onConfirm;
  window.__pendingCancel=opts.onCancel||function(){};
  window.__step2opts=opts;
  const skip = opts.skipStep2 || (DB.settings && DB.settings.doubleConfirm===false);
  const btnClass = opts.danger?'danger':'primary';
  if(skip){
    showSheet(`
      <h3>${esc(opts.title)}</h3>
      <div class="confirm-msg">${esc(opts.msg)}</div>
      <div class="confirm-actions">
        <button class="btn ${btnClass}" onclick="runDelete()">${esc(opts.actionLabel)}</button>
        <button class="btn ghost" onclick="runCancel()">Скасувати</button>
      </div>
    `, {center:true});
    return;
  }
  showSheet(`
    <h3>${esc(opts.title)}</h3>
    <div class="confirm-msg">${esc(opts.msg)}</div>
    <div class="confirm-actions">
      <button class="btn ${btnClass}" onclick="confirmActionStep2()">${esc(opts.actionLabel)}</button>
      <button class="btn ghost" onclick="runCancel()">Скасувати</button>
    </div>
  `, {center:true});
}
function confirmActionStep2(){
  const opts=window.__step2opts||{};
  const btnClass = opts.danger?'danger':'primary';
  showSheet(`
    <h3>${esc(opts.step2Title||'Підтвердження')}</h3>
    <div class="confirm-msg">${esc(opts.step2Msg||'Ви впевнені?')}</div>
    <div class="confirm-actions">
      <button class="btn ${btnClass}" onclick="runDelete()">${esc(opts.step2Label||'Я розумію, підтверджую')}</button>
      <button class="btn ghost" onclick="runCancel()">Скасувати</button>
    </div>
  `, {center:true});
}
function confirmDelete(title, msg, onConfirm, onCancel){
  confirmAction({
    title, msg, actionLabel:'Видалити', danger:true,
    step2Title:'Останнє підтвердження',
    step2Msg:`Цю дію не можна скасувати. ${title.replace('?','')}?`,
    step2Label:'Я розумію, видалити назавжди',
    onConfirm, onCancel
  });
}
function runDelete(){ haptic('delete'); closeSheet(); if(typeof window.__pendingDelete==='function'){ window.__pendingDelete(); window.__pendingDelete=null; } window.__pendingCancel=null; }
function runCancel(){ closeSheet(); if(typeof window.__pendingCancel==='function'){ window.__pendingCancel(); } window.__pendingDelete=null; window.__pendingCancel=null; }

function hexToRgb(hex){
  const h=(hex||'').replace('#','');
  if(h.length!==6) return null;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  if([r,g,b].some(isNaN)) return null;
  return {r,g,b};
}

    const rgb=hexToRgb(c||'#0A84FF');
    if(rgb) document.documentElement.style.setProperty('--accent-glow', `rgba(${rgb.r},${rgb.g},${rgb.b},0.35)`);

function runSearch(){
  const box=$('#searchResults');
  const qEl=$('#searchQ');
  if(!box || !qEl) return;
  const q=qEl.value.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return; }
  const shiftRows=[];
  DB.shifts.forEach(s=>{
    const c=carById(s.carId);
    (s.entries||[]).forEach(en=>{
      const p=platById(en.platformId);
      const hay=[s.date, c?c.name:'', p?p.name:'', String(en.amount||''), String(en.tips||'')].join(' ').toLowerCase();
      if(hay.includes(q)) shiftRows.push({type:'shift', id:s.id, date:s.date, label:(p?p.name:'Без платформи')+(c?' · '+c.name:''), amount:num(en.amount)+num(en.tips)});
    });
  });
  const expRows=[];
  DB.expenses.forEach(e=>{
    const c=carById(e.carId); const cat=catById(e.category);
    const hay=[e.date, cat?cat.name:'', c?c.name:'', String(e.amount||''), e.note||''].join(' ').toLowerCase();
    if(hay.includes(q)) expRows.push({type:'expense', id:e.id, date:e.date, label:(cat?cat.name:'')+(e.note?' · '+e.note:''), amount:num(e.amount)});
  });
  const all=[...shiftRows, ...expRows].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);

function renderSettingsReminders(){
  const rrow=r=>`<div class="row" onclick="openReminderForm('${r.id}')" style="cursor:pointer"><div class="rtitle"><b style="${r.done?'text-decoration:line-through;opacity:0.5':''}">${esc(r.text)}</b>${r.date?`<div class="sub">${dueBadge(daysUntil(r.date))}</div>`:''}</div><span class="chev">›</span></div>`;
  const active=DB.reminders.filter(r=>!r.done);
  const done=DB.reminders.filter(r=>r.done);
  const overdue=active.filter(r=>r.date && daysUntil(r.date)<0).sort((a,b)=>a.date.localeCompare(b.date));
  const soon=active.filter(r=>r.date && daysUntil(r.date)>=0 && daysUntil(r.date)<=3).sort((a,b)=>a.date.localeCompare(b.date));
  const later=active.filter(r=>r.date && daysUntil(r.date)>3).sort((a,b)=>a.date.localeCompare(b.date));
  const noDate=active.filter(r=>!r.date);
  const groups=[
    ['Прострочені', overdue], ['Найближчі (до 3 дн.)', soon], ['Пізніше', later], ['Без дати', noDate], ['Виконані', done]
  ].filter(g=>g[1].length);
  const body=`
    <div class="section-label">Особисті нагадування <button type="button" class="infob" onclick="alertSheet('Особисті нагадування','Прості нагадування собі — не про авто, а будь-що: подзвонити, оплатити, забрати. Показуються на дашборді, коли термін підходить або минув. Групуються за терміновістю.')">i</button></div>
    ${groups.length ? groups.map(([label,list])=>`<div class="section-label" style="margin-top:16px">${esc(label)}</div><div class="group">${list.map(rrow).join('')}</div>`).join('') : `<div class="group"><div class="empty">Ще немає нагадувань</div></div>`}
    <div class="group" style="margin-top:16px"><div class="row" onclick="openReminderForm()" style="cursor:pointer"><span style="color:var(--blue);font-weight:600">+ Додати нагадування</span></div></div>
  `;
  settingsPage('Особисті нагадування', body);
}

function saveNote(id){
  const text=$('#ntText').value.trim();

  DB.notes=DB.notes||[];
  if(id){ const n=noteById(id); if(n) Object.assign(n, data); }
  else DB.notes.push({ id:uid(), createdAt:Date.now(), ...data });
  save(); closeSheet(); openSettings('notes');
}

function copyCode(text, el){
  const label = el ? el.textContent : '';
  const done=()=>{ if(el){ el.textContent='✓ Скопійовано'; setTimeout(()=>{ if(el) el.textContent=label; },1400); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ alertSheet('Код для копіювання', text); });
  }else{
    alertSheet('Код для копіювання', text);
  }
}

  if(/Android/.test(ua)) return 'android';

}

/* ============ EXPORT ============ */
function buildExportExcel(){
  const shifts=[...DB.shifts].sort((a,b)=>a.date.localeCompare(b.date));
  const expenses=[...DB.expenses].sort((a,b)=>a.date.localeCompare(b.date));
  let lines=[];
  lines.push('ЗМІНИ');
  lines.push(['Дата','Авто','Платформа','Сума','Чайові'].join('\t'));
  shifts.forEach(s=>{ const c=carById(s.carId); (s.entries||[]).forEach(e=>{ const p=platById(e.platformId); lines.push([s.date, c?c.name:'', p?p.name:'Без платформи', num(e.amount), num(e.tips)].join('\t')); }); });
  lines.push(''); lines.push('ВИТРАТИ');
  lines.push(['Дата','Категорія','Авто','Сума','Тип'].join('\t'));
  expenses.forEach(e=>{ const c=carById(e.carId); const cat=catById(e.category); lines.push([e.date, cat.name, c?c.name:'', num(e.amount), e.work?'робоча':'особиста'].join('\t')); });
  return lines.join('\n');
}
function buildExportTelegram(){
  const shifts=[...DB.shifts].sort((a,b)=>a.date.localeCompare(b.date));
  const expenses=[...DB.expenses].sort((a,b)=>a.date.localeCompare(b.date));
  const incTotal=shifts.reduce((a,s)=>a+(s.entries||[]).reduce((x,e)=>x+num(e.amount)+num(e.tips),0),0);
  const expTotal=expenses.reduce((a,e)=>a+num(e.amount),0);
  let out=`📊 Звіт «Водій»\n\n💰 Дохід: ${money(incTotal)}\n💸 Витрати: ${money(expTotal)}\n📈 Чистими: ${money(incTotal-expTotal)}\n\n`;
  out+=`ЗМІНИ (${shifts.length}):\n`;
  shifts.forEach(s=>{ const c=carById(s.carId); const total=(s.entries||[]).reduce((x,e)=>x+num(e.amount)+num(e.tips),0); out+=`• ${fmtDate(s.date)} — ${c?c.name:'?'} — ${money(total)}\n`; });
  out+=`\nВИТРАТИ (${expenses.length}):\n`;
  expenses.forEach(e=>{ const cat=catById(e.category); out+=`• ${fmtDate(e.date)} — ${cat.name} — ${money(e.amount)}\n`; });
  return out;
}

function csvEscape(v){ v=String(v??''); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function buildShiftsCsv(list){
  const rows=[['Дата','Авто','Платформа','Сума','Чайові','Години','Км','Нотатка']];
  [...list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    const c=carById(s.carId);
    if((s.entries||[]).length){
      s.entries.forEach(e=>{ const p=platById(e.platformId); rows.push([s.date, c?c.name:'', p?p.name:'Без платформи', num(e.amount), num(e.tips), s.hours||'', s.km||'', s.note||'']); });
    }else{
      rows.push([s.date, c?c.name:'', '', 0, 0, s.hours||'', s.km||'', s.note||'']);
    }
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function buildExpensesCsv(list){
  const rows=[['Дата','Категорія','Авто','Сума','Тип','Оплата','Нотатка']];
  [...list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const c=carById(e.carId); const cat=catById(e.category);
    rows.push([e.date, cat.name, c?c.name:'', num(e.amount), e.work?'робоча':'особиста', e.payment==='cash'?'готівка':'картка', e.note||'']);
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function downloadCsv(text, filename){
  try{
    const blob=new Blob(['﻿'+text], {type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ alertSheet('Не вдалося завантажити файл','Спробуйте інший спосіб експорту — наприклад «Експорт для бухгалтера».'); }
}
function openCsvExportSheet(){
  const periods=[['month','Місяць'],['year','Рік'],['all','Весь час']];
  let csvPeriod='month';
  const inRange=(ds)=>{
    if(csvPeriod==='month') return ds.slice(0,7)===today().slice(0,7);
    if(csvPeriod==='year') return ds.slice(0,4)===today().slice(0,4);
    return true;
  };
  function bodyHtml(){
    const shifts=DB.shifts.filter(s=>inRange(s.date));
    const expenses=DB.expenses.filter(e=>inRange(e.date));
    return `<div class="seg" style="margin-bottom:12px">${periods.map(p=>`<button class="${csvPeriod===p[0]?'on':''}" onclick="csvSetPeriod('${p[0]}')">${p[1]}</button>`).join('')}</div>
    <div class="confirm-msg">Два окремі файли — відкриються в Excel, Google Таблицях чи Numbers.</div>
    <button class="btn primary" style="margin-bottom:8px" onclick="csvDownloadShifts()">⬇️ Зміни.csv (${shifts.length})</button>
    <button class="btn ghost" onclick="csvDownloadExpenses()">⬇️ Витрати.csv (${expenses.length})</button>`;

  showSheet(`<h3>Експорт у CSV</h3><div id="csvWrap">${bodyHtml()}</div>`);
  window.csvSetPeriod=(p)=>{ csvPeriod=p; $('#csvWrap').innerHTML=bodyHtml(); };
  window.csvDownloadShifts=()=>{ downloadCsv(buildShiftsCsv(DB.shifts.filter(s=>inRange(s.date))), 'vodiy-zminy-'+today()+'.csv'); };
  window.csvDownloadExpenses=()=>{ downloadCsv(buildExpensesCsv(DB.expenses.filter(e=>inRange(e.date))), 'vodiy-vytraty-'+today()+'.csv'); };

function buildPdfReportHtml(fromDate, toDate, label){
  const shifts=DB.shifts.filter(s=>s.date>=fromDate && s.date<=toDate).sort((a,b)=>a.date.localeCompare(b.date));
  const expenses=DB.expenses.filter(e=>e.date>=fromDate && e.date<=toDate).sort((a,b)=>a.date.localeCompare(b.date));
  const fuel=DB.fuel.filter(f=>f.date>=fromDate && f.date<=toDate);
  const income=shifts.reduce((a,s)=>a+shiftIncome(s),0);
  const expTotal=expenses.reduce((a,e)=>a+num(e.amount),0);
  const profit=income-expTotal;
  const hours=shifts.reduce((a,s)=>a+num(s.hours),0);
  const km=shifts.reduce((a,s)=>a+num(s.km),0);
  const byCat={}; expenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byPlat={}; shifts.forEach(s=>{ (s.entries||[]).forEach(e=>{ byPlat[e.platformId]=(byPlat[e.platformId]||0)+num(e.amount)+num(e.tips); }); });
  const platRows=Object.entries(byPlat).sort((a,b)=>b[1]-a[1]);
  const allCars=[...activeCars(), ...archivedCars()];
  const byCar={};
  allCars.forEach(c=>{ byCar[c.id]={inc:0,exp:0,km:0}; });
  shifts.forEach(s=>{ if(byCar[s.carId]){ byCar[s.carId].inc+=shiftIncome(s); byCar[s.carId].km+=num(s.km); } });
  expenses.forEach(e=>{ if(e.carId && byCar[e.carId]) byCar[e.carId].exp+=num(e.amount); });
  const carRows=Object.entries(byCar).filter(([,v])=>v.inc>0||v.exp>0||v.km>0);
  const days=Math.max(1, Math.round((new Date(toDate)-new Date(fromDate))/86400000)+1);
  const fop=DB.profile.fop||'none';
  let taxAmount=0, taxLabel='';
  if(fop==='group2'){ taxAmount=num(DB.profile.taxGroup2Fixed)/30*days; taxLabel='Фіксований податок, 2 група · '+money(num(DB.profile.taxGroup2Fixed))+'/міс'; }
  else if(fop==='group3'){ const rate=num(DB.profile.taxGroup3Rate)||5; taxAmount=income*rate/100; taxLabel='Єдиний податок, 3 група · '+rate+'% від доходу'; }
  const esvAmount = fop!=='none' ? num(DB.profile.esvMonthly)/30*days : 0;

  let html=`<div class="preport">
    <h1>Звіт «Водій»</h1>
    <div class="psub">${esc(label)} · ${fmtDate(fromDate)} — ${fmtDate(toDate)} · сформовано ${fmtDate(today())}${DB.profile.name?' · '+esc(DB.profile.name):''}</div>
    <div class="ptotals">
      <div class="ptile"><div class="l">Дохід</div><div class="v">${money(income)}</div></div>
      <div class="ptile"><div class="l">Витрати</div><div class="v">${money(expTotal)}</div></div>
      <div class="ptile"><div class="l">Чистими</div><div class="v">${money(profit)}</div></div>
    </div>
    <div class="ptotals">
      <div class="ptile"><div class="l">Змін</div><div class="v">${shifts.length}</div></div>
      <div class="ptile"><div class="l">Годин</div><div class="v">${Math.round(hours)}</div></div>
      <div class="ptile"><div class="l">Пробіг</div><div class="v">${Math.round(km)} км</div></div>
      <div class="ptile"><div class="l">₴ / год</div><div class="v">${hours?money(profit/hours):'—'}</div></div>
    </div>`;
  if(fop!=='none'){
    html+=`<h2>Орієнтовні податки за період</h2><table><tr><th></th><th>Сума</th></tr>
      <tr><td>${esc(taxLabel)}</td><td>${money(taxAmount)}</td></tr>
      ${esvAmount>0?`<tr><td>ЄСВ (${num(DB.profile.esvMonthly)}/міс, пропорційно)</td><td>${money(esvAmount)}</td></tr>`:''}
      <tr><td><b>Разом до сплати</b></td><td><b>${money(taxAmount+esvAmount)}</b></td></tr>
    </table><div class="psub">Орієнтовний розрахунок для планування, звіряйте з податковою чи бухгалтером.</div>`;
  }
  if(platRows.length){
    html+=`<h2>Дохід по платформах</h2><table><tr><th>Платформа</th><th>Сума</th></tr>${platRows.map(([pid,v])=>`<tr><td>${esc(platById(pid)?platById(pid).name:'Без платформи')}</td><td>${money(v)}</td></tr>`).join('')}</table>`;
  }
  if(carRows.length>1){
    html+=`<h2>По авто</h2><table><tr><th>Авто</th><th>Дохід</th><th>Витрати</th><th>Чистими</th><th>Пробіг</th></tr>${carRows.map(([cid,v])=>{ const c=carById(cid); return `<tr><td>${esc(c?c.name:'')}</td><td>${money(v.inc)}</td><td>${money(v.exp)}</td><td>${money(v.inc-v.exp)}</td><td>${Math.round(v.km)} км</td></tr>`; }).join('')}</table>`;
  }
  if(catRows.length){
    html+=`<h2>Витрати по категоріях</h2><table><tr><th>Категорія</th><th>Сума</th></tr>${catRows.map(([cid,v])=>`<tr><td>${esc(catById(cid).name)}</td><td>${money(v)}</td></tr>`).join('')}</table>`;
  }
  if(fuel.length){

  html+=`</div>`;

function loadPdfLibs(){
  if(window.jspdf && window.html2canvas) return Promise.resolve();
  if(window.__pdfLibsPromise) return window.__pdfLibsPromise;
  const loadScript=(src)=>new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load-fail'));
    document.head.appendChild(s);
  });
  window.__pdfLibsPromise = loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
    .then(()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
  return window.__pdfLibsPromise;
}
// Малює звіт у прихований блок, знімає "скріншот" через html2canvas і клеїть його
// сторінками у справжній PDF-файл — надійніше за window.print(), який на iOS не
// працює у встановленому (standalone) застосунку на головному екрані.
async function buildReportPdfBlob(fromDate, toDate, label){
  await loadPdfLibs();
  const area=$('#printArea');
  area.innerHTML=`<div id="pdfCaptureRoot" style="width:760px;background:#fff;padding:26px">${buildPdfReportHtml(fromDate, toDate, label)}</div>`;
  area.style.display='block'; area.style.position='fixed'; area.style.left='-9999px'; area.style.top='0'; area.style.zIndex='-1';
  await new Promise(r=>setTimeout(r,80));
  const target=$('#pdfCaptureRoot');
  const canvas=await html2canvas(target, {scale:2, backgroundColor:'#ffffff'});
  area.style.display=''; area.style.position=''; area.style.left=''; area.style.top=''; area.style.zIndex='';
  area.innerHTML='';
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({unit:'pt', format:'a4'});
  const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
  const imgW=pageW, imgH=canvas.height*(imgW/canvas.width);
  const imgData=canvas.toDataURL('image/jpeg', 0.92);
  let heightLeft=imgH, y=0;
  pdf.addImage(imgData, 'JPEG', 0, y, imgW, imgH);
  heightLeft-=pageH;
  while(heightLeft>0){
    y=heightLeft-imgH;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, y, imgW, imgH);
    heightLeft-=pageH;
  }
  return pdf.output('blob');
}

function scheduleUpdateChecks(){
  if(updateCheckTimerId) clearInterval(updateCheckTimerId);
  updateCheckTimerId=setInterval(()=>{
    const minutes=Math.max(15, num(DB.settings.updateCheckMinutes)||60);
    if(Date.now()-getLastUpdateCheck() >= minutes*60000) checkForUpdate(false);
  }, 60000);
  // catch up immediately if the configured interval already elapsed since last check (e.g. app reopened later)
  const minutes=Math.max(15, num(DB.settings.updateCheckMinutes)||60);
  if(Date.now()-getLastUpdateCheck() >= minutes*60000) checkForUpdate(false);

/* ===== Google Drive sync (backup to the user's own Google account) ===== */
// One shared OAuth Client ID for the whole app (not a secret — safe to embed).
// Each user signs in to their OWN Google account through it; the backup goes only
// to that user's own hidden appDataFolder, never through the developer.
const GDRIVE_CLIENT_ID='194714840278-n7imdnf3e9bd0knr8hubq170q5t9unsk.apps.googleusercontent.com';
const GDRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
const GDRIVE_FILE_NAME='vodiy-backup.json';
let gdriveAccessToken=null, gdriveTokenExpiry=0, gdriveTokenClient=null, gsiLoadPromise=null, gdriveAccountEmail=null;
function loadGSI(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gsiLoadPromise) return gsiLoadPromise;
  gsiLoadPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.async=true; s.defer=true;
    s.onload=()=>resolve();
    s.onerror=()=>{ gsiLoadPromise=null; reject(new Error('gsi-load-failed')); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(!(window.google&&google.accounts&&google.accounts.oauth2)){ gsiLoadPromise=null; reject(new Error('gsi-timeout')); } }, 8000);
  });
  return gsiLoadPromise;
}
function gdriveHasToken(){ return !!gdriveAccessToken && Date.now()<gdriveTokenExpiry-5000; }
function gdriveSignOut(){
  gdriveAccessToken=null; gdriveTokenExpiry=0; gdriveAccountEmail=null;
}
function gdriveEnsureToken(cb, errCb, forceChooser){
  if(gdriveHasToken() && !forceChooser){ cb(gdriveAccessToken); return; }
  const clientId=GDRIVE_CLIENT_ID;
  loadGSI().then(()=>{
    try{
      gdriveTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GDRIVE_SCOPE,
        callback:(resp)=>{
          if(resp && resp.access_token){
            gdriveAccessToken=resp.access_token;
            gdriveTokenExpiry=Date.now()+((resp.expires_in||3600)*1000);
            gdriveFetchEmail(resp.access_token).then(()=>cb(gdriveAccessToken)).catch(()=>cb(gdriveAccessToken));
          }else{ errCb('no-token'); }
        },
        error_callback:(err)=>{ errCb((err&&err.type)||'auth-error'); }
      });
      // Завжди показуємо вибір акаунта (не тихий вхід) — щоб не переплутати акаунти,
      // коли на пристрої авторизовано кілька Google-акаунтів одночасно.
      gdriveTokenClient.requestAccessToken({prompt:'select_account'});
    }catch(e){ errCb('init-error'); }
  }).catch(()=>errCb('script-blocked'));
}
function gdriveFetchEmail(token){
  return fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{Authorization:'Bearer '+token} })
    .then(r=>r.ok?r.json():null)
    .then(d=>{ gdriveAccountEmail=(d&&d.email)||null; });
}
function gdriveApi(path, token, opts){
  opts=opts||{};
  return fetch('https://www.googleapis.com'+path, Object.assign({}, opts, {
    headers:Object.assign({Authorization:'Bearer '+token}, opts.headers||{})
  })).then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('http-'+r.status+':'+t.slice(0,200)); }); return r; });
}
function gdriveFindFileId(token){
  const q=encodeURIComponent(`name='${GDRIVE_FILE_NAME}' and trashed=false`);
  return gdriveApi(`/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`, token)
    .then(r=>r.json())
    .then(d=>(d.files&&d.files[0])?d.files[0]:null);
}
function gdriveUpload(token, fileId){
  const metadata={ name:GDRIVE_FILE_NAME, mimeType:'application/json' };
  if(!fileId) metadata.parents=['appDataFolder'];
  const boundary='vodiyBound'+Date.now();
  const body=
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${buildBackupJson()}\r\n`+
    `--${boundary}--`;
  const url = fileId ? `/upload/drive/v3/files/${fileId}?uploadType=multipart` : `/upload/drive/v3/files?uploadType=multipart`;
  return gdriveApi(url, token, { method:fileId?'PATCH':'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body });
}
function gdriveDownload(token, fileId){
  return gdriveApi(`/drive/v3/files/${fileId}?alt=media`, token).then(r=>r.text());
}
function gdriveSyncNow(silent, forceChooser){
  gdriveEnsureToken(token=>{
    gdriveFindFileId(token).then(f=>gdriveUpload(token, f&&f.id)).then(()=>{
      DB.settings.gdriveLastSyncAt=Date.now();
      DB.settings.gdriveLastSyncEmail=gdriveAccountEmail||'';
      markBackupDone();
      if(TAB==='profile') renderProfile();
      if(!silent){ alertSheet('Синхронізовано ☁️','Резервну копію збережено у службовій папці Google Диску'+(gdriveAccountEmail?' акаунту '+esc(gdriveAccountEmail):'')+'.'); }
    }).catch(err=>{ if(!silent) gdriveErrorSheet(err); });
  }, err=>{ if(!silent) gdriveAuthErrorSheet(err); }, forceChooser);
}
// Кожен запис (зміна, витрата, авто, контакт, нагадування, нотатка) має свій унікальний id
// (uid() кодує час створення), тож дані з телефону й Диску можна об'єднувати без дублів —
// просто за набором id, а не переписувати одне поверх іншого наосліп.
const GDRIVE_MERGE_KEYS=[['cars','авто'],['shifts','змін'],['expenses','витрат'],['contacts','контактів'],['reminders','нагадувань'],['notes','нотаток']];
function diffDBCounts(localDB, remoteDB){
  return GDRIVE_MERGE_KEYS.map(([key,label])=>{
    const localIds=new Set((localDB[key]||[]).filter(x=>x&&x.id).map(x=>x.id));
    const remoteIds=new Set((remoteDB[key]||[]).filter(x=>x&&x.id).map(x=>x.id));
    let onlyLocal=0, common=0;
    localIds.forEach(id=>{ if(remoteIds.has(id)) common++; else onlyLocal++; });
    let onlyRemote=0;
    remoteIds.forEach(id=>{ if(!localIds.has(id)) onlyRemote++; });
    return {key, label, onlyLocal, onlyRemote, common};
  });
}
function mergeDBs(localDB, remoteDB){
  const merged=JSON.parse(JSON.stringify(localDB));
  GDRIVE_MERGE_KEYS.forEach(([key])=>{
    const localArr=merged[key]||(merged[key]=[]);
    const remoteArr=remoteDB[key]||[];
    const ids=new Set(localArr.filter(x=>x&&x.id).map(x=>x.id));
    remoteArr.forEach(item=>{
      if(item && item.id && !ids.has(item.id)){ localArr.push(item); ids.add(item.id); }
    });
  });
  return merged;
}

  if(mode==='local'){
    confirmAction({
      title:'Перезаписати копію на Диску?',
      msg:'На Google Диску буде замінено збережену копію поточними даними з телефону. Те, що є лише на Диску, буде втрачено.',

  let remoteDB=null;
  try{ remoteDB=JSON.parse(gdrivePendingRemoteText); }catch(e){}
  if(!remoteDB){ alertSheet('Помилка','Копію з Диску втрачено, спробуйте ще раз.'); return; }
  if(mode==='remote'){
    confirmAction({
      title:'Замінити дані на телефоні?',

function wizAddCar(){ WIZ.cars.push({name:'Авто '+(WIZ.cars.length+1), fuelType:'petrol'}); renderWizard(); }
function wizRmCar(i){ WIZ.cars.splice(i,1); renderWizard(); }
function wizFinish(){
  DB.profile={ workType:WIZ.workType, fop:WIZ.fop, taxGroup2Fixed:0, taxGroup3Rate:5, esvMonthly:0 };
  const chosen = PLATFORM_MASTER.filter(p=>WIZ.platformIds.includes(p.id));
  const existingCustom = DB.platforms.filter(p=>!PLATFORM_MASTER.some(m=>m.id===p.id));
  DB.platforms = [...chosen.map(p=>({...p})), ...existingCustom];
  const existingCarsById = {}; DB.cars.forEach(c=>existingCarsById[c.name]=c);
  DB.cars = WIZ.cars.map(wc=>{
    const match=DB.cars.find(c=>c.name===wc.name);
    return match ? {...match, fuelType:wc.fuelType} : { id:uid(), name:wc.name||'Авто', fuelType:wc.fuelType, odo:0, notes:'', service:[] };
  });
  DB.onboardingDone=true;
  save();
  $('#modalRoot').innerHTML='';
  setTab('dash');
  openInstallGuide();
}

/* ============ INIT ============ */
function renderOfflinebar(){
  const el=$('#offlinebar'); if(!el) return;
  const online = typeof navigator==='undefined' || navigator.onLine!==false;
  if(online){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=`${icon('info',14)} Немає інтернету — усі дані й далі зберігаються на цьому пристрої`;
}
let offlineDebounceT=null;
function offlineInit(){
  try{
    const debounced=()=>{ clearTimeout(offlineDebounceT); offlineDebounceT=setTimeout(renderOfflinebar, 1000); };
    window.addEventListener('online', debounced);
    window.addEventListener('offline', debounced);
  }catch(e){}
  renderOfflinebar();
}
function storageInfoLabel(){
  try{
    const raw=localStorage.getItem(DB_KEY)||'';
    const bytes=new Blob([raw]).size;
    const kb=bytes/1024;
    return kb<1024 ? Math.round(kb)+' КБ' : (kb/1024).toFixed(1)+' МБ';
  }catch(e){ return '—'; }
}
function init(){
  applyTheme(getTheme());
  applyAccent();
  applyTextScale();
  renderDemobar();
  offlineInit();
  setTab(TAB);
  swipeInit();
  dashSwipeInit();
  ptrInit();
  edgeBackInit();
  fabInit();
  modalRootLockInit();
  scheduleUpdateChecks();
  if(!DB.onboardingDone && !isDemo()) startWizard();
}
init();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
