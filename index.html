<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Водій</title>
<meta name="description" content="Облік прибутку, витрат і авто для водіїв таксі та кур'єрів.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Водій">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

:root{
  --bg:#F2F2F7; --bg-elev:#FFFFFF; --bg-grouped:#FFFFFF;
  --tx:#0C0C0E; --tx2:#6C6C70; --tx3:#AEAEB2;
  --sep:rgba(60,60,67,0.29); --sep-op:rgba(60,60,67,0.12);
  --blue:#007AFF; --green:#2FAE60; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE; --teal:#30B0C7;
  --fill:rgba(120,120,128,0.12); --fill2:rgba(120,120,128,0.08);
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  --bar-bg:rgba(255,255,255,0.72);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-elev:#1C1C1E; --bg-grouped:#1C1C1E;
    --tx:#F5F5F7; --tx2:#98989D; --tx3:#636366;
    --sep:rgba(84,84,88,0.6); --sep-op:rgba(84,84,88,0.32);
    --blue:#0A84FF; --green:#32D74B; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
    --fill:rgba(120,120,128,0.24); --fill2:rgba(120,120,128,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --bar-bg:rgba(28,28,30,0.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --bg-grouped:#1C1C1E;
  --tx:#F5F5F7; --tx2:#98989D; --tx3:#636366;
  --sep:rgba(84,84,88,0.6); --sep-op:rgba(84,84,88,0.32);
  --blue:#0A84FF; --green:#32D74B; --red:#FF453A; --orange:#FF9F0A; --purple:#BF5AF2; --teal:#40C8E0;
  --fill:rgba(120,120,128,0.24); --fill2:rgba(120,120,128,0.16);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  --bar-bg:rgba(28,28,30,0.72);
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.35; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance}

/* ===== App shell ===== */
#app{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px)); min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bar-bg); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--sep);
  padding:10px 18px 12px;
}
.topbar-row{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.topbar .eyebrow{font-size:12px; font-weight:600; color:var(--tx2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:1px}
.topbar h1{font-size:30px; font-weight:800; letter-spacing:-0.02em}
main{max-width:600px; margin:0 auto; padding:14px 16px 130px}
.demobar{background:var(--orange); color:#1a1200; font-size:12.5px; font-weight:700; text-align:center; padding:7px 10px; display:flex; align-items:center; justify-content:center; gap:8px}
.demobar button{background:rgba(0,0,0,0.18); border:0; color:inherit; font-weight:700; font-size:12px; padding:3px 9px; border-radius:20px}

/* ===== Tab bar ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; background:var(--bar-bg);
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:0.5px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar button{
  flex:1; background:none; border:0; padding:8px 2px 6px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--tx3); font-size:10.5px; font-weight:600;
}
.tabbar button svg{width:25px; height:25px; stroke:var(--tx3); fill:none; stroke-width:1.7}
.tabbar button.on{color:var(--blue)}
.tabbar button.on svg{stroke:var(--blue)}

/* ===== Segmented control ===== */
.seg{display:flex; background:var(--fill); border-radius:9px; padding:2px; gap:2px}
.seg button{flex:1; border:0; background:none; padding:6px 4px; border-radius:7px; color:var(--tx); font-size:12.5px; font-weight:600; white-space:nowrap}
.seg button.on{background:var(--bg-elev); box-shadow:var(--shadow)}
.segscroll{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:1px}
.segscroll::-webkit-scrollbar{display:none}
.segscroll button{flex:0 0 auto; border:0; background:var(--fill); padding:8px 13px; border-radius:9px; color:var(--tx); font-size:12.5px; font-weight:600; white-space:nowrap}
.segscroll button.on{background:var(--bg-elev); box-shadow:var(--shadow)}

/* ===== Grouped list / cards ===== */
.section-label{font-size:12.5px; font-weight:600; color:var(--tx2); text-transform:uppercase; letter-spacing:0.03em; margin:20px 4px 6px; display:flex; align-items:center; justify-content:space-between}
.section-label:first-child{margin-top:2px}
.group{background:var(--bg-grouped); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.row{display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:0.5px solid var(--sep-op)}
.row:first-child{border-top:0}
.row .rtitle{flex:1; min-width:0}
.row .rtitle b{font-weight:600; display:block; font-size:15px}
.row .rtitle .sub{color:var(--tx2); font-size:12.5px; margin-top:1px}
.row .rval{font-weight:600; text-align:right; white-space:nowrap}
.chev{color:var(--tx3); font-size:18px; line-height:1; flex-shrink:0}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.dot.g{background:var(--green)} .dot.y{background:var(--orange)} .dot.r{background:var(--red)}
.infob{width:19px; height:19px; border-radius:50%; border:0; background:var(--fill); color:var(--tx2); font-size:11.5px; font-weight:700; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center}

/* ===== Swipe-to-delete rows ===== */
.swiperow{position:relative; overflow:hidden; border-top:0.5px solid var(--sep-op)}
.swiperow:first-child{border-top:0}
.swiperow .swipecontent{border-top:0; position:relative; z-index:1; background:var(--bg-grouped); transition:transform .18s ease}
.swiperow.swopen .swipecontent{transform:translateX(-84px)}
.swiperow.swdragging .swipecontent{transition:none}
.swipedel{position:absolute; top:0; right:0; bottom:0; width:84px; border:0; background:var(--red); color:#fff; font-size:13px; font-weight:600; z-index:0}

/* ===== Big stat card ===== */
.hero{background:#14161A; color:#fff; border-radius:18px; padding:18px 18px 16px; box-shadow:var(--shadow); margin-bottom:12px}
.hero .lbl{color:rgba(255,255,255,0.6); font-size:13px; font-weight:600}
.hero .big{font-size:36px; font-weight:800; letter-spacing:-0.02em; margin-top:2px; color:#fff}
.hero .sub{color:rgba(255,255,255,0.6); font-size:13px; margin-top:4px}
.hero.light{background:var(--bg-grouped); color:var(--tx)}
.hero.light .lbl,.hero.light .sub{color:var(--tx2)}
.hero.light .big{color:var(--tx)}
.pos{color:var(--green)} .neg{color:var(--red)}
.hero .big.pos{color:#5FE08A} .hero .big.neg{color:#FF7B70}

.tilegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.tile{background:var(--bg-grouped); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}
.tile .lbl{color:var(--tx2); font-size:12px; font-weight:600}
.tile .v{font-size:19px; font-weight:700; margin-top:2px}

/* ===== Bars breakdown ===== */
.barrow{padding:9px 14px}
.barrow .bhead{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px}
.barrow .bhead b{font-weight:600}
.barrow .btrack{height:7px; border-radius:4px; background:var(--fill); overflow:hidden}
.barrow .bfill{height:100%; border-radius:4px}

/* ===== Forms ===== */
.field{margin-bottom:12px}
.field label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--tx2); margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:0.5px solid var(--sep); background:var(--fill2); color:var(--tx);
}
.field textarea{resize:vertical; min-height:56px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.platrow{display:grid; grid-template-columns:1fr 90px 26px; gap:8px; align-items:center; margin-bottom:8px}
.iconbtn{width:26px; height:26px; border-radius:50%; border:0; background:var(--fill); color:var(--tx2); font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.chipwrap{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--sep); background:var(--fill2); color:var(--tx); padding:8px 13px; border-radius:20px; font-size:13.5px; font-weight:600}
.chip.on{background:var(--blue); border-color:var(--blue); color:#fff}
.codechip{display:inline-flex; align-items:center; gap:5px; border:1px dashed var(--sep); background:var(--fill2); color:var(--tx); padding:5px 9px; border-radius:9px; font-size:12.5px; font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:0.02em; cursor:pointer; white-space:nowrap}
.ctabtn{display:inline-block; background:var(--blue); color:#fff!important; font-weight:700; font-size:13px; padding:8px 14px; border-radius:20px; white-space:nowrap; text-decoration:none}
.ctacard{border-top:0.5px solid var(--sep-op); padding:12px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.ctacard:first-child{border-top:0}
.ctacard .rtitle{flex:1; min-width:140px}

.btn{display:block; width:100%; text-align:center; padding:13px; border-radius:13px; border:0; font-weight:600; font-size:15.5px}
.btn.primary{background:var(--blue); color:#fff}
.btn.ghost{background:var(--fill); color:var(--tx)}
.btn.danger{background:var(--red); color:#fff}
.btn.green{background:var(--green); color:#fff}
.btn.orange{background:var(--orange); color:#1a1200}
.btn.add{background:none; color:var(--blue); font-weight:600; padding:8px 0; text-align:left; width:auto}
.btnrow{display:flex; gap:8px}
.btnrow .btn{flex:1}

.fab{
  position:fixed; right:18px; bottom:calc(90px + env(safe-area-inset-bottom,0px)); z-index:25;
  width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff; border:0;
  font-size:28px; font-weight:400; box-shadow:0 6px 18px rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:center;
}
.fab[hidden]{display:none!important}

#printArea{display:none}
.preport{font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#111; max-width:720px; margin:0 auto}
.preport h1{font-size:22px; margin:0 0 2px}
.preport .psub{color:#555; font-size:13px; margin-bottom:18px}
.preport table{width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12.5px}
.preport th,.preport td{text-align:left; padding:6px 8px; border-bottom:1px solid #ddd}
.preport th{background:#f2f2f2; font-weight:700}
.preport .ptotals{display:flex; gap:16px; margin-bottom:20px}
.preport .ptile{flex:1; border:1px solid #ddd; border-radius:8px; padding:10px 12px}
.preport .ptile .l{font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.02em}
.preport .ptile .v{font-size:18px; font-weight:700; margin-top:2px}
.preport h2{font-size:14px; margin:18px 0 8px}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block; position:absolute; left:0; top:0; width:100%}
}

/* ===== Sheet / modal ===== */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:70; display:flex; align-items:flex-end; justify-content:center}
.overlay.center{align-items:center; padding:24px}
.sheet{
  width:100%; max-width:600px; background:var(--bg-elev); border-radius:20px 20px 0 0;
  max-height:88vh; overflow-y:auto; padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));
  animation:up .22s ease-out;
}
.overlay.center .sheet{border-radius:18px; max-width:340px; padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px)); text-align:center}
@keyframes up{from{transform:translateY(24px); opacity:0.6} to{transform:translateY(0); opacity:1}}
.sheet .handle{width:36px; height:5px; background:var(--fill); border-radius:3px; margin:2px auto 12px}
.sheet h3{font-size:18px; font-weight:700; margin-bottom:2px}
.sheet .close{position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%; background:var(--fill); border:0; color:var(--tx2); font-size:15px}
.confirm-msg{color:var(--tx2); font-size:14px; margin:8px 0 18px; line-height:1.4; white-space:pre-line}
.confirm-actions{display:flex; flex-direction:column; gap:8px}
.empty{padding:26px 14px; text-align:center; color:var(--tx2); font-size:13.5px}

/* ===== Full-screen window (settings / onboarding / car detail) ===== */
.fullscreen{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch}
.fstop{
  position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:var(--bar-bg); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--sep);
}
.fstop h2{font-size:17px; font-weight:700}
.fstop .fsbtn{background:none; border:0; color:var(--blue); font-size:15.5px; font-weight:600; padding:6px 2px; min-width:56px}
.fstop .fsbtn.right{text-align:right}
.fsbody{max-width:600px; margin:0 auto; padding:14px 16px calc(30px + env(safe-area-inset-bottom,0px))}

/* ===== Header ===== */
.gearbtn{
  width:34px; height:34px; border-radius:50%; border:0; background:var(--fill); color:var(--tx2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-bottom:2px;
}
.gearbtn svg{width:18px; height:18px; stroke:var(--tx2); fill:none; stroke-width:1.8}

/* ===== Onboarding wizard ===== */
.wiz{min-height:100%; display:flex; flex-direction:column}
.wizhead{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 6px}
.wizdots{display:flex; gap:6px; margin-bottom:16px}
.wizdots span{height:4px; flex:1; border-radius:2px; background:var(--fill)}
.wizdots span.on{background:var(--blue)}
.wizbody{flex:1; padding:4px 22px; max-width:460px; margin:0 auto; width:100%}
.wizbody h1{font-size:26px; font-weight:800; letter-spacing:-0.02em; margin-bottom:8px}
.wizbody p.d{color:var(--tx2); font-size:14.5px; line-height:1.5; margin-bottom:20px}
.wizfoot{padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px)); max-width:460px; margin:0 auto; width:100%}
.mark{width:60px; height:60px; border-radius:16px; background:var(--blue); display:flex; align-items:center; justify-content:center; margin-bottom:16px; box-shadow:var(--shadow)}
.caravatar{width:44px; height:44px; border-radius:50%; background:var(--fill); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--tx2); font-size:18px}
.caravatar img{width:100%; height:100%; object-fit:cover}
.caravatar-lg{width:88px; height:88px; border-radius:50%; background:var(--fill); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--tx2); font-size:32px; margin:0 auto 10px; position:relative}
.caravatar-lg img{width:100%; height:100%; object-fit:cover}
.mark svg{width:32px; height:32px; stroke:#fff; fill:none; stroke-width:1.7}
.opt{background:var(--bg-grouped); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px; text-align:left; border:0; width:100%; color:var(--tx); display:flex; align-items:center; gap:12px}
.opt.on{outline:2px solid var(--blue)}
.opt .oi{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.opt .oi svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.8}
.opt b{display:block; font-size:15.5px; font-weight:700}
.opt span.d{display:block; color:var(--tx2); font-size:12.5px; margin-top:1px}
.carcard{background:var(--bg-grouped); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:10px}

/* ===== Active shift ===== */
.activecard{background:linear-gradient(135deg,#0B3D2E,#14161A); color:#fff; border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
.activecard .live{display:flex; align-items:center; gap:6px; color:#5FE08A; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em}
.activecard .live .pulse{width:7px; height:7px; border-radius:50%; background:#5FE08A; animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.activecard.paused .live{color:var(--orange)}
.activecard.paused .live .pulse{background:var(--orange); animation:none}
.activecard .timer{font-size:34px; font-weight:800; letter-spacing:0.01em; margin:6px 0 2px}
.activecard .meta{color:rgba(255,255,255,0.65); font-size:13px; margin-bottom:14px}
.activecard .checkins{background:rgba(255,255,255,0.08); border-radius:12px; padding:2px 12px; margin-bottom:12px}
.activecard .checkins .ci{padding:8px 0; border-top:0.5px solid rgba(255,255,255,0.14); font-size:13px; display:flex; justify-content:space-between; gap:8px}
.activecard .checkins .ci:first-child{border-top:0}
.activecard .checkins .ci .t{color:rgba(255,255,255,0.5); font-size:11.5px; white-space:nowrap}

@media (min-width:700px){ .tilegrid{grid-template-columns:repeat(4,1fr)} }

/* ===== Smooth / springy polish layer ===== */
:root{ --spring:cubic-bezier(0.32,0.72,0,1); --spring-bounce:cubic-bezier(0.34,1.56,0.64,1); }
@media (prefers-reduced-motion:no-preference){
  body{ animation:appin .3s var(--spring) }
  @keyframes appin{from{opacity:0} to{opacity:1}}
  .group,.tile,.hero,.activecard,.opt,.carcard,.ctacard{ transition:background-color .2s ease, box-shadow .2s ease, transform .15s var(--spring-bounce) }
  .btn,.chip,.seg button,.segscroll button,.fab,.gearbtn,.infob,.iconbtn,.ctabtn,.codechip,.tabbar button,.close,.swipedel,.opt{
    transition:transform .13s var(--spring-bounce), background-color .15s ease, color .15s ease, opacity .15s ease;
  }
  .btn:active,.chip:active,.ctabtn:active,.codechip:active,.fab:active,.iconbtn:active,.infob:active,.close:active,.opt:active{ transform:scale(0.95) }
  .tabbar button:active{ transform:scale(0.88) }
  .gearbtn:active{ transform:scale(0.88) rotate(-8deg) }
  .row[onclick],.swipecontent[onclick],.carcard[onclick],div[onclick].group,.opt{ transition:background-color .15s ease }
  .row[onclick]:active,.swipecontent[onclick]:active{ background:var(--fill2) }
  .hero[onclick]:active,.tile[onclick]:active,.activecard[onclick]:active,.carcard[onclick]:active,div[onclick].group:active{ transform:scale(0.97) }
  body{ transition:background-color .25s ease }
  .fab{ transition:transform .18s var(--spring-bounce), box-shadow .18s ease }
  .fab:active{ transform:scale(0.9); box-shadow:0 3px 10px rgba(0,0,0,0.22) }
  #main{ animation:mainfade .22s var(--spring) }
  @keyframes mainfade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
}
/* Sheet: Apple-style spring sheet with fade overlay, animated in and out */
.overlay{ animation:ovin .2s var(--spring) }
.overlay.closing{ animation:ovout .18s ease-in forwards }
@keyframes ovin{from{opacity:0} to{opacity:1}}

  return {
    v:2,
    onboardingDone:false,
    profile:{ workType:'both', fop:'none', taxGroup2Fixed:0, taxGroup3Rate:5, esvMonthly:0 },
    cars:[],

    lastBackupAt: null,
    lastUsed: { carId:'', platformIds:[], expCategory:'', expCarId:'' }
  };
}
let DB;
function load(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    DB=raw?JSON.parse(raw):defaultDB();
    if(!DB.settings) DB.settings={yellowDays:3, redDays:7, doubleConfirm:false, showKopecks:false, accentColor:'', envelopeRate:0, envelopeWithdrawn:0, updateCheckMinutes:60};
    if(DB.settings.doubleConfirm===undefined) DB.settings.doubleConfirm=false;
    if(DB.settings.showKopecks===undefined) DB.settings.showKopecks=false;
    if(DB.settings.accentColor===undefined) DB.settings.accentColor='';
    if(DB.settings.envelopeRate===undefined) DB.settings.envelopeRate=0;
    if(DB.settings.envelopeWithdrawn===undefined) DB.settings.envelopeWithdrawn=0;
    if(DB.settings.updateCheckMinutes===undefined) DB.settings.updateCheckMinutes=60;
    if(!DB.profile) DB.profile={workType:'both', fop:'none', taxGroup2Fixed:0, taxGroup3Rate:5, esvMonthly:0};
    if(DB.profile.taxGroup2Fixed===undefined) DB.profile.taxGroup2Fixed=0;
    if(DB.profile.taxGroup3Rate===undefined) DB.profile.taxGroup3Rate=5;
    if(DB.profile.esvMonthly===undefined) DB.profile.esvMonthly=0;
    if(DB.onboardingDone===undefined) DB.onboardingDone=false;
    if(DB.activeShift===undefined) DB.activeShift=null;
    if(!DB.contacts) DB.contacts=[];
    if(!DB.goals) DB.goals={daily:0, weekly:0, monthly:0};
    if(!DB.reminders) DB.reminders=[];
    if(!DB.referralLinks) DB.referralLinks=REFERRAL_LINKS_DEFAULT.map(r=>({...r}));
    if(DB.lastBackupAt===undefined) DB.lastBackupAt=null;
    if(!DB.lastUsed) DB.lastUsed={ carId:'', platformIds:[], expCategory:'', expCarId:'' };
  }catch(e){ DB=defaultDB(); }
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }

const money=n=>{
  n=n||0; const neg=n<0; n=Math.abs(n);
  if(DB.settings && DB.settings.showKopecks) return (neg?'−':'')+n.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴';
  n=Math.round(n); return (neg?'−':'')+n.toLocaleString('uk-UA')+' ₴';
};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0;};
const moneyLoss=n=>n<0 ? 'мінус '+money(-n) : money(n);

const activeCars=()=>DB.cars.filter(c=>!c.archived);
const archivedCars=()=>DB.cars.filter(c=>c.archived);
function carsForSelect(includeId){
  const act=activeCars();
  if(includeId && !act.some(c=>c.id===includeId)){ const extra=carById(includeId); if(extra) return [...act, extra]; }
  return act;
}
function toggleCarArchive(id){
  const c=carById(id); if(!c) return;
  const willArchive=!c.archived;
  confirmAction({
    title: willArchive?'Перенести в архів?':'Повернути з архіву?',
    msg: willArchive
      ? 'Авто зникне зі списку активних і вибору при створенні нових записів, але вся історія — зміни, витрати, заробіток — залишиться доступною без обмежень.'
      : 'Авто знову з’явиться в активному гаражі й буде доступне при виборі для нових записів.',
    actionLabel: willArchive?'Архівувати':'Повернути', danger:false, skipStep2:true,
    onConfirm:()=>{ c.archived=willArchive; save(); renderCarDetail(id); },
    onCancel:()=>{}
  });
}
const platById=id=>DB.platforms.find(p=>p.id===id);
function carInsurances(c){
  if(!Array.isArray(c.insurances)){
    const old=c.insurance;
    c.insurances = (old && (Number(old.monthly)||old.renewDate||old.note)) ? [{id:uid(), type:'kasko', monthly:Number(old.monthly)||0, renewDate:old.renewDate||'', note:old.note||''}] : [];
  }
  return c.insurances;
}
function evHomeLoss(c){ return c.homeLossPct!==undefined ? num(c.homeLossPct) : 12; }
function evPublicLoss(c){ return c.publicLossPct!==undefined ? num(c.publicLossPct) : 8; }
function chargeActualKwh(c,f){ const loss = f.location==='public' ? evPublicLoss(c) : evHomeLoss(c); return num(f.amount)*(1-loss/100); }
function daysAgo(dateStr){ if(!dateStr) return Infinity; const d=new Date(dateStr+'T00:00:00'); const t=new Date(today()+'T00:00:00'); return Math.round((t-d)/86400000); }
function fuelUnit(car){ return car ? (FUEL_TYPES[car.fuelType]||FUEL_TYPES.petrol).unit : 'л'; }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDur(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=String(Math.floor(s/3600)).padStart(2,'0'), m=String(Math.floor(s%3600/60)).padStart(2,'0'), sec=String(s%60).padStart(2,'0');
  return h+':'+m+':'+sec;
}

let timerHandle=null;
function manageTimerLoop(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
  if(TAB==='shifts' && DB.activeShift && !DB.activeShift.pausedAt){
    timerHandle=setInterval(()=>{ const el=$('#activeTimer'); if(el) el.textContent=fmtDur(activeElapsedMs()); else manageTimerLoop(); }, 1000);

function activeElapsedMs(){
  const as=DB.activeShift; if(!as) return 0;
  const end = as.pausedAt || Date.now();
  return end - as.startTime - (as.pausedTotal||0);
}
function computePlatformHours(as, endTime){
  const events=(as.checkins||[]).filter(c=>['pause_platform','resume_platform','add_platform'].includes(c.type)).sort((a,b)=>a.t-b.t);
  let cur = Array.isArray(as.initialPlatformIds) ? [...as.initialPlatformIds] : [...(as.platformIds||[])];
  let t0=as.startTime; const acc={};
  function addSeg(t1){ const dur=Math.max(0,t1-t0); cur.forEach(pid=>{ acc[pid]=(acc[pid]||0)+dur; }); t0=t1; }
  events.forEach(ev=>{ addSeg(ev.t); if(Array.isArray(ev.platformIds)) cur=[...ev.platformIds]; });
  addSeg(endTime||Date.now());
  const hours={}; Object.keys(acc).forEach(pid=>{ hours[pid]=acc[pid]/3600000; });
  return hours;
}

/* ============ DASHBOARD ============ */
let PERIOD='month', customFrom='', customTo='';
function inPeriod(dateStr){
  if(PERIOD==='today') return dateStr===today();
  if(PERIOD==='7d'){ const d=new Date(); d.setDate(d.getDate()-6); return dateStr>=toLocalISO(d) && dateStr<=today(); }
  if(PERIOD==='month') return dateStr.slice(0,7)===today().slice(0,7);
  if(PERIOD==='year') return dateStr.slice(0,4)===today().slice(0,4);
  if(PERIOD==='all') return true;
  if(PERIOD==='custom') return (!customFrom||dateStr>=customFrom)&&(!customTo||dateStr<=customTo);
  return true;
}
function shiftIncome(s){ return (s.entries||[]).reduce((a,e)=>a+num(e.amount)+num(e.tips),0); }
function todayIncomeSoFar(){ return DB.shifts.filter(s=>s.date===today()).reduce((a,s)=>a+shiftIncome(s),0); }
function periodDaysCount(){
  if(PERIOD==='today') return 1;
  if(PERIOD==='7d') return 7;
  if(PERIOD==='month'){ const d=new Date(); return d.getDate(); }
  if(PERIOD==='year'){ const d=new Date(); const start=new Date(d.getFullYear(),0,1); return Math.max(1,Math.round((d-start)/86400000)+1); }
  if(PERIOD==='all'){
    const dates=[...DB.shifts.map(s=>s.date),...DB.expenses.map(e=>e.date),...DB.fuel.map(f=>f.date)].filter(Boolean).sort();
    if(!dates.length) return 1;
    const first=new Date(dates[0]+'T00:00:00'), now=new Date(today()+'T00:00:00');
    return Math.max(1,Math.round((now-first)/86400000)+1);
  }
  if(PERIOD==='custom'){
    if(!customFrom) return 1;
    const from=new Date(customFrom+'T00:00:00'), to=new Date((customTo||today())+'T00:00:00');
    return Math.max(1,Math.round((to-from)/86400000)+1);
  }
  return 1;
}
function dashData(){
  const shifts=DB.shifts.filter(s=>inPeriod(s.date));
  const expenses=DB.expenses.filter(e=>inPeriod(e.date));
  const fuel=DB.fuel.filter(f=>inPeriod(f.date));

  const income=shifts.reduce((a,s)=>a+shiftIncome(s),0);
  const fuelCost=fuel.reduce((a,f)=>a+num(f.cost),0);
  const otherExp=expenses.reduce((a,e)=>a+num(e.amount),0);
  const expTotal=fuelCost+otherExp;
  const profit=income-expTotal;
  const hours=shifts.reduce((a,s)=>a+num(s.hours),0);
  const km=shifts.reduce((a,s)=>a+num(s.km),0);
  const nShifts=shifts.length;

  const byPlat={};
  shifts.forEach(s=>(s.entries||[]).forEach(e=>{ byPlat[e.platformId]=(byPlat[e.platformId]||0)+num(e.amount)+num(e.tips); }));
  const platRows=Object.entries(byPlat).sort((a,b)=>b[1]-a[1]);

  const byCar={};
  shifts.forEach(s=>{ byCar[s.carId]=byCar[s.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[s.carId].inc+=shiftIncome(s); byCar[s.carId].km+=num(s.km); byCar[s.carId].hours+=num(s.hours); byCar[s.carId].n++; });
  expenses.forEach(e=>{ if(!e.carId) return; byCar[e.carId]=byCar[e.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[e.carId].exp+=num(e.amount); byCar[e.carId].otherExp+=num(e.amount); });
  fuel.forEach(f=>{ byCar[f.carId]=byCar[f.carId]||{inc:0,exp:0,fuelExp:0,otherExp:0,km:0,hours:0,n:0}; byCar[f.carId].exp+=num(f.cost); byCar[f.carId].fuelExp+=num(f.cost); });

  const byCatExp={};
  expenses.forEach(e=>{ byCatExp[e.category]=(byCatExp[e.category]||0)+num(e.amount); });

  const platHours={};
  shifts.forEach(s=>{ const ph=s.platformHours; if(ph){ Object.entries(ph).forEach(([pid,h])=>{ platHours[pid]=(platHours[pid]||0)+h; }); } else if((s.entries||[]).length===1){ const pid=s.entries[0].platformId; platHours[pid]=(platHours[pid]||0)+num(s.hours); } });

  const platShiftCount={};
  shifts.forEach(s=>(s.entries||[]).forEach(e=>{ platShiftCount[e.platformId]=(platShiftCount[e.platformId]||0)+1; }));

  const totalMonthlyFixed=activeCars().reduce((a,c)=>a+num(c.loan&&c.loan.monthlyPayment)+carInsurances(c).reduce((s,ins)=>s+num(ins.monthly),0),0) + num(DB.profile.esvMonthly) + (DB.profile.fop==='group2'?num(DB.profile.taxGroup2Fixed):0);
  const periodDays=periodDaysCount();
  const fixedForPeriod=totalMonthlyFixed/30*periodDays;
  const breakevenTotal=fixedForPeriod+expTotal;
  const breakevenDelta=income-breakevenTotal;

  return { shifts, expenses, fuel, income, fuelCost, otherExp, expTotal, profit, hours, km, nShifts, byPlat, platRows, byCar, byCatExp, platHours, platShiftCount, totalMonthlyFixed, periodDays, fixedForPeriod, breakevenTotal, breakevenDelta };
}
const MONTH_SHORT=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
function bucketProfit(fromDate, toDate){
  const inRange=(ds)=>ds>=fromDate && ds<=toDate;
  const inc=DB.shifts.filter(s=>inRange(s.date)).reduce((a,s)=>a+shiftIncome(s),0);
  const exp=DB.expenses.filter(e=>inRange(e.date)).reduce((a,e)=>a+num(e.amount),0) + DB.fuel.filter(f=>inRange(f.date)).reduce((a,f)=>a+num(f.cost),0);
  return inc-exp;
}
function profitTrendBuckets(){
  let buckets=[];
  if(PERIOD==='7d'){
    let d=new Date(); d.setDate(d.getDate()-6);
    for(let i=0;i<7;i++){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate()), from:ds, to:ds}); d.setDate(d.getDate()+1); }
  }else if(PERIOD==='month'){
    const now=new Date(); const days=now.getDate();
    let d=new Date(now.getFullYear(), now.getMonth(), 1);
    for(let i=0;i<days;i++){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate()), from:ds, to:ds}); d.setDate(d.getDate()+1); }
  }else if(PERIOD==='year'){
    const now=new Date(); const months=now.getMonth()+1;
    for(let m=0;m<months;m++){ const from=toLocalISO(new Date(now.getFullYear(),m,1)); const to=toLocalISO(new Date(now.getFullYear(),m+1,0)); buckets.push({label:MONTH_SHORT[m], from, to}); }
  }else if(PERIOD==='all' || PERIOD==='custom'){
    const allDates=[...DB.shifts.map(s=>s.date), ...DB.expenses.map(e=>e.date), ...DB.fuel.map(f=>f.date)].filter(Boolean);
    let fromLimit = PERIOD==='custom' && customFrom ? customFrom : (allDates.length?allDates.reduce((a,b)=>a<b?a:b):today());
    let toLimit = PERIOD==='custom' && customTo ? customTo : today();
    const start=new Date(fromLimit+'T00:00:00'), end=new Date(toLimit+'T00:00:00');
    const dayDiff=Math.round((end-start)/86400000);
    if(dayDiff<=45){
      let d=new Date(start);
      while(toLocalISO(d)<=toLimit){ const ds=toLocalISO(d); buckets.push({label:String(d.getDate())+'.'+String(d.getMonth()+1), from:ds, to:ds}); d.setDate(d.getDate()+1); }
    }else{
      let cursor=new Date(start.getFullYear(), start.getMonth(), 1);
      while(toLocalISO(cursor)<=toLimit){
        const from=toLocalISO(cursor);
        const to=toLocalISO(new Date(cursor.getFullYear(), cursor.getMonth()+1, 0));
        buckets.push({label:MONTH_SHORT[cursor.getMonth()]+(cursor.getFullYear()!==new Date().getFullYear()?" '"+String(cursor.getFullYear()).slice(2):''), from, to});
        cursor.setMonth(cursor.getMonth()+1);
      }
      if(buckets.length>18) buckets=buckets.slice(-18);
    }
  }
  buckets.forEach(b=>{ b.profit=bucketProfit(b.from,b.to); });
  return buckets;
}
function renderProfitTrendSvg(buckets){
  if(!buckets || !buckets.length) return '';
  const w=320, h=110, padL=4, padR=4, padT=6, padB=16;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const maxAbs=Math.max(1, ...buckets.map(b=>Math.abs(b.profit)));
  const n=buckets.length, gap=n>20?1:2;
  const barW=Math.max(1.5,(innerW-gap*(n-1))/n);
  const zeroY=padT+innerH/2;
  let bars='';
  buckets.forEach((b,i)=>{
    const x=padL+i*(barW+gap);
    const bh=Math.max(1, Math.abs(b.profit)/maxAbs*(innerH/2-4));
    const y = b.profit>=0 ? zeroY-bh : zeroY;
    const color = b.profit>=0 ? 'var(--green)' : 'var(--red)';
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(2,barW/2).toFixed(1)}" style="fill:${color}"><title>${esc(b.label)}: ${money(b.profit)}</title></rect>`;
  });
  const labelEvery=Math.max(1, Math.ceil(n/7));
  let labels='';
  buckets.forEach((b,i)=>{
    if(i%labelEvery!==0 && i!==n-1) return;
    const x=padL+i*(barW+gap)+barW/2;
    labels+=`<text x="${x.toFixed(1)}" y="${h-4}" text-anchor="middle" style="font-size:8px;fill:var(--tx3)">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--sep);stroke-width:1"/>
    ${bars}${labels}
  </svg>`;
}

function allTimeIncome(){ return DB.shifts.reduce((a,s)=>a+shiftIncome(s),0); }
function envelopeBalance(){

function openPlatformCompareSheet(){
  const periods=[['today','Сьогодні'],['7d','7 днів'],['month','Місяць'],['year','Рік'],['all','Весь час']];
  const d=dashData();
  const rows=Object.keys(d.byPlat).map(pid=>{
    const income=d.byPlat[pid]||0;
    const hours=d.platHours[pid]||0;
    let km=0;
    d.shifts.forEach(s=>{
      const entries=(s.entries||[]).filter(e=>e.platformId===pid);
      if(!entries.length || !num(s.km)) return;
      const shiftTotal=(s.entries||[]).reduce((a,e)=>a+num(e.amount)+num(e.tips),0);
      const platAmt=entries.reduce((a,e)=>a+num(e.amount)+num(e.tips),0);
      if(shiftTotal>0) km+=num(s.km)*(platAmt/shiftTotal);
    });
    return {pid, income, hours, km};
  }).filter(r=>r.income>0);
  rows.sort((a,b)=>b.income-a.income);
  let html=`<h3>Порівняння платформ</h3>`;
  html+=`<div class="seg" style="margin:12px 0">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';openPlatformCompareSheet()">${p[1]}</button>`).join('')}

/* ===== Swipe-to-delete engine (delegated, works for shifts + expenses lists) ===== */
let swEl=null, swStartX=0, swStartY=0, swBase=0, swLocked=null, swMoved=false, swOpenRow=null;
function swipeInit(){
  const main=$('#main');
  if(!main || main.dataset.swipeBound) return;
  main.dataset.swipeBound='1';
  main.addEventListener('touchstart', swTouchStart, {passive:true});
  main.addEventListener('touchmove', swTouchMove, {passive:false});
  main.addEventListener('touchend', swTouchEnd, {passive:true});
  main.addEventListener('touchcancel', swTouchEnd, {passive:true});
  main.addEventListener('click', swClickGuard, true);
}
function swTouchStart(e){
  swMoved=false; swLocked=null;
  const row=e.target.closest('.swiperow');
  swEl=row||null;
  if(!row) return;
  const t=e.touches[0];
  swStartX=t.clientX; swStartY=t.clientY;
  swBase = row.classList.contains('swopen') ? -84 : 0;
}
function swTouchMove(e){
  if(!swEl) return;
  const t=e.touches[0];
  const dx=t.clientX-swStartX, dy=t.clientY-swStartY;
  if(swLocked===null){
    if(Math.abs(dx)>8 || Math.abs(dy)>8) swLocked = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(swLocked==='x'){
    e.preventDefault();
    swMoved=true;
    swEl.classList.add('swdragging');
    let nx=Math.max(-84, Math.min(0, swBase+dx));
    const content=swEl.querySelector('.swipecontent');
    if(content) content.style.transform=`translateX(${nx}px)`;
  }
}
function swTouchEnd(e){
  if(!swEl) return;
  const content=swEl.querySelector('.swipecontent');
  swEl.classList.remove('swdragging');
  if(swLocked==='x'){
    const t=e.changedTouches[0];
    const dx=t.clientX-swStartX;
    const finalX=swBase+dx;
    const shouldOpen=finalX < -42;
    if(content) content.style.transform='';
    if(swOpenRow && swOpenRow!==swEl) swOpenRow.classList.remove('swopen');
    swEl.classList.toggle('swopen', shouldOpen);
    swOpenRow = shouldOpen ? swEl : null;
  }
  swEl=null; swLocked=null;
}
function swClickGuard(e){
  if(swMoved){ e.preventDefault(); e.stopPropagation(); swMoved=false; return; }
  const row=e.target.closest('.swiperow');
  if(swOpenRow && swOpenRow!==row){ swOpenRow.classList.remove('swopen'); swOpenRow=null; return; }
  if(swOpenRow && row===swOpenRow && !e.target.closest('.swipedel')){
    e.preventDefault(); e.stopPropagation();
    swOpenRow.classList.remove('swopen'); swOpenRow=null;
  }
}
/* ===== Swipe between dashboard periods ===== */
const DASH_PERIOD_ORDER=['today','7d','month','year','all'];
let dsStartX=0, dsStartY=0, dsLocked=null, dsMoved=false;
function dashSwipeInit(){
  const main=$('#main');
  if(!main || main.dataset.dashSwipeBound) return;
  main.dataset.dashSwipeBound='1';
  main.addEventListener('touchstart', dsTouchStart, {passive:true});
  main.addEventListener('touchmove', dsTouchMove, {passive:true});
  main.addEventListener('touchend', dsTouchEnd, {passive:true});
}
function dsTouchStart(e){
  dsMoved=false; dsLocked=null;
  if(TAB!=='dash' || e.target.closest('button,a,select,input,textarea,.seg,.chip,.swiperow')){ dsLocked='ignore'; return; }
  const t=e.touches[0]; dsStartX=t.clientX; dsStartY=t.clientY;
}
function dsTouchMove(e){
  if(TAB!=='dash' || dsLocked==='ignore') return;
  const t=e.touches[0];
  const dx=t.clientX-dsStartX, dy=t.clientY-dsStartY;
  if(dsLocked===null && (Math.abs(dx)>10 || Math.abs(dy)>10)){
    dsLocked = Math.abs(dx)>Math.abs(dy)*1.3 ? 'x' : 'y';
  }
  if(dsLocked==='x') dsMoved=true;
}
function dsTouchEnd(e){
  if(TAB!=='dash' || dsLocked!=='x' || !dsMoved){ dsLocked=null; return; }
  const t=e.changedTouches[0];
  const dx=t.clientX-dsStartX;
  dsLocked=null;
  if(Math.abs(dx)<60) return;
  let idx=DASH_PERIOD_ORDER.indexOf(PERIOD);
  if(idx===-1) idx=2;
  idx = dx<0 ? Math.min(DASH_PERIOD_ORDER.length-1, idx+1) : Math.max(0, idx-1);
  PERIOD=DASH_PERIOD_ORDER[idx];
  render();
}

function shiftsListHtml(){
  const list=[...DB.shifts].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));

function platformChips(selected, onToggleFnName){
  if(!DB.platforms.length) return `<div class="empty">Спершу додайте платформи в налаштуваннях</div>`;
  return `<div class="chipwrap">${DB.platforms.map(p=>`<button type="button" class="chip ${selected.includes(p.id)?'on':''}" onclick="${onToggleFnName}('${p.id}')">${esc(p.name)}</button>`).join('')}</div>`;
}

const STDRAFT_KEY='vodiy_draft_startshift';
function loadStartDraft(){ try{ const raw=localStorage.getItem(STDRAFT_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveStartDraft(d){ try{ localStorage.setItem(STDRAFT_KEY, JSON.stringify(d)); }catch(e){} }
function clearStartDraft(){ try{ localStorage.removeItem(STDRAFT_KEY); }catch(e){} }
function lastFinishedShift(){
  if(!DB.shifts.length) return null;
  return [...DB.shifts].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)))[0];
}
function openStartShiftForm(){
  if(!activeCars().length){ showSheet(`<h3>Спершу додайте авто</h3><div class="confirm-msg">Зміну потрібно прив'язати до активного авто. Перейдіть у вкладку «Авто» (можливо, усі ваші авто зараз в архіві).</div><button class="btn ghost" onclick="closeSheet()">Зрозуміло</button>`); return; }
  const activeIds=activeCars().map(c=>c.id);
  let sel=[];
  const draft=loadStartDraft();
  const lastCarId = DB.lastUsed && DB.lastUsed.carId && activeIds.includes(DB.lastUsed.carId) ? DB.lastUsed.carId : '';
  const lastShift = lastFinishedShift();
  const canRepeat = lastShift && activeIds.includes(lastShift.carId);
  showSheet(`
    <h3>Почати зміну</h3>
    ${draft?`<div class="confirm-msg" style="background:var(--fill2);border-radius:11px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Є незбережені дані з минулого разу</span><button type="button" class="btn add" style="width:auto;padding:6px 12px" onclick="restoreStartDraft()">Відновити</button></div>`:''}
    ${canRepeat?`<button class="btn ghost" style="margin-bottom:10px" onclick="repeatLastShift()">🔁 Повторити останню зміну (авто + платформи)</button>`:''}
    <div style="margin-top:4px">
      <div class="field"><label>Авто</label><select id="stCar" onchange="saveStartDraft(collectStartDraft())">${activeCars().map(c=>`<option value="${c.id}" ${c.id===lastCarId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Де працюєте зараз</label><div id="stChips">${platformChips(sel,'toggleStPlat')}</div></div>
      <div class="field"><label>Одометр на старті, км (необов'язково)</label><input type="number" inputmode="decimal" id="stOdo" oninput="saveStartDraft(collectStartDraft())"></div>
      <div class="field"><label>Готівка при собі зараз, ₴ <button type="button" class="infob" onclick="alertSheet('Готівка при собі','Скільки готівки у вас на руках на момент початку зміни. Допомагає звірити суму в кінці зміни, якщо частина замовлень оплачена готівкою.')">i</button></label><input type="number" inputmode="decimal" id="stCash" placeholder="0" oninput="saveStartDraft(collectStartDraft())"></div>
      <button class="btn green" onclick="doStartShift()">▶ Почати зміну</button>
    </div>
  `);
  window.collectStartDraft=()=>({ carId:$('#stCar')?.value, sel, odo:$('#stOdo')?.value, cash:$('#stCash')?.value });
  window.toggleStPlat=(id)=>{ sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]; $('#stChips').innerHTML=platformChips(sel,'toggleStPlat'); saveStartDraft(collectStartDraft()); };
  window.restoreStartDraft=()=>{
    const d=loadStartDraft(); if(!d) return;
    if(d.carId) $('#stCar').value=d.carId;
    sel=Array.isArray(d.sel)?[...d.sel]:[]; $('#stChips').innerHTML=platformChips(sel,'toggleStPlat');
    if(d.odo) $('#stOdo').value=d.odo;
    if(d.cash) $('#stCash').value=d.cash;
  };
  window.repeatLastShift=()=>{
    if(!lastShift) return;
    if(activeIds.includes(lastShift.carId)) $('#stCar').value=lastShift.carId;
    sel=[...new Set((lastShift.entries||[]).map(e=>e.platformId).filter(Boolean))];
    $('#stChips').innerHTML=platformChips(sel,'toggleStPlat');
    saveStartDraft(collectStartDraft());
  };
  window.doStartShift=()=>{
    const carId=$('#stCar').value;
    const odo=num($('#stOdo').value) || num(carById(carId)?.odo) || 0;
    const startCash=num($('#stCash').value);
    DB.activeShift={ id:uid(), carId, platformIds:sel, initialPlatformIds:[...sel], pausedPlatformIds:[], startTime:Date.now(), pausedAt:null, pausedTotal:0, startOdo:odo, startCash, checkins:[] };
    DB.lastUsed=DB.lastUsed||{}; DB.lastUsed.carId=carId; DB.lastUsed.platformIds=[...sel];
    clearStartDraft();
    save(); closeSheet(); setTab('shifts');
  };
}
function pauseShift(){ if(!DB.activeShift||DB.activeShift.pausedAt) return; DB.activeShift.pausedAt=Date.now(); save(); render(); manageTimerLoop(); }
function resumeShift(){ const as=DB.activeShift; if(!as||!as.pausedAt) return; as.pausedTotal=(as.pausedTotal||0)+(Date.now()-as.pausedAt); as.pausedAt=null; save(); render(); manageTimerLoop(); }
const CHECKIN_TYPES=[
  ['order','Замовлення / доставка'],
  ['side_order','Стороннє замовлення (без платформи)'],
  ['pause_platform','Призупинив(ла) платформу'],
  ['resume_platform','Відновив(ла) призупинену платформу'],
  ['add_platform','Почав(ла) ще одну платформу'],
  ['cash','Отримав(ла) готівку'],
  ['odo','Одометр зараз'],
  ['note','Просто нотатка']
];
function openCheckinForm(){
  if(!DB.activeShift) return;
  let type='order';
  function bodyHtml(){
    const as=DB.activeShift;
    as.pausedPlatformIds=as.pausedPlatformIds||[];
    const activePl=DB.platforms.filter(p=>(as.platformIds||[]).includes(p.id));
    const pausedPl=DB.platforms.filter(p=>as.pausedPlatformIds.includes(p.id));
    const neverActivePl=DB.platforms.filter(p=>!(as.platformIds||[]).includes(p.id) && !as.pausedPlatformIds.includes(p.id));
    let extra='';
    if(type==='order'){
      extra=`<div class="row2">
        <div class="field"><label>Кількість</label><input type="number" inputmode="numeric" id="ciCount" placeholder="1"></div>
        <div class="field"><label>Платформа</label><select id="ciPlat">${(activePl.length?activePl:DB.platforms).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      </div>`;
    }else if(type==='side_order'){
      extra=`<div class="field"><label>Сума, ₴ <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Стороннє замовлення','Наприклад, «лівак» — пасажир чи доставка поза платформою, оплата напряму вам. Ця сума потрапить у дохід зміни окремим рядком «Без платформи».')">i</button></label><input type="number" inputmode="decimal" id="ciSideAmt" placeholder="0"></div>
        <div class="field"><label>Нотатка (необов'язково)</label><input type="text" id="ciSideNote" placeholder="напр. підвіз від зупинки"></div>`;
    }else if(type==='pause_platform'){
      extra = activePl.length
        ? `<div class="field"><label>Яку платформу призупиняєте?</label><select id="ciPausePlat">${activePl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`
        : `<div class="empty">Немає активних платформ на цій зміні.</div>`;
    }else if(type==='resume_platform'){
      extra = pausedPl.length
        ? `<div class="field"><label>Яку призупинену платформу відновлюєте?</label><select id="ciResumePlat">${pausedPl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`
        : `<div class="empty">Немає призупинених платформ на цій зміні.</div>`;
    }else if(type==='add_platform'){
      extra = neverActivePl.length
        ? `<div class="field"><label>Яку платформу додати?</label><select id="ciAddPlat">${neverActivePl.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`
        : `<div class="empty">Усі ваші платформи вже задіяні на цій зміні.</div>`;
    }else if(type==='cash'){
      extra=`<div class="field"><label>Сума готівки, ₴</label><input type="number" inputmode="decimal" id="ciCash" placeholder="0"></div>`;
    }else if(type==='odo'){
      extra=`<div class="field"><label>Одометр зараз, км</label><input type="number" inputmode="decimal" id="ciOdo"></div>`;
    }else if(type==='note'){
      extra=`<div class="field"><label>Нотатка</label><input type="text" id="ciNote" placeholder="напр. перерва на обід"></div>`;
    }
    return `
      <div class="field"><label>Що сталось? <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Проміжний запис','Це журнал того, що відбувається протягом зміни — для пам\\'яті й для точнішого підрахунку в кінці. Якщо ви працюєте одразу на кількох платформах і одну з них призупиняєте (наприклад, слот доставки скінчився і ви перемкнулись тільки на таксі) — позначте це тут: список активних платформ на зміні оновиться.')">i</button></label>
      <select id="ciType" onchange="ciChangeType(this.value)">${CHECKIN_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===type?'selected':''}>${t[1]}</option>`).join('')}</select></div>
      <div id="ciExtra">${extra}</div>
      <button class="btn primary" onclick="saveCheckin()">Додати запис</button>`;
  }
  showSheet(`<h3>Проміжний запис</h3><div style="margin-top:14px" id="ciWrap">${bodyHtml()}</div>`);
  window.ciChangeType=(v)=>{ type=v; $('#ciWrap').innerHTML=bodyHtml(); };
  window.saveCheckin=()=>{
    const as=DB.activeShift; as.checkins=as.checkins||[]; as.platformIds=as.platformIds||[]; as.pausedPlatformIds=as.pausedPlatformIds||[];
    let text='', extra={};
    if(type==='order'){
      const count=$('#ciCount').value, plId=$('#ciPlat')?.value, p=platById(plId);
      if(!count){ alertSheet('Вкажіть кількість','Скільки замовлень чи доставок?'); return; }
      text=`${count} · ${p?p.name:'замовлення'}`;
    }else if(type==='side_order'){
      const amt=$('#ciSideAmt').value, note=$('#ciSideNote').value.trim();
      if(!amt || num(amt)<=0){ alertSheet('Вкажіть суму','Скільки отримали за це замовлення?'); return; }
      text=`🤝 Без платформи: ${money(num(amt))}${note?' · '+note:''}`;
      extra={amount:num(amt), note};
    }else if(type==='pause_platform'){
      const plId=$('#ciPausePlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що призупиняти','Немає активних платформ на цій зміні.'); return; }
      as.platformIds=as.platformIds.filter(x=>x!==plId);
      if(!as.pausedPlatformIds.includes(plId)) as.pausedPlatformIds.push(plId);
      text=`⏸ Призупинено: ${p.name}`;
    }else if(type==='resume_platform'){
      const plId=$('#ciResumePlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що відновлювати','Немає призупинених платформ.'); return; }
      as.pausedPlatformIds=as.pausedPlatformIds.filter(x=>x!==plId);
      if(!as.platformIds.includes(plId)) as.platformIds.push(plId);
      text=`▶ Відновлено: ${p.name}`;
    }else if(type==='add_platform'){
      const plId=$('#ciAddPlat')?.value, p=platById(plId);
      if(!p){ alertSheet('Немає що додавати','Усі платформи вже задіяні.'); return; }
      if(!as.platformIds.includes(plId)) as.platformIds.push(plId);
      text=`+ Почав(ла) працювати: ${p.name}`;
    }else if(type==='cash'){
      const amt=$('#ciCash').value;
      if(!amt){ alertSheet('Вкажіть суму','Скільки готівки отримали?'); return; }
      text=`💵 Готівка: ${money(num(amt))}`;
    }else if(type==='odo'){
      const odo=$('#ciOdo').value;
      if(!odo){ alertSheet('Вкажіть одометр','Введіть поточний пробіг.'); return; }
      text=`Одометр: ${odo} км`;
    }else if(type==='note'){
      const note=$('#ciNote').value.trim();
      if(!note){ alertSheet('Порожня нотатка','Напишіть текст нотатки.'); return; }
      text=note;
    }
    as.checkins.push({ t:Date.now(), type, text, ...extra, platformIds:[...as.platformIds] });
    save(); closeSheet(); render();
  };
}
function requestCancelShift(){
  confirmDelete('Скасувати зміну?', 'Весь час і проміжні записи цієї зміни буде втрачено.', ()=>{
    DB.activeShift=null; save(); render();
  });
}
function openFinishShiftForm(){
  const as=DB.activeShift; if(!as) return;
  const c=carById(as.carId);
  const rowId=()=>uid();
  let entries=(as.platformIds&&as.platformIds.length ? as.platformIds : [DB.platforms[0]?.id]).filter(Boolean).map(pid=>({id:rowId(), platformId:pid, mode:'net', amount:'', gross:'', commission:'', orders:''}));
  if(!entries.length) entries=[{id:rowId(), platformId:DB.platforms[0]?.id||'', mode:'net', amount:'', gross:'', commission:'', orders:''}];
  const sideTotal=(as.checkins||[]).filter(ci=>ci.type==='side_order').reduce((s,ci)=>s+num(ci.amount),0);
  if(sideTotal>0) entries.push({id:rowId(), platformId:'', mode:'net', amount:String(sideTotal), gross:'', commission:'', orders:''});
  function fEntryNet(en){ return en.mode==='gross' ? Math.max(0, num(en.gross)-num(en.commission)) : num(en.amount); }
  function entryRows(){
    return entries.map(en=>`
      <div class="platentry" data-en="${en.id}">
        <div class="platrow">
          <select onchange="updFEntry('${en.id}','platformId',this.value)">
            <option value="" ${en.platformId===''?'selected':''}>Без платформи (готівка)</option>
            ${DB.platforms.map(p=>`<option value="${p.id}" ${p.id===en.platformId?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
          ${en.mode==='gross'
            ? `<div class="tnum" style="text-align:right;padding:10px 2px;font-weight:700">${money(fEntryNet(en))}</div>`
            : `<input type="number" inputmode="decimal" placeholder="₴" value="${en.amount}" onchange="updFEntry('${en.id}','amount',this.value)">`}
          <button class="iconbtn" onclick="rmFEntry('${en.id}')">✕</button>
        </div>
        <div style="text-align:right;margin:-2px 0 8px">
          <button type="button" style="background:none;border:0;color:var(--blue);font-size:12px;padding:2px" onclick="toggleFEntryMode('${en.id}')">${en.mode==='gross'?'Ввести чистими':'Ввести деталі (брудний дохід і комісія)'}</button>
        </div>
        ${en.mode==='gross'?`
        <div class="row2" style="margin-bottom:8px">
          <div class="field" style="margin:0"><label style="font-size:11px">Дохід загальний, ₴</label><input type="number" inputmode="decimal" value="${en.gross}" onchange="updFGross('${en.id}',this.value)"></div>
          <div class="field" style="margin:0"><label style="font-size:11px">Комісія, ₴</label><input type="number" inputmode="decimal" value="${en.commission}" onchange="updFEntry('${en.id}','commission',this.value);refreshFEntries()"></div>
        </div>
        <div class="field" style="margin-bottom:10px"><label style="font-size:11px">Кількість замовлень (необов'язково)</label><input type="number" inputmode="numeric" value="${en.orders}" onchange="updFEntry('${en.id}','orders',this.value)"></div>
        `:''}
      </div>`).join('');
  }
  function refreshFEntries(){ $('#fEntriesWrap').innerHTML=entryRows(); }
  window.updFEntry=(id,field,val)=>{ const e=entries.find(x=>x.id===id); if(e) e[field]=val; };
  window.updFGross=(id,val)=>{
    const e=entries.find(x=>x.id===id); if(!e) return;
    e.gross=val;
    const p=platById(e.platformId);
    if(p && p.commissionPct && (e.commission==='' || e.commission==null)) e.commission=(num(val)*p.commissionPct/100).toFixed(2);
    refreshFEntries();
  };
  window.toggleFEntryMode=(id)=>{
    const e=entries.find(x=>x.id===id); if(!e) return;
    if(e.mode==='gross'){ e.amount=String(fEntryNet(e)||''); e.mode='net'; }
    else{ e.mode='gross'; if(!e.gross) e.gross=e.amount||''; }
    refreshFEntries();
  };
  window.rmFEntry=(id)=>{ entries=entries.filter(x=>x.id!==id); if(!entries.length) entries=[{id:rowId(),platformId:DB.platforms[0]?.id||'',mode:'net',amount:'',gross:'',commission:'',orders:''}]; refreshFEntries(); };
  window.addFEntry=()=>{ entries.push({id:rowId(), platformId:DB.platforms[0]?.id||'', mode:'net', amount:'', gross:'', commission:'', orders:''}); refreshFEntries(); };

  const elapsedH=Math.round(activeElapsedMs()/36000)/100;
  const platHoursNow=computePlatformHours(as, Date.now());
  const breakdownHtml = Object.keys(platHoursNow).length>1 ? `<div class="sub" style="margin-top:4px">${Object.entries(platHoursNow).map(([pid,h])=>`${esc(platById(pid)?.name||'?')} ~${(Math.round(h*10)/10)} год`).join(' · ')} (загальна тривалість не підсумовується, бо платформи йшли паралельно)</div>` : '';
  showSheet(`
    <h3>Завершити зміну</h3>
    <div class="confirm-msg" style="margin-bottom:0">${esc(c?c.name:'')} · тривалість ${fmtDur(activeElapsedMs())}</div>
    <div style="margin-top:14px">
      <div class="field"><label>Дохід по платформах</label>
        <div id="fEntriesWrap">${entryRows()}</div>
        <button class="btn add" onclick="addFEntry()">+ Додати платформу</button>
      </div>
      <div class="field"><label>Чайові, ₴ (загалом)</label><input type="number" inputmode="decimal" id="fTips" placeholder="0"></div>
      <div class="row2">
        <div class="field"><label>Годин за кермом <button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Годин за кермом','Якщо залишити поле порожнім, система сама порахує тривалість зміни від початку до завершення (за вирахуванням пауз). Якщо ви працювали одразу на кількох платформах паралельно, загальна тривалість не подвоюється — це реальний час за кермом.')">i</button></label><input type="number" inputmode="decimal" id="fHours" placeholder="${elapsedH}">${breakdownHtml}</div>
        <div class="field"><label>Одометр в кінці, км</label><input type="number" inputmode="decimal" id="fEndOdo" value="${as.startOdo||''}"></div>
      </div>
      ${as.startCash?`<div class="field"><label>Готівка при собі на старті</label><div class="confirm-msg" style="margin:0">Було: ${money(num(as.startCash))}. Звірте з тим, скільки готівки у вас зараз, враховуючи прийняту готівку за зміну.</div></div>`:''}
      <div class="field"><label>Нотатка</label><textarea id="fNote"></textarea></div>
      <button class="btn primary" onclick="doFinishShift()">Зберегти зміну</button>
    </div>
  `);
  window.doFinishShift=()=>{
    const tips=num($('#fTips').value);
    let finalEntries=entries.filter(e=>fEntryNet(e)>0).map(e=>({platformId:e.platformId, amount:fEntryNet(e), tips:0, ...(e.mode==='gross'?{gross:num(e.gross), commission:num(e.commission), orders:num(e.orders)||0}:{})}));
    if(!finalEntries.length && tips>0){ finalEntries=[{platformId:entries[0]?.platformId||DB.platforms[0]?.id, amount:0, tips:0}]; }
    if(!finalEntries.length){ alertSheet('Додайте дохід','Вкажіть суму хоча б для однієї платформи або чайові.'); return; }
    if(tips>0) finalEntries[0].tips=tips;
    const endOdo=num($('#fEndOdo').value);
    const km=Math.max(0, endOdo - num(as.startOdo));
    const hoursRaw=$('#fHours').value;
    const hours = hoursRaw!=='' ? num(hoursRaw) : elapsedH;
    const endTime=Date.now();
    const s={ id:uid(), date:today(), carId:as.carId, entries:finalEntries, hours, platformHours:computePlatformHours(as,endTime), km, startOdo:as.startOdo, endOdo, startCash:as.startCash||0, startTime:as.startTime, endTime, checkins:as.checkins||[], note:$('#fNote').value.trim(), log:[] };
    const car=carById(s.carId); if(car && endOdo>num(car.odo)) car.odo=endOdo;
    DB.shifts.push(s); DB.activeShift=null; save(); closeSheet(); render(); manageTimerLoop();
  };
}
function openManualShiftForm(){
  if(!activeCars().length){ showSheet(`<h3>Спершу додайте авто</h3><div class="confirm-msg">Зміну потрібно прив'язати до активного авто. Перейдіть у вкладку «Авто» (можливо, усі ваші авто зараз в архіві).</div><button class="btn ghost" onclick="closeSheet()">Зрозуміло</button>`); return; }
  const rowId=()=>uid();
  let entries=[{ id:rowId(), platformId:DB.platforms[0]?.id||'', amount:'' }];
  function entryRows(){
    return entries.map(en=>`
      <div class="platrow" data-en="${en.id}">
        <select onchange="updMEntry('${en.id}','platformId',this.value)">
          ${DB.platforms.map(p=>`<option value="${p.id}" ${p.id===en.platformId?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select>

    const prev={ date:sh.date, entries:sh.entries, hours:sh.hours, km:sh.km, note:sh.note };

function revertShiftLog(id, logIdx){
  const sh=DB.shifts.find(x=>x.id===id); if(!sh) return;
  const entry=sh.log&&sh.log[logIdx]; if(!entry||!entry.prev) return;
  const cur={ date:sh.date, entries:sh.entries, hours:sh.hours, km:sh.km, note:sh.note };
  Object.assign(sh, entry.prev);
  sh.log.push({ t:Date.now(), text:'Відновлено попередню версію', prev:cur });
  save(); openShiftDetail(id);
}
function requestDeleteShift(id){
  confirmDelete('Видалити зміну?','Дохід за цю зміну зникне з усіх звітів.', ()=>{
    const s=DB.shifts.find(x=>x.id===id);
    if(s){ const c=carById(s.carId); if(c && s.km) c.odo=Math.max(0,num(c.odo)-s.km); }
    DB.shifts=DB.shifts.filter(x=>x.id!==id); save(); render();
  });
}

let expSearchQ='', expSearchCatFilter='';
function expenseListHtml(list){
  const q=expSearchQ.trim().toLowerCase();

    if(q){
      const c=carById(e.carId); const cat=catById(e.category);
      const hay=[cat.name, c?c.name:'', e.note||''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(!filtered.length) return `<div class="empty">${q||expSearchCatFilter?'Нічого не знайдено за цим фільтром':'Немає витрат за цей період'}</div>`;
  return filtered.map(e=>{
    const c=carById(e.carId); const cat=catById(e.category);
    return `<div class="swiperow">
      <button type="button" class="swipedel" onclick="swipeDeleteExpense('${e.id}')">Видалити</button>
      <div class="row swipecontent" onclick="openExpenseDetail('${e.id}')" style="cursor:pointer">
        <div class="rtitle"><b>${esc(cat.name)}</b><div class="sub">${fmtDate(e.date)}${c?' · '+esc(c.name):''} · ${e.work?'робоча':'особиста'}${e.payment?' · '+(e.payment==='cash'?'готівка':'картка'):''}${e.note?' · '+esc(e.note):''}</div></div>
        <div class="rval tnum neg">${money(e.amount)}</div><span class="chev">›</span>
      </div>
    </div>`;
  }).join('');
}
function updateExpenseList(){
  const all=[...DB.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const list=all.filter(e=>inPeriod(e.date));
  const el=$('#expListGroup'); if(el) el.innerHTML=expenseListHtml(list);
}
function renderExpenses(){
  const all=[...DB.expenses].sort((a,b)=>b.date.localeCompare(a.date));
  const list=all.filter(e=>inPeriod(e.date));
  const periods=[['today','Сьогодні'],['7d','7 днів'],['month','Місяць'],['year','Рік'],['all','Весь час']];
  let html=`<div class="seg">${periods.map(p=>`<button class="${PERIOD===p[0]?'on':''}" onclick="PERIOD='${p[0]}';render()">${p[1]}</button>`).join('')}
    <button class="${PERIOD==='custom'?'on':''}" onclick="openCustomPeriod()">Період</button></div>`;

  if(!all.length){
    html+=`<div class="group" style="margin-top:14px"><div class="empty">Витрат ще немає.<br>Пальне та зарядки записуються у вкладці «Авто».</div></div>`;
    $('#main').innerHTML=html; return;
  }

  const total=list.reduce((a,e)=>a+num(e.amount),0);
  const byCat={}; list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=Math.max(1,...catRows.map(r=>r[1]));

  html+=`<div class="hero" style="margin-top:14px"><div class="lbl">Витрати за період</div><div class="big tnum neg">${money(total)}</div><div class="sub">${list.length} ${list.length===1?'запис':'записів'}</div></div>`;

  if(catRows.length){
    html+=`<div class="section-label">По категоріях</div><div class="group">`;
    catRows.forEach(([cid,val])=>{
      const cat=catById(cid); const pct=Math.round(val/maxCat*100);
      html+=`<div class="barrow"><div class="bhead"><span>${esc(cat.name)}</span><b class="tnum">${money(val)}</b></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:var(--red)"></div></div></div>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="section-label">Записи</div>
  <div class="field" style="margin-top:0"><input type="search" placeholder="🔍 Пошук за нотаткою, категорією, авто…" value="${esc(expSearchQ)}" oninput="expSearchQ=this.value;updateExpenseList()"></div>
  <div class="chipwrap" style="margin:-4px 0 10px">
    <button type="button" class="chip ${!expSearchCatFilter?'on':''}" onclick="expSearchCatFilter='';renderExpenses()">Всі категорії</button>
    ${EXP_CATS.map(c=>`<button type="button" class="chip ${expSearchCatFilter===c.id?'on':''}" onclick="expSearchCatFilter='${c.id}';renderExpenses()">${esc(c.name)}</button>`).join('')}
  </div>
  <div class="group" id="expListGroup">${expenseListHtml(list)}</div>`;
  $('#main').innerHTML=html;
}

function computeConsumption(car, logsAny){
  const logs=[...logsAny].sort((a,b)=>a.odo-b.odo);
  const fullIdx=[]; logs.forEach((f,i)=>{ if(f.full) fullIdx.push(i); });
  if(fullIdx.length<2) return {value:null, costPerKm:null};
  const i1=fullIdx[fullIdx.length-2], i2=fullIdx[fullIdx.length-1];
  const odo1=logs[i1].odo, odo2=logs[i2].odo;
  const dist=odo2-odo1;
  if(dist<=0) return {value:null, costPerKm:null};
  let amt=0, cost=0;
  for(let i=i1+1;i<=i2;i++){ amt+=num(logs[i].amount); cost+=num(logs[i].cost); }
  return { value: amt/dist*100, costPerKm: cost/dist };
}

function savePlate(id){
  const c=carById(id); if(!c) return;
  const newStandard=$('#plStandard').value.trim().toUpperCase();
  const newVanity=$('#plVanity').value.trim();
  const seg=$('#plDisplaySeg');
  const btns=[...seg.querySelectorAll('button')];
  const onIdx=btns.findIndex(b=>b.classList.contains('on'));
  const newDisplay = onIdx===1 && newVanity ? 'vanity' : 'standard';
  const prev={ plateStandard:c.plateStandard||'', plateVanity:c.plateVanity||'', plateDisplay:c.plateDisplay||'standard' };
  const changed = prev.plateStandard!==newStandard || prev.plateVanity!==newVanity || prev.plateDisplay!==newDisplay;
  c.plateStandard=newStandard; c.plateVanity=newVanity; c.plateDisplay=newDisplay;
  if(changed){
    c.plateLog=c.plateLog||[];
    const parts=[];
    if(prev.plateStandard!==newStandard) parts.push(`звичайний ${prev.plateStandard||'—'} → ${newStandard||'—'}`);
    if(prev.plateVanity!==newVanity) parts.push(`іменний ${prev.plateVanity||'—'} → ${newVanity||'—'}`);
    if(prev.plateDisplay!==newDisplay) parts.push(`у назві показується: ${newDisplay==='vanity'?'іменний':'звичайний'}`);
    c.plateLog.push({ t:Date.now(), text:parts.length?('Змінено номер: '+parts.join('; ')):'Оновлено номер', prev });
  }
  save(); renderCarDetail(id);
}
function revertPlateLog(carId, idx){
  const c=carById(carId); if(!c) return;
  const entry=c.plateLog&&c.plateLog[idx]; if(!entry||!entry.prev) return;
  const cur={ plateStandard:c.plateStandard||'', plateVanity:c.plateVanity||'', plateDisplay:c.plateDisplay||'standard' };
  Object.assign(c, entry.prev);
  c.plateLog.push({ t:Date.now(), text:'Відновлено попередній номер', prev:cur });
  save(); renderCarDetail(carId);
}

/* ============ CIRCULAR PHOTO CROP ============ */
let CROP={img:null, natW:0, natH:0, baseScale:1, zoom:1, offX:0, offY:0, target:null, targetId:null, dragging:false, lastX:0, lastY:0};
function cropDragStart(e){ CROP.dragging=true; CROP.lastX=e.clientX; CROP.lastY=e.clientY; e.preventDefault(); }
function cropDragMove(e){ if(!CROP.dragging) return; const dx=e.clientX-CROP.lastX, dy=e.clientY-CROP.lastY; CROP.lastX=e.clientX; CROP.lastY=e.clientY; CROP.offX+=dx; CROP.offY+=dy; renderCropPreview(); }
function cropDragEnd(){ CROP.dragging=false; }
function openCropModal(dataUrl, target, targetId){
  const img=new Image();
  img.onload=()=>{
    CROP={ img, natW:img.width, natH:img.height, baseScale:200/Math.min(img.width,img.height), zoom:1, offX:0, offY:0, target, targetId, dragging:false, lastX:0, lastY:0 };
    showSheet(`
      <h3>Кадрування фото</h3>
      <div class="confirm-msg">Перетягніть, щоб перемістити, і використайте повзунок для масштабу.</div>
      <div id="cropBox" style="width:200px;height:200px;border-radius:50%;overflow:hidden;position:relative;background:var(--fill);margin:14px auto;touch-action:none;cursor:grab">
        <img id="cropImg" style="position:absolute;user-select:none;pointer-events:none" src="${dataUrl}">
      </div>
      <input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%" oninput="CROP.zoom=this.value/100;renderCropPreview()">
      <div class="row2" style="margin-top:14px">
        <button class="btn ghost" onclick="closeCropModal()">Скасувати</button>
        <button class="btn primary" onclick="confirmCrop()">Зберегти</button>
      </div>
    `, {center:true});
    renderCropPreview();
    const box=$('#cropBox');
    box.addEventListener('pointerdown', cropDragStart);
    window.addEventListener('pointermove', cropDragMove);
    window.addEventListener('pointerup', cropDragEnd);
  };
  img.src=dataUrl;
}
function renderCropPreview(){
  const im=$('#cropImg'); if(!im) return;
  const scale=CROP.baseScale*CROP.zoom;
  const w=CROP.natW*scale, h=CROP.natH*scale;
  im.style.width=w+'px'; im.style.height=h+'px';
  im.style.left=(100-w/2+CROP.offX)+'px'; im.style.top=(100-h/2+CROP.offY)+'px';
}
function closeCropModal(){
  window.removeEventListener('pointermove', cropDragMove);
  window.removeEventListener('pointerup', cropDragEnd);
  closeSheet();
}
function confirmCrop(){
  const scale=CROP.baseScale*CROP.zoom;
  const w=CROP.natW*scale, h=CROP.natH*scale;
  const left=100-w/2+CROP.offX, top=100-h/2+CROP.offY;
  const canvas=document.createElement('canvas'); canvas.width=200; canvas.height=200;
  const ctx=canvas.getContext('2d');
  ctx.save(); ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.closePath(); ctx.clip();
  ctx.drawImage(CROP.img, left, top, w, h);
  ctx.restore();
  const dataUrl=canvas.toDataURL('image/jpeg',0.85);
  const target=CROP.target, targetId=CROP.targetId;
  window.removeEventListener('pointermove', cropDragMove);
  window.removeEventListener('pointerup', cropDragEnd);
  closeSheet();
  if(target==='car'){ const c=carById(targetId); if(c){ c.photo=dataUrl; save(); } renderCarDetail(targetId); }
  else if(target==='profile'){ DB.profile.photo=dataUrl; save(); openSettings(); }
}

function carServiceTrendHtml(c){
  const svcExp=DB.expenses.filter(e=>e.carId===c.id && e.category==='service');
  if(!svcExp.length) return '';
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:d.toLocaleDateString('uk-UA',{month:'short'}) });
  }
  const byMonth={}; months.forEach(m=>byMonth[m.key]=0);
  svcExp.forEach(e=>{ const k=e.date.slice(0,7); if(k in byMonth) byMonth[k]+=num(e.amount); });
  const max=Math.max(1,...Object.values(byMonth));
  const total6=Object.values(byMonth).reduce((a,b)=>a+b,0);
  return `<div class="section-label">Витрати на обслуговування по місяцях</div>
  <div class="group" style="padding:12px 14px">
    ${months.map(m=>{ const v=byMonth[m.key]; const pct=Math.round(v/max*100); return `<div class="barrow"><div class="bhead"><span style="text-transform:capitalize">${esc(m.label)}</span><b class="tnum">${money(v)}</b></div><div class="btrack"><div class="bfill" style="width:${pct}%;background:var(--red)"></div></div></div>`; }).join('')}
    <div class="sub" style="margin-top:8px">Разом за 6 міс.: ${money(total6)}</div>
  </div>`;
}

function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); const t=new Date(today()+'T00:00:00'); return Math.round((d-t)/86400000); }
function dueBadge(days){ if(days===null) return ''; if(days<0) return `<span class="dot r"></span> прострочено на ${-days} дн.`; if(days<=3) return `<span class="dot r"></span> через ${days} дн.`; if(days<=10) return `<span class="dot y"></span> через ${days} дн.`; return `<span class="dot g"></span> через ${days} дн.`; }
function allPayments(){
  const items=[];
  activeCars().forEach(c=>{
    if(c.loan && num(c.loan.monthlyPayment)>0 && c.loan.nextDate){
      items.push({ carId:c.id, carName:c.name, kind:'loan', label:'Кредит / лізинг', amount:num(c.loan.monthlyPayment), date:c.loan.nextDate });
    }
    carInsurances(c).forEach(ins=>{
      if(!ins.renewDate) return;
      const t=INSURANCE_TYPES[ins.type]||INSURANCE_TYPES.other;
      const amt = ins.mode==='period' ? num(ins.totalCost) : num(ins.monthly);
      if(amt<=0) return;
      items.push({ carId:c.id, carName:c.name, kind:'insurance', label:t.label, amount:amt, date:ins.renewDate });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items;
}

function saveInsuranceForm(carId, idx){

function openCarPlatformDetail(carId, pid){
  const c=carById(carId);
  const shifts=DB.shifts.filter(s=>s.carId===carId && inPeriod(s.date));
  const shiftsWith=shifts.filter(s=>(s.entries||[]).some(e=>e.platformId===pid));
  const p=platById(pid);
  let income=0, orders=0, hasOrders=false, commission=0, hasCommission=0, grossTotal=0, tips=0;
  shiftsWith.forEach(s=>(s.entries||[]).forEach(e=>{
    if(e.platformId!==pid) return;
    income+=num(e.amount)+num(e.tips); tips+=num(e.tips);
    if(e.orders){ orders+=e.orders; hasOrders=true; }
    if(e.commission!=null){ commission+=e.commission; hasCommission++; grossTotal+=num(e.gross); }
  }));
  let hours=0;
  shiftsWith.forEach(s=>{ const ph=s.platformHours; if(ph && ph[pid]!==undefined) hours+=ph[pid]; else if((s.entries||[]).length===1) hours+=num(s.hours); });
  let html=`<h3>${esc(p?p.name:'Платформа')}</h3><div class="confirm-msg">${esc(c?c.name:'')} · ${shiftsWith.length} ${shiftsWith.length===1?'зміна':'змін'} за період</div>`;
  html+=`<div class="group">
    <div class="row"><div class="rtitle"><b>Дохід</b></div><div class="rval tnum pos">${money(income)}</div></div>
    ${tips>0?`<div class="row"><div class="rtitle"><b>З них чайові</b></div><div class="rval tnum">${money(tips)}</div></div>`:''}
    ${hours?`<div class="row"><div class="rtitle"><b>Години</b></div><div class="rval tnum">${hours.toFixed(1)} год</div></div><div class="row"><div class="rtitle"><b>₴ за годину</b></div><div class="rval tnum">${money(income/hours)}</div></div>`:''}
    ${hasOrders?`<div class="row"><div class="rtitle"><b>Кількість замовлень</b></div><div class="rval tnum">${orders}</div></div>`:''}
    ${hasCommission?`<div class="row"><div class="rtitle"><b>Комісія сплачена</b></div><div class="rval tnum neg">${money(commission)}</div><div class="sub">із брудного доходу ${money(grossTotal)}${grossTotal?' · '+(commission/grossTotal*100).toFixed(1)+'%':''}</div></div>`:''}
    ${p&&p.commissionPct?`<div class="row"><div class="rtitle"><b>Комісія за замовчуванням</b></div><div class="rval tnum">${p.commissionPct}%</div></div>`:''}
  </div>`;
  if(!hasOrders && !hasCommission) html+=`<div class="confirm-msg" style="margin-top:10px">Щоб бачити кількість замовлень і комісію тут, вводьте дохід через «Ввести деталі» при завершенні зміни.</div>`;
  showSheet(html);
}

/* ============ SHEETS / MODALS ============ */
function showSheet(innerHTML, opts={}){
  const center = !!opts.center;
  const existing=document.getElementById('sheetLayer'); if(existing) existing.remove();
  const wrap=document.createElement('div');
  wrap.id='sheetLayer';
  wrap.innerHTML=`
    <div class="overlay ${center?'center':''}" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" style="position:relative">
        ${center?'':'<div class="handle"></div>'}
        <button class="close" onclick="closeSheet()">✕</button>
        ${innerHTML}
      </div>
    </div>`;
  document.body.appendChild(wrap);
}
function closeSheet(){
  const el=document.getElementById('sheetLayer'); if(!el) return;
  const overlay=el.querySelector('.overlay');
  if(overlay && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    overlay.classList.add('closing');
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, 190);
  }else{
    el.remove();
  }
}
function alertSheet(title,msg){
  showSheet(`<h3>${esc(title)}</h3><div class="confirm-msg">${esc(msg)}</div><button class="btn ghost" onclick="closeSheet()">Зрозуміло</button>`, {center:true});
}
function confirmAction(opts){
  window.__pendingDelete=opts.onConfirm;
  window.__pendingCancel=opts.onCancel||function(){};
  window.__step2opts=opts;
  const skip = opts.skipStep2 || (DB.settings && DB.settings.doubleConfirm===false);
  const btnClass = opts.danger?'danger':'primary';
  if(skip){
    showSheet(`
      <h3>${esc(opts.title)}</h3>
      <div class="confirm-msg">${esc(opts.msg)}</div>
      <div class="confirm-actions">
        <button class="btn ${btnClass}" onclick="runDelete()">${esc(opts.actionLabel)}</button>
        <button class="btn ghost" onclick="runCancel()">Скасувати</button>
      </div>
    `, {center:true});
    return;
  }
  showSheet(`
    <h3>${esc(opts.title)}</h3>
    <div class="confirm-msg">${esc(opts.msg)}</div>
    <div class="confirm-actions">
      <button class="btn ${btnClass}" onclick="confirmActionStep2()">${esc(opts.actionLabel)}</button>
      <button class="btn ghost" onclick="runCancel()">Скасувати</button>
    </div>
  `, {center:true});
}
function confirmActionStep2(){
  const opts=window.__step2opts||{};
  const btnClass = opts.danger?'danger':'primary';
  showSheet(`
    <h3>${esc(opts.step2Title||'Підтвердження')}</h3>
    <div class="confirm-msg">${esc(opts.step2Msg||'Ви впевнені?')}</div>
    <div class="confirm-actions">
      <button class="btn ${btnClass}" onclick="runDelete()">${esc(opts.step2Label||'Я розумію, підтверджую')}</button>
      <button class="btn ghost" onclick="runCancel()">Скасувати</button>
    </div>
  `, {center:true});
}
function confirmDelete(title, msg, onConfirm, onCancel){
  confirmAction({
    title, msg, actionLabel:'Видалити', danger:true,
    step2Title:'Останнє підтвердження',
    step2Msg:`Цю дію не можна скасувати. ${title.replace('?','')}?`,
    step2Label:'Я розумію, видалити назавжди',
    onConfirm, onCancel
  });
}
function runDelete(){ closeSheet(); if(typeof window.__pendingDelete==='function'){ window.__pendingDelete(); window.__pendingDelete=null; } window.__pendingCancel=null; }
function runCancel(){ closeSheet(); if(typeof window.__pendingCancel==='function'){ window.__pendingCancel(); } window.__pendingDelete=null; window.__pendingCancel=null; }

/* ============ THEME ============ */
const THEME_KEY='vodiy_theme';
function getTheme(){ try{ return localStorage.getItem(THEME_KEY)||'system'; }catch(e){ return 'system'; } }
function applyTheme(mode){
  try{
    if(mode==='system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    localStorage.setItem(THEME_KEY, mode);
  }catch(e){}
}

function copyCode(text, el){
  const label = el ? el.textContent : '';
  const done=()=>{ if(el){ el.textContent='✓ Скопійовано'; setTimeout(()=>{ if(el) el.textContent=label; },1400); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ alertSheet('Код для копіювання', text); });
  }else{
    alertSheet('Код для копіювання', text);
  }
}
function detectInstallPlatform(){
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/.test(ua)) return 'ios';
  if(/Android/.test(ua)) return 'android';
  return 'ios';
}

function buildExportTelegram(){
