function csvEscape(v){ v=String(v??''); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function buildShiftsCsv(list){
  const rows=[['Дата','Авто','Платформа','Сума','Чайові','Години','Км','Нотатка']];
  [...list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    const c=carById(s.carId);
    if((s.entries||[]).length){
      s.entries.forEach(e=>{ const p=platById(e.platformId); rows.push([s.date, c?c.name:'', p?p.name:'Без платформи', num(e.amount), num(e.tips), s.hours||'', s.km||'', s.note||'']); });
    }else{
      rows.push([s.date, c?c.name:'', '', 0, 0, s.hours||'', s.km||'', s.note||'']);
    }
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function buildExpensesCsv(list){
  const rows=[['Дата','Категорія','Авто','Сума','Тип','Оплата','Нотатка']];
  [...list].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const c=carById(e.carId); const cat=catById(e.category);
    rows.push([e.date, cat.name, c?c.name:'', num(e.amount), e.work?'робоча':'особиста', e.payment==='cash'?'готівка':'картка', e.note||'']);
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function downloadCsv(text, filename){
  try{
    const blob=new Blob(['﻿'+text], {type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ alertSheet('Не вдалося завантажити файл','Спробуйте інший спосіб експорту — наприклад «Експорт для бухгалтера».'); }
}

function scheduleUpdateChecks(){
  if(updateCheckTimerId) clearInterval(updateCheckTimerId);
  updateCheckTimerId=setInterval(()=>{
    const minutes=Math.max(15, num(DB.settings.updateCheckMinutes)||60);
    if(Date.now()-getLastUpdateCheck() >= minutes*60000) checkForUpdate(false);
  }, 60000);
  // catch up immediately if the configured interval already elapsed since last check (e.g. app reopened later)
  const minutes=Math.max(15, num(DB.settings.updateCheckMinutes)||60);
  if(Date.now()-getLastUpdateCheck() >= minutes*60000) checkForUpdate(false);

  window.copyBackup=async ()=>{
    const ta=$('#bkExportText');
    try{ await navigator.clipboard.writeText(ta.value); markBackupDone(); alertSheet('Скопійовано','Резервну копію скопійовано в буфер обміну. Збережіть цей текст десь надійно.'); }
    catch(e){ ta.select(); try{ document.execCommand('copy'); markBackupDone(); alertSheet('Скопійовано','Резервну копію скопійовано в буфер обміну.'); }catch(e2){ alertSheet('Не вдалося скопіювати','Виділіть текст вручну і скопіюйте.'); } }
  };
  window.importBackup=()=>{
    const file=$('#bkFile').files && $('#bkFile').files[0];
    if(file){
      const reader=new FileReader();
      reader.onload=()=>{ tryApplyBackup(reader.result); };
      reader.onerror=()=>{ alertSheet('Не вдалося прочитати файл','Спробуйте скопіювати текст резервної копії й вставити його в поле вище.'); };
      reader.readAsText(file);
      return;
    }
    const text=$('#bkImportText').value.trim();
    if(!text){ alertSheet('Немає даних','Вставте текст резервної копії або оберіть файл.'); return; }
    tryApplyBackup(text);
  };
}
function tryApplyBackup(text){
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ alertSheet('Не вдалося прочитати', 'Це не схоже на коректну резервну копію. Перевірте, чи весь текст скопійовано без пропусків.'); return; }
  if(!data || typeof data!=='object' || !Array.isArray(data.cars) || !Array.isArray(data.shifts)){
    alertSheet('Не схоже на резервну копію', 'У цьому тексті не знайдено очікуваних даних застосунку (авто, зміни тощо).'); return;
  }
  confirmAction({
    title:'Відновити з резервної копії?',
    msg:`Це замінить усі поточні дані застосунку: ${data.cars.length} авто, ${data.shifts.length} змін, ${(data.expenses||[]).length} витрат. Поточні дані буде втрачено, якщо їх не збережено окремо. Продовжити?`,
    actionLabel:'Відновити', danger:true,
    onConfirm:()=>{
      DB=data;
      if(!DB.contacts) DB.contacts=[];
      if(!DB.goals) DB.goals={daily:0, weekly:0, monthly:0};
      if(!DB.reminders) DB.reminders=[];
      if(!DB.referralLinks) DB.referralLinks=REFERRAL_LINKS_DEFAULT.map(r=>({...r}));
      if(!DB.profile) DB.profile={workType:'both', fop:'none', taxGroup2Fixed:0, taxGroup3Rate:5, esvMonthly:0};
      if(DB.profile.taxGroup2Fixed===undefined) DB.profile.taxGroup2Fixed=0;
      if(DB.profile.taxGroup3Rate===undefined) DB.profile.taxGroup3Rate=5;
      if(DB.profile.esvMonthly===undefined) DB.profile.esvMonthly=0;
      if(DB.activeShift===undefined) DB.activeShift=null;
      if(!DB.settings) DB.settings={yellowDays:3, redDays:7, doubleConfirm:false, showKopecks:false, accentColor:'', envelopeRate:0, envelopeWithdrawn:0, updateCheckMinutes:60};
      if(DB.settings.accentColor===undefined) DB.settings.accentColor='';
      if(DB.settings.envelopeRate===undefined) DB.settings.envelopeRate=0;
      if(DB.settings.envelopeWithdrawn===undefined) DB.settings.envelopeWithdrawn=0;
      if(DB.settings.updateCheckMinutes===undefined) DB.settings.updateCheckMinutes=60;
      if(DB.lastBackupAt===undefined) DB.lastBackupAt=null;
      if(!DB.lastUsed) DB.lastUsed={ carId:'', platformIds:[], expCategory:'', expCarId:'' };
      save(); closeSheet(); closeFullscreen(); TAB='dash'; init();
      alertSheet('Відновлено','Дані успішно відновлено з резервної копії.');
    },
    onCancel:()=>openBackupSheet()
  });
}

    body=`<h1>ФОП і податки</h1><p class="d">Потрібно, щоб рахувати, скільки залишити на податки. Можна змінити пізніше.</p>
      <div class="opt ${WIZ.fop==='none'?'on':''}" tabindex="0" onclick="WIZ.fop='none';renderWizard()"><span class="oi" style="background:var(--fill)"><svg viewBox="0 0 24 24" stroke="var(--tx2)"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></span><span style="flex:1"><b>Немає ФОП</b></span><button type="button" class="infob" onclick="event.stopPropagation();alertSheet('Немає ФОП','Ви не зареєстровані як підприємець. Оплата зазвичай надходить на особисту картку. Майте на увазі: доходи від таксі/доставки як фізособи можуть підлягати оподаткуванню за загальними правилами — за деталями краще звернутись до бухгалтера.')">i</button></div>
      <div class="opt ${WIZ.fop==='group2'?'on':''}" tabindex="0" onclick="WIZ.fop='group2';renderWizard()"><span class="oi" style="background:var(--blue)"><svg viewBox="0 0 24 24"><text x="12" y="16" font-size="12" text-anchor="middle" fill="#fff" stroke="none">2</text></svg></span><span style="flex:1"><b>ФОП, 2 група</b></span><button type="button" class="infob" onclick="event.stopPropagation();alertSheet('ФОП, 2 група','Спрощена система. Фіксований податок щомісяця незалежно від доходу, є ліміт річного доходу і обмеження, з ким можна працювати (переважно з фізособами й іншими ФОП). Підходить для більшості таксистів і кур\\'єрів.')">i</button></div>
      <div class="opt ${WIZ.fop==='group3'?'on':''}" tabindex="0" onclick="WIZ.fop='group3';renderWizard()"><span class="oi" style="background:var(--green)"><svg viewBox="0 0 24 24"><text x="12" y="16" font-size="12" text-anchor="middle" fill="#fff" stroke="none">3</text></svg></span><span style="flex:1"><b>ФОП, 3 група</b></span><button type="button" class="infob" onclick="event.stopPropagation();alertSheet('ФОП, 3 група','Теж спрощена система, але податок — відсоток від доходу (зазвичай 5%, або 3%+ПДВ), а не фіксована сума. Вищий ліміт річного доходу, менше обмежень щодо контрагентів. Вигідно, якщо дохід нестабільний або великий.')">i</button></div>`;
    foot=`<button class="btn primary" onclick="wizNext()">Далі</button><button class="btn add" onclick="wizBack()" style="text-align:center;width:100%;margin-top:4px">Назад</button>`;
  }else if(step===4){
    body=`<h1>Ваші авто</h1><p class="d">Додайте хоча б одне. Назву й деталі завжди можна змінити пізніше.</p>
      <div id="wizCars">${wizCarsHtml()}</div>
      <button class="btn add" onclick="wizAddCar()">+ Додати ще авто</button>`;
    foot=`<button class="btn primary" onclick="wizFinish()">Завершити налаштування</button><button class="btn add" onclick="wizBack()" style="text-align:center;width:100%;margin-top:4px">Назад</button>`;
  }
  $('#modalRoot').innerHTML=`<div class="fullscreen"><div class="wiz">
    <div class="wizhead"><div class="wizdots">${wizDots()}</div></div>
    <div class="wizbody">${body}</div>
    <div class="wizfoot">${foot}</div>
  </div></div>`;
}
function wizPreviewDemo(){
  confirmAction({
    title:'Переглянути демо-режим?',
    msg:'Покажемо приклад заповненого застосунку з даними — просто щоб побачити, як усе виглядає. Нічого не зберігається як ваші реальні дані; вийти з демо й повернутись до налаштування можна будь-коли кнопкою вгорі екрана.',
    actionLabel:'Показати демо', danger:false, skipStep2:true,
    onConfirm:()=>{
      try{ localStorage.setItem(REAL_BACKUP, JSON.stringify(DB)); localStorage.setItem(DEMO_FLAG,'1'); }catch(e){}
      DB=buildDemoDB(); DB.onboardingDone=true; save(); $('#modalRoot').innerHTML=''; TAB='dash'; init();
    },
    onCancel:()=>renderWizard()
  });
}
function wizNext(){ WIZ.step++; renderWizard(); }
function wizBack(){ if(WIZ.step>0){ WIZ.step--; renderWizard(); } }
function wizTogglePlat(id){ WIZ.platformIds=WIZ.platformIds.includes(id)?WIZ.platformIds.filter(x=>x!==id):[...WIZ.platformIds,id]; $('#wizPlatChips').querySelectorAll('.chip').forEach(ch=>{}); renderWizard(); }
function wizCarsHtml(){
  return WIZ.cars.map((c,i)=>`
    <div class="carcard">
      <div class="field" style="margin-bottom:8px"><label>Назва</label><input type="text" value="${esc(c.name)}" onchange="WIZ.cars[${i}].name=this.value"></div>
      <div class="field" style="margin-bottom:${WIZ.cars.length>1?'8px':'0'}"><label>Тип палива / приводу</label><select onchange="WIZ.cars[${i}].fuelType=this.value">${Object.entries(FUEL_TYPES).map(([id,f])=>`<option value="${id}" ${id===c.fuelType?'selected':''}>${f.label}</option>`).join('')}</select></div>
      ${WIZ.cars.length>1?`<button class="btn add" onclick="wizRmCar(${i})">Прибрати це авто</button>`:''}
    </div>`).join('');
}
function wizAddCar(){ WIZ.cars.push({name:'Авто '+(WIZ.cars.length+1), fuelType:'petrol'}); renderWizard(); }
function wizRmCar(i){ WIZ.cars.splice(i,1); renderWizard(); }
function wizFinish(){
  DB.profile={ workType:WIZ.workType, fop:WIZ.fop, taxGroup2Fixed:0, taxGroup3Rate:5, esvMonthly:0 };
  const chosen = PLATFORM_MASTER.filter(p=>WIZ.platformIds.includes(p.id));
  const existingCustom = DB.platforms.filter(p=>!PLATFORM_MASTER.some(m=>m.id===p.id));
  DB.platforms = [...chosen.map(p=>({...p})), ...existingCustom];
  const existingCarsById = {}; DB.cars.forEach(c=>existingCarsById[c.name]=c);
  DB.cars = WIZ.cars.map(wc=>{
    const match=DB.cars.find(c=>c.name===wc.name);
    return match ? {...match, fuelType:wc.fuelType} : { id:uid(), name:wc.name||'Авто', fuelType:wc.fuelType, odo:0, notes:'', service:[] };
  });
  DB.onboardingDone=true;
  save();
  $('#modalRoot').innerHTML='';
  setTab('dash');
  openInstallGuide();
}

/* ============ INIT ============ */
function init(){
  applyTheme(getTheme());
  applyAccent();
  renderDemobar();
  setTab(TAB);
  swipeInit();
  dashSwipeInit();
  scheduleUpdateChecks();
  if(!DB.onboardingDone && !isDemo()) startWizard();
}
init();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>

</body>
</html>
